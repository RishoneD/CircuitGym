<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תרגול זרמי חוגים</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --fg: #1f2937; --muted: #6b7280; --line: #d9dee6;
    --accent: #1d4ed8; --accent-soft: #e8efff; --ok: #15803d; --ok-soft: #e7f6ec;
    --bad: #b42318; --bad-soft: #fdecea; --warn: #9a6700; --warn-soft: #fff6db; --unk: #d9480f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 17px; line-height: 1.5; }
  header { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header .ver { font-size: 13px; opacity: .85; }
  header .home { margin-inline-start: auto; color: #fff; font-size: 15px; white-space: nowrap; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  h2 { margin: 0 0 12px; font-size: 19px; }
  h3 { margin: 18px 0 8px; font-size: 17px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 14px; padding: 10px 14px; }
  legend { padding: 0 6px; color: var(--muted); font-size: 15px; }
  .opt { display: inline-flex; align-items: center; gap: 6px; margin-inline-end: 18px; cursor: pointer; }
  .opt input, .switch input { width: 18px; height: 18px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .switch { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; cursor: pointer; }
  select, input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid #b8c0cc; border-radius: 8px; background: #fff; color: var(--fg); }
  button { font: inherit; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--accent);
           background: #fff; color: var(--accent); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.link { border: none; background: none; padding: 4px 0; text-decoration: underline; }
  .note { color: var(--muted); font-size: 15px; min-height: 1.2em; margin: 4px 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 8px; }
  .badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 12px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 15px; }
  .q { font-size: 18px; margin: 6px 0 10px; }
  .circuit { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; }
  .circuit svg { width: 100%; height: auto; display: block; margin: 0 auto; }
  .givens { margin: 10px 0 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { background: #f1f3f6; border-radius: 6px; padding: 1px 8px; font-size: 16px; white-space: nowrap; }
  .chip.unk { background: #fff0e6; color: var(--unk); font-weight: 600; }
  .ans { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 14px 0 8px; }
  .ansbox { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ansbox input { width: 8.5em; }
  .fb { border-radius: 8px; padding: 0; margin: 8px 0; }
  .fb:not(:empty) { padding: 8px 12px; }
  .fb.ok { background: var(--ok-soft); color: var(--ok); }
  .fb.bad { background: var(--bad-soft); color: var(--bad); }
  .fb.warn { background: var(--warn-soft); color: var(--warn); }
  #steps { padding-inline-start: 22px; margin: 0; }
  #steps li { margin-bottom: 10px; }
  #steps .sn { color: var(--muted); font-size: 15px; }
  #steps .eq { font-family: Consolas, "Courier New", monospace; font-size: 16px; text-align: left; overflow-x: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .actions .actions { margin-top: 0; }
  .seed { color: #a0a7b3; font-size: 12px; text-align: left; margin-top: 10px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 16px 24px; }
  bdi[dir=ltr], [dir=ltr] { unicode-bidi: isolate; }
  [hidden] { display: none !important; }
  .ansrows { display: flex; flex-direction: column; gap: 8px; }
  .ansbox .usym { min-width: 1.6em; text-align: right; }
  .dirbox select { min-width: 9em; }
  #summary li { margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>תרגול זרמי חוגים</h1>
  <span class="ver" dir="ltr" id="ver"></span>
  <a class="home" href="../index.html">→ לדף הראשי</a>
</header>

<main>
  <section id="setup" class="card">
    <h2>הגדרות תרגול</h2>
    <label class="row">רמת קושי התחלתית:
      <select id="level">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>
    <label class="switch"><input type="checkbox" id="power"> כולל נושא הספק</label>
    <label class="switch"><input type="checkbox" id="prefixes"> כולל תחיליות <bdi dir="ltr">(k, m, µ)</bdi></label>
    <p id="setNote" class="note"></p>
    <button id="start" class="primary">התחלה</button>
  </section>

  <section id="play" class="card" hidden>
    <div class="bar">
      <span id="lvl" class="badge"></span>
      <span id="tries" class="muted"></span>
    </div>
    <p id="qtext" class="q"></p>
    <div id="circuit" class="circuit" dir="ltr"></div>
    <div id="givens" class="givens"></div>
    <div id="unknown" class="givens"></div>

    <form id="ansForm" class="ans" autocomplete="off">
      <label>התשובה:</label>
      <div id="ansRows" class="ansrows"></div>
      <button type="submit" id="checkBtn" class="primary">בדיקה</button>
    </form>

    <div id="feedback" class="fb" role="status" aria-live="polite"></div>
    <div id="solution" hidden>
      <h3>הזרמים במעגל</h3>
      <ul id="summary"></ul>
    </div>

    <div class="actions">
      <span id="choices" class="actions" hidden></span>
      <button id="next" type="button">תרגיל חדש</button>
      <button id="back" type="button">חזרה להגדרות</button>
    </div>
    <div id="seed" class="seed" dir="ltr"></div>
  </section>
</main>

<footer>נוצר על ידי ראשון דיבקר בעזרת Claude · <span dir="ltr" id="ver2"></span></footer>

<!-- ======================= מנוע (ללא DOM) ======================= -->
<script id="engine">
(function (global) {
  'use strict';

  const VERSION = 'v1.5';
  const MAX_LEVEL = 5;
  const MAX_ATTEMPTS = 3;
  const TOL = 0.01;        // סטייה יחסית מותרת (1%)
  const MAX_TRIES = 6000;  // הגרלות עד מעגל עם תשובות ונתונים "נקיים"

  // ערכים "יפים" כמו בשאלות לדוגמה: נגד = בסיס × קנה מידה אחד לכל המעגל
  const VALUES = {
    RB: [1, 1.5, 2, 2.4, 3, 4, 5, 6, 8, 10, 12, 15, 20, 24, 30, 40, 48, 50, 60, 80],
    RS: [1, 10, 100],
    E: [1.5, 3, 4, 4.5, 5, 6, 9, 10, 12, 15, 18, 20, 24, 30, 36, 40, 45, 48, 50],
  };
  const sum = a => a.reduce((s, x) => s + x, 0);

  // ---------------- Rng (mulberry32, seedable) ----------------
  function makeRng(seed) {
    let a = seed >>> 0;
    const next = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const int = (lo, hi) => lo + Math.floor(next() * (hi - lo + 1));
    const pick = arr => arr[Math.floor(next() * arr.length)];
    const shuffle = arr => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = int(0, i); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    return { next, int, pick, shuffle };
  }
  const randomSeed = () => (Math.random() * 4294967296) >>> 0;

  // ---------------- Units ----------------
  const PREFIXES = [{ p: 'M', f: 1e6 }, { p: 'k', f: 1e3 }, { p: '', f: 1 }, { p: 'm', f: 1e-3 }, { p: 'µ', f: 1e-6 }];
  const roundSig = (x, s) => (x === 0 ? 0 : Number(x.toPrecision(s)));
  function numStr(v) {
    let s = String(v);
    if (/e/i.test(s)) s = v.toFixed(15).replace(/\.?0+$/, '');
    return s;
  }
  function pickPrefix(x) {
    const a = Math.abs(x);
    for (const P of PREFIXES) if (a >= P.f * (1 - 1e-9)) return P;
    return PREFIXES[PREFIXES.length - 1];
  }
  const Units = {
    format(x, unit, prefixes, sig = 4) {
      const P = prefixes ? pickPrefix(x) : { p: '', f: 1 };
      return numStr(roundSig(x / P.f, sig)) + ' ' + P.p + unit;
    },
    formatAnswer(x, unit, prefixes) {
      const P = prefixes ? pickPrefix(x) : { p: '', f: 1 };
      let v = x / P.f;
      v = Math.abs(v) >= 1 ? Math.round(v * 100) / 100 : roundSig(v, 3);
      return numStr(v) + ' ' + P.p + unit;
    },
    parseNumber(str) {
      const s = String(str).trim().replace(',', '.');
      return /^(\d+(\.\d*)?|\.\d+)$/.test(s) ? Number(s) : NaN;
    },
    check(student, correct) { return Math.abs(student - correct) <= TOL * Math.abs(correct); },
    prefixHint(student, correct) { return [1e3, 1e6, 1e-3, 1e-6].some(k => Units.check(student, correct * k)); },
    // "נקי": מדויק בעד 3 ספרות משמעותיות
    isClean(x) { const a = Math.abs(x); return a > 0 && Math.abs(roundSig(a, 3) - a) <= 1e-9 * a; },
  };

  // ---------------- Circuit ----------------
  // שלושה ענפים בין צומת עליון לצומת תחתון. כל ענף = מסלול מהצומת התחתון לעליון, מורכב ממקטעים (slots):
  // L: Lb (פס תחתון שמאלה) → Lv (אנכי שמאלי, למעלה) → Lt (פס עליון ימינה)
  // M: Mv (אנכי אמצעי, למעלה)
  // R: Rb (פס תחתון ימינה) → Rv (אנכי ימני, למעלה) → Rt (פס עליון שמאלה)
  // פריט: { k:'R', idx, R } | { k:'E', idx, E, pol } (pol=+1: הקוטב החיובי למעלה) | { k:'A', idx }
  const BRANCH_SLOTS = { L: ['Lb', 'Lv', 'Lt'], M: ['Mv'], R: ['Rb', 'Rv', 'Rt'] };
  const R_ORDER = ['Lt', 'Lv', 'Lb', 'Mv', 'Rt', 'Rv', 'Rb'];   // מספור נגדים כמו בשאלות לדוגמה
  const OUTER = { L: ['Lt', 'Lv', 'Lb'], R: ['Rt', 'Rv', 'Rb'] };

  function buildCircuit(rng, cfg) {
    const slots = { Lb: [], Lv: [], Lt: [], Mv: [], Rb: [], Rv: [], Rt: [] };
    // נגדים: אחד בכל ענף לפחות (באמצע תמיד), השאר במקומות פנויים בענפים החיצוניים
    const pos = new Set(['Mv', rng.pick(OUTER.L), rng.pick(OUTER.R)]);
    const free = rng.shuffle(OUTER.L.concat(OUTER.R).filter(p => !pos.has(p)));
    while (pos.size < cfg.nR) pos.add(free.shift());
    const scale = rng.pick(VALUES.RS);
    let ri = 0;
    R_ORDER.forEach(p => { if (pos.has(p)) slots[p].push({ k: 'R', idx: ++ri, R: rng.pick(VALUES.RB) * scale, slot: p }); });
    // סוללות: שמאל, (אמצע), ימין, בכיוון אקראי; בענף אנכי סדר הנגד והסוללה אקראי
    const eBranches = cfg.nE === 3 ? ['Lv', 'Mv', 'Rv'] : ['Lv', 'Rv'];
    eBranches.forEach((p, i) => {
      const e = { k: 'E', idx: i + 1, E: rng.pick(VALUES.E), pol: rng.next() < 0.5 ? 1 : -1, slot: p };
      if (rng.next() < 0.5) slots[p].push(e); else slots[p].unshift(e);
    });
    return solve({ slots, nE: cfg.nE, nR: cfg.nR });
  }
  const items = (c, b) => [].concat(...BRANCH_SLOTS[b].map(s => c.slots[s]));
  function solve(c) {
    c.branch = {};
    for (const b of ['L', 'M', 'R']) {
      const it = items(c, b);
      c.branch[b] = { R: sum(it.filter(x => x.k === 'R').map(x => x.R)), s: sum(it.filter(x => x.k === 'E').map(x => x.pol * x.E)) };
    }
    const B = c.branch;
    c.V = sum(['L', 'M', 'R'].map(b => B[b].s / B[b].R)) / sum(['L', 'M', 'R'].map(b => 1 / B[b].R));
    for (const b of ['L', 'M', 'R']) {
      B[b].I = (B[b].s - c.V) / B[b].R;   // זרם לאורך המסלול (מהצומת התחתון לעליון)
      let phi = 0;
      items(c, b).forEach(x => {
        x.branch = b; x.I = B[b].I; x.phiIn = phi;
        if (x.k === 'R') phi -= B[b].I * x.R;
        else if (x.k === 'E') phi += x.pol * x.E;
        x.phiOut = phi;
      });
    }
    c.res = R_ORDER.map(p => c.slots[p].filter(x => x.k === 'R')).reduce((a, b) => a.concat(b), []);
    c.bats = ['Lv', 'Mv', 'Rv'].map(p => c.slots[p].find(x => x.k === 'E')).filter(Boolean);
    return c;
  }
  function validCircuit(c) {
    const Is = ['L', 'M', 'R'].map(b => Math.abs(c.branch[b].I)), mx = Math.max(...Is);
    return mx <= 10 && Math.min(...Is) >= 1e-4 && Math.min(...Is) >= 0.05 * mx;
  }

  // ---------------- Questions ----------------
  // מחזירות: { answers, text, clean:[...], marks?:{A,B}, hidden?:Map(item -> 'ask'|'name'), meters?:[branch] }
  // נקודה = { item, end:'in'|'out' } או { node:'T'|'B' }
  const ptPhi = (c, p) => (p.node ? (p.node === 'T' ? c.V : 0) : p.item[p.end === 'in' ? 'phiIn' : 'phiOut']);
  function allPoints(c) {
    const pts = [{ node: 'T' }, { node: 'B' }];
    for (const b of ['L', 'M', 'R']) items(c, b).forEach(x => pts.push({ item: x, end: 'in' }, { item: x, end: 'out' }));
    return pts;
  }
  const BAT_TEXT = i => `E_${i}`;
  const Q = {
    I_R(rng, c) {
      const r = rng.pick(c.res), v = Math.abs(r.I);
      return { answers: [{ sym: `I_R${r.idx}`, value: v, unit: 'A' }], clean: [v], text: `חשבו את הזרם הזורם דרך הנגד R_${r.idx}.` };
    },
    P_R(rng, c) {
      const r = rng.pick(c.res), v = r.I * r.I * r.R;
      return { answers: [{ sym: `P_R${r.idx}`, value: v, unit: 'W' }], clean: [v], text: `חשבו את ההספק המתפתח בנגד R_${r.idx}.` };
    },
    I_R_dir(rng, c) {
      const r = rng.pick(c.res), v = Math.abs(r.I), aIn = rng.next() < 0.5;
      const marks = { A: { item: r, end: aIn ? 'in' : 'out' }, B: { item: r, end: aIn ? 'out' : 'in' } };
      const dir = (r.I > 0) === aIn ? 'AB' : 'BA';   // זרם חיובי זורם מ-in ל-out
      return { answers: [{ sym: `I_R${r.idx}`, value: v, unit: 'A' }, { dir: true, value: dir }], clean: [v], marks,
        text: `חשבו את הזרם הזורם דרך הנגד R_${r.idx}, וקבעו את כיוונו: מ-A ל-B או מ-B ל-A.` };
    },
    I12(rng, c) {
      const [a, b] = rng.shuffle(c.bats).slice(0, 2).sort((x, y) => x.idx - y.idx);
      const va = Math.abs(a.I), vb = Math.abs(b.I);
      return { answers: [{ sym: `I_${a.idx}`, value: va, unit: 'A' }, { sym: `I_${b.idx}`, value: vb, unit: 'A' }], clean: [va, vb],
        text: `חשבו את הזרם I_${a.idx} הזורם דרך הסוללה ${BAT_TEXT(a.idx)} ואת הזרם I_${b.idx} הזורם דרך הסוללה ${BAT_TEXT(b.idx)}.` };
    },
    V_AB(rng, c) {
      const pts = rng.shuffle(allPoints(c));
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const A = pts[i], B = pts[j], v = Math.abs(ptPhi(c, A) - ptPhi(c, B));
        if (samePlace(A, B) || v < 0.5) continue;
        return { answers: [{ sym: 'V_AB', value: v, unit: 'V' }], clean: [v], marks: { A, B }, text: 'חשבו את המתח בין הנקודות A ו-B.' };
      }
      return null;
    },
    // הפוכות: מדי זרם על שני ענפים (ולכן כל הזרמים ידועים). ענף אחד נשאר ידוע לגמרי, ממנו מתח הצמתים.
    R_rev(rng, c) { return reverse(rng, c, 'R'); },
    E_rev(rng, c) { return reverse(rng, c, 'E'); },
    VAB_rev(rng, c) { return reverse(rng, c, 'V'); },
  };
  // נקודות שמשורטטות באותו מקום (קצה פריט שנוגע בצומת או בפריט הבא) מטופלות כאחת
  function samePlace(A, B) {
    const key = p => (p.node ? p.node : p.item.slot + ':' + p.item.k + p.item.idx + ':' + p.end);
    if (key(A) === key(B)) return true;
    return false;
  }
  function reverse(rng, c, what) {
    const brs = rng.shuffle(['L', 'M', 'R']);
    const metered = brs.slice(0, 2);   // שני מדי זרם
    let target, known;
    if (what === 'R') target = rng.pick(c.res);
    else if (what === 'E') target = rng.pick(c.bats);
    // ענף ידוע לגמרי: לא הענף של הנעלם
    const cand = ['L', 'M', 'R'].filter(b => !target || b !== target.branch);
    known = rng.pick(cand);
    const hidden = new Map();
    if (target) hidden.set(target, 'ask');
    // לפעמים נגד נוסף בלי ערך (כמו בדוגמה), בענף שאינו הענף הידוע
    const extraPool = c.res.filter(r => r !== target && r.branch !== known && (!target || r.branch !== target.branch || what === 'V'));
    if (extraPool.length && rng.next() < 0.5) hidden.set(rng.pick(extraPool), 'name');
    if (what === 'V') {   // כמו בדוגמה: נגדים בלי ערך, המתח בין הצמתים
      const pool = c.res.filter(r => r.branch !== known);
      rng.shuffle(pool).slice(0, rng.int(1, Math.min(2, pool.length))).forEach(r => hidden.set(r, 'name'));
    }
    const readings = metered.map(b => Math.abs(c.branch[b].I));
    const top = rng.next() < 0.5, marks = what === 'V' ? { A: { node: top ? 'T' : 'B' }, B: { node: top ? 'B' : 'T' } } : null;
    let answers, text;
    const intro = 'במעגל מחוברים מדי זרם אידיאליים. ';
    if (what === 'R') { answers = [{ sym: `R_${target.idx}`, value: target.R, unit: 'Ω' }]; text = intro + `חשבו את התנגדות הנגד R_${target.idx}.`; }
    else if (what === 'E') { answers = [{ sym: `E_${target.idx}`, value: target.E, unit: 'V' }]; text = intro + `חשבו את מתח הסוללה E_${target.idx}.`; }
    else { const v = Math.abs(c.V); if (v < 0.5) return null; answers = [{ sym: 'V_AB', value: v, unit: 'V' }]; text = intro + 'חשבו את המתח בין הנקודות A ו-B.'; }
    return { answers, text, clean: readings.concat(answers.map(a => a.value)), hidden, meters: metered, marks, known };
  }

  // ---------------- Levels ----------------
  const LEVELS = {
    1: { nE: [2], nR: [3] }, 2: { nE: [2], nR: [4, 5] }, 3: { nE: [3], nR: [3, 4, 5] },
    4: { nE: [2, 3], nR: [3, 4, 5] }, 5: { nE: [3], nR: [5] },
  };
  const KINDS = [
    { kind: 'I_R', lv: 1 }, { kind: 'P_R', lv: 1, power: true },
    { kind: 'I_R_dir', lv: 2 }, { kind: 'I12', lv: 2 },
    { kind: 'V_AB', lv: 3 },
    { kind: 'R_rev', lv: 4 }, { kind: 'E_rev', lv: 4 }, { kind: 'VAB_rev', lv: 4 },
  ];
  const CURRENT_LEVEL_SHARE = 0.6;
  function levelChoices(level, correct, attempt, min) {
    const out = [];
    if (correct) {
      const up = level < MAX_LEVEL;
      if (up) out.push({ level: level + 1, primary: attempt < MAX_ATTEMPTS });
      out.push({ level, primary: !up || attempt >= MAX_ATTEMPTS });
    } else {
      out.push({ level, primary: true });
      if (level > min) out.push({ level: level - 1, primary: false });
    }
    return out;
  }
  function pickKind(rng, level, power, prevKind) {
    const ok = k => !k.power || power;
    const at = lv => KINDS.filter(k => k.lv === lv && ok(k));
    let pool;
    if (level === 1 || rng.next() < CURRENT_LEVEL_SHARE) pool = at(level).length ? at(level) : KINDS.filter(k => k.lv <= level && ok(k));
    else pool = at(rng.int(1, level - 1));
    if (!pool.length) pool = KINDS.filter(k => k.lv <= level && ok(k));
    if (prevKind && pool.length > 1) pool = pool.filter(k => k.kind !== prevKind);
    return rng.pick(pool).kind;
  }

  // opts: { level, power, prefixes, prevKind?, seed?, kind? }
  function makeExercise(opts) {
    const seed = opts.seed != null ? opts.seed >>> 0 : randomSeed();
    const rng = makeRng(seed), level = opts.level, L = LEVELS[level];
    const requestedKind = opts.kind || pickKind(rng, level, opts.power, opts.prevKind);
    let tries = 0, c, q, kind = requestedKind, clean = true;
    for (const k of [requestedKind, 'I_R']) {
      kind = k;
      for (let t = 0; t < MAX_TRIES; t++) {
        tries++;
        c = buildCircuit(rng, { nE: rng.pick(L.nE), nR: rng.pick(L.nR) });
        if (!validCircuit(c)) continue;
        q = Q[k](rng, c);
        if (q && q.clean.every(Units.isClean)) break;
        q = null;
      }
      if (q) break;
    }
    if (!q) { clean = false; q = Q.I_R(rng, c); }   // לא אמור לקרות; הבדיקות מוודאות
    // מדי זרם: מקום אקראי בענף (פס עליון או תחתון בענף חיצוני, אנכי באמצע). + בצד שבו הזרם נכנס.
    const meters = [];
    (q.meters || []).forEach((b, i) => {
      const slot = b === 'M' ? 'Mv' : rng.pick(b === 'L' ? ['Lt', 'Lb'] : ['Rt', 'Rb']);
      const m = { k: 'A', idx: i + 1, slot, branch: b, I: c.branch[b].I, reading: Math.abs(c.branch[b].I) };
      if (rng.next() < 0.5) c.slots[slot].push(m); else c.slots[slot].unshift(m);
      meters.push(m);
    });
    if (meters.length) solve(c);   // מחשב מחדש פוטנציאלים לכל הפריטים, כולל המדים (אין להם השפעה)
    return {
      version: VERSION, seed, level, kind, requestedKind, fallback: kind !== requestedKind, tries, clean,
      prefixes: !!opts.prefixes, power: !!opts.power,
      circuit: c, answers: q.answers, text: q.text, marks: q.marks || null, hidden: q.hidden || new Map(), meters, known: q.known,
    };
  }
  function shownValue(ex, x) {   // undefined = שם בלבד, null = נעלם, מספר = נתון
    const h = ex.hidden.get(x);
    if (h === 'ask') return null;
    if (h === 'name') return undefined;
    return x.k === 'R' ? x.R : x.E;
  }
  function givensList(ex) {
    const c = ex.circuit, f = (x, u) => Units.format(x, u, ex.prefixes, 4), out = [];
    c.bats.forEach(e => { const v = shownValue(ex, e); if (typeof v === 'number') out.push({ sym: `E_${e.idx}`, text: f(v, 'V'), q: 'E' + e.idx }); });
    c.res.forEach(r => { const v = shownValue(ex, r); if (typeof v === 'number') out.push({ sym: `R_${r.idx}`, text: f(v, 'Ω'), q: 'R' + r.idx }); });
    ex.meters.forEach(m => out.push({ sym: `I_A${m.idx}`, text: f(m.reading, 'A'), q: 'A' + m.idx }));
    return out;
  }
  // סיכום הזרמים בכל נגד וכיוונם בשרטוט (אחרי 3 ניסיונות)
  const SLOT_DIR = { Lb: 'שמאלה', Lv: 'למעלה', Lt: 'ימינה', Mv: 'למעלה', Rb: 'ימינה', Rv: 'למעלה', Rt: 'שמאלה' };
  const OPP = { 'שמאלה': 'ימינה', 'ימינה': 'שמאלה', 'למעלה': 'למטה', 'למטה': 'למעלה' };
  function currentSummary(ex) {
    const c = ex.circuit, f = x => Units.format(x, 'A', ex.prefixes, 4);
    return c.res.map(r => ({ sym: `R_${r.idx}`, text: f(Math.abs(r.I)), dir: r.I > 0 ? SLOT_DIR[r.slot] : OPP[SLOT_DIR[r.slot]] }));
  }

  // ---------------- Draw (SVG) ----------------
  // פריסה קבועה בסגנון השאלות לדוגמה: שלושה ענפים אנכיים, פסים עליון ותחתון
  const D = { M: 16, XL: 110, MW: 230, YT: 56, H: 270, RLEN: 56, ELEN: 12, ALEN: 26, MR: 12, CH: 7.8 };
  const rd = x => Math.round(x * 10) / 10;
  const ln = (x1, y1, x2, y2) => `<line x1="${rd(x1)}" y1="${rd(y1)}" x2="${rd(x2)}" y2="${rd(y2)}"/>`;
  const dot = (x, y) => `<circle class="ckt-fill" cx="${rd(x)}" cy="${rd(y)}" r="3.5"/>`;
  function svgSym(sym) {
    const m = /^([^_]*)_([0-9A-Za-z]+)(.*)$/.exec(sym);
    return m ? `${m[1]}<tspan dy="4" font-size="11">${m[2]}</tspan><tspan dy="-4">${m[3]}</tspan>` : sym;
  }
  const Q_MARK = '<tspan class="ckt-q">?</tspan>';
  const text = (x, y, inner, anchor, extra) => `<text x="${rd(x)}" y="${rd(y)}" text-anchor="${anchor || 'middle'}"${extra || ''}>${inner}</text>`;
  const LEN = x => (x.k === 'R' ? D.RLEN : x.k === 'E' ? D.ELEN : D.ALEN);

  function render(ex) {
    const c = ex.circuit, o = [], fmt = (x, u) => Units.format(x, u, ex.prefixes, 4);
    const xL = D.M + D.XL, xM = xL + D.MW, xR = xM + D.MW, yT = D.YT, yB = yT + D.H;
    const seg = {   // התחלה וסוף של כל מקטע, בכיוון המסלול
      Lb: [[xM, yB], [xL, yB]], Lv: [[xL, yB], [xL, yT]], Lt: [[xL, yT], [xM, yT]],
      Mv: [[xM, yB], [xM, yT]],
      Rb: [[xM, yB], [xR, yB]], Rv: [[xR, yB], [xR, yT]], Rt: [[xR, yT], [xM, yT]],
    };
    const placed = new Map();
    for (const [name, [p0, p1]] of Object.entries(seg)) {
      const list = c.slots[name], n = list.length, dx = p1[0] - p0[0], dy = p1[1] - p0[1], L = Math.hypot(dx, dy), u = [dx / L, dy / L];
      let cur = p0;
      list.forEach((x, i) => {
        const t = (i + 1) / (n + 1), cx = p0[0] + dx * t, cy = p0[1] + dy * t, h = LEN(x) / 2;
        const pin = [cx - u[0] * h, cy - u[1] * h], pout = [cx + u[0] * h, cy + u[1] * h];
        o.push(ln(cur[0], cur[1], pin[0], pin[1]));
        placed.set(x, { cx, cy, pin, pout, vert: dx === 0, u, slot: name });
        cur = pout;
      });
      o.push(ln(cur[0], cur[1], p1[0], p1[1]));
    }
    o.push(dot(xM, yT), dot(xM, yB));

    for (const [x, P] of placed) {
      const { cx, cy, vert } = P;
      if (x.k === 'R') {
        const pts = [];
        for (let i = 0; i <= 7; i++) {
          const s = i === 0 ? -25 : i === 7 ? 25 : -25 + 50 * (2 * i - 1) / 12, w = i === 0 || i === 7 ? 0 : (i % 2 ? -8 : 8);
          pts.push(vert ? [cx + w, cy + s] : [cx + s, cy + w]);
        }
        const v = shownValue(ex, x), unk = v === null;
        o.push(ln(...P.pin, cx - 25 * P.u[0], cy - 25 * P.u[1]));
        o.push(`<polyline${unk ? ' class="ckt-unk"' : ''} points="${pts.map(p => rd(p[0]) + ',' + rd(p[1])).join(' ')}"/>`);
        o.push(ln(cx + 25 * P.u[0], cy + 25 * P.u[1], ...P.pout));
        const val = v === null ? Q_MARK : v === undefined ? '' : fmt(v, 'Ω');
        if (vert) {
          o.push(text(cx - 16, cy + 5, svgSym(`R_${x.idx}`), 'end'));
          if (val) o.push(text(cx + 16, cy + 5, val, 'start'));
        } else {
          o.push(text(cx, cy - 16, svgSym(`R_${x.idx}`)));
          if (val) o.push(text(cx, cy + 28, val));
        }
      } else if (x.k === 'E') {   // סוללה אנכית: קו ארוך = +
        const plus = x.pol > 0 ? -1 : 1;   // צד הקו הארוך (y): למעלה אם pol=+1
        o.push(`<line class="ckt-plate" x1="${rd(cx - 18)}" y1="${rd(cy + plus * 6)}" x2="${rd(cx + 18)}" y2="${rd(cy + plus * 6)}"/>`);
        o.push(`<line class="ckt-plate ckt-short" x1="${rd(cx - 9)}" y1="${rd(cy - plus * 6)}" x2="${rd(cx + 9)}" y2="${rd(cy - plus * 6)}"/>`);
        o.push(ln(cx, P.pin[1], cx, cy + 6 * Math.sign(P.pin[1] - cy)), ln(cx, P.pout[1], cx, cy + 6 * Math.sign(P.pout[1] - cy)));
        const v = shownValue(ex, x);
        o.push(text(cx - 24, cy + 5, svgSym(`E_${x.idx}`), 'end'));
        o.push(text(cx + 24, cy + 5, v === null ? Q_MARK : v === undefined ? '' : fmt(v, 'V'), 'start'));
      } else {   // מד זרם, + בצד שבו הזרם נכנס
        o.push(`<circle class="ckt-meter" cx="${rd(cx)}" cy="${rd(cy)}" r="${D.MR}"/>`, text(cx, cy + 5, svgSym(`A_${x.idx}`), 'middle', ' font-size="12"'));
        const enter = x.I > 0 ? P.pin : P.pout, leave = x.I > 0 ? P.pout : P.pin;
        const off = vert ? [-12, 0] : [0, -12];
        o.push(text(enter[0] + off[0], enter[1] + off[1] + 4, '+', 'middle', ' font-size="13"'), text(leave[0] + off[0], leave[1] + off[1] + 4, '−', 'middle', ' font-size="13"'));
        const r = fmt(x.reading, 'A');
        o.push(vert ? text(cx + D.MR + 6, cy + 5, r, 'start') : text(cx, cy + D.MR + 18, r));
      }
    }

    // נקודות A ו-B
    if (ex.marks) for (const name of ['A', 'B']) {
      const p = ex.marks[name];
      let x, y, lx, ly;
      if (p.node) { x = xM; y = p.node === 'T' ? yT : yB; lx = x + 10; ly = p.node === 'T' ? y - 8 : y + 20; }
      else {
        const P = placed.get(p.item), q = p.end === 'in' ? P.pin : P.pout, s = p.end === 'in' ? -1 : 1;
        [x, y] = q;
        if (P.vert) { lx = x + 10; ly = y + s * Math.sign(P.u[1]) * 12 + 4; }
        else { lx = x + s * P.u[0] * 10; ly = y === yT ? y - 10 : y + 22; }
      }
      o.push(dot(x, y), text(lx, ly, `<tspan font-weight="bold">${name}</tspan>`));
    }
    const W = xR + 110, H = yB + 40;
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" class="ckt" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" ` +
      `direction="ltr" font-family="Arial, Helvetica, sans-serif" font-size="14" role="img" aria-label="שרטוט המעגל">` +
      `<style>.ckt line,.ckt polyline{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}` +
      `.ckt .ckt-unk{stroke:#d9480f;stroke-width:2.6}.ckt text{fill:#1f2937}.ckt .ckt-q{fill:#d9480f;font-weight:bold}` +
      `.ckt .ckt-fill{fill:#1f2937;stroke:none}.ckt .ckt-plate{stroke-width:3}.ckt .ckt-short{stroke-width:5}` +
      `.ckt .ckt-meter{fill:#fff;stroke:#1f2937;stroke-width:2}</style>` +
      `<rect width="100%" height="100%" fill="#fff"/>` + o.join('') + `</svg>`;
    return { svg, width: W, height: H, placed };
  }

  global.Engine = {
    VERSION, MAX_LEVEL, MAX_ATTEMPTS, TOL, MAX_TRIES, VALUES, LEVELS, KINDS, BRANCH_SLOTS,
    makeRng, randomSeed, Units, makeExercise, givensList, shownValue, currentSummary, levelChoices,
    minLevel: () => 1, Draw: { render, D },
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<!-- ======================= ממשק ======================= -->
<script>
(function () {
  'use strict';
  const E = window.Engine;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const symHtml = s => s.replace(/\b([A-Za-z])_([0-9A-Za-z]+)/g, '<bdi dir="ltr">$1<sub>$2</sub></bdi>');
  const PREFIX_OPTS = [['1', '(ללא)'], ['1000000', 'M'], ['1000', 'k'], ['0.001', 'm'], ['0.000001', 'µ']];
  const DIR_TEXT = { AB: 'מ-A ל-B', BA: 'מ-B ל-A' };

  const st = { settings: null, level: 1, ex: null, failed: 0, finished: false, prevKind: null };
  $('ver').textContent = E.VERSION;
  $('ver2').textContent = E.VERSION;

  const readSettings = () => ({ level: +$('level').value, power: $('power').checked, prefixes: $('prefixes').checked });
  $('start').addEventListener('click', () => {
    st.settings = readSettings();
    st.level = st.settings.level;
    st.prevKind = null;
    $('setup').hidden = true;
    $('play').hidden = false;
    newExercise();
  });
  $('back').addEventListener('click', () => {
    $('play').hidden = true;
    $('setup').hidden = false;
    window.scrollTo(0, 0);
  });

  function newExercise() {
    const s = st.settings;
    st.ex = E.makeExercise({ level: st.level, power: s.power, prefixes: s.prefixes, prevKind: st.prevKind });
    st.prevKind = st.ex.kind;
    st.failed = 0;
    st.finished = false;
    renderExercise();
  }
  function renderExercise() {
    const ex = st.ex, pre = st.settings.prefixes;
    $('lvl').textContent = `רמה ${ex.level}`;
    $('qtext').innerHTML = symHtml(esc(ex.text));
    const r = E.Draw.render(ex);
    $('circuit').innerHTML = r.svg;
    const svg = $('circuit').querySelector('svg');
    svg.style.maxWidth = Math.round(r.width * 1.15) + 'px';
    svg.style.minWidth = Math.round(r.width * 0.78) + 'px';
    const g = E.givensList(ex).map(x => `<span class="chip" dir="ltr">${symHtml(esc(x.sym))} = ${esc(x.text)}</span>`);
    $('givens').innerHTML = '<span class="muted">נתונים:</span> ' + g.join(' ');
    $('unknown').innerHTML = '<span class="muted">נעלם:</span> ' + ex.answers.map(a => a.dir
      ? '<span class="chip unk">כיוון הזרם</span>' : `<span class="chip unk" dir="ltr">${symHtml(esc(a.sym))} = ?</span>`).join(' ');
    $('ansRows').innerHTML = ex.answers.map((a, i) => a.dir
      ? `<span class="ansbox dirbox">כיוון הזרם: <select data-i="${i}" class="dir"><option value="">בחרו כיוון</option>
           <option value="AB">${DIR_TEXT.AB}</option><option value="BA">${DIR_TEXT.BA}</option></select></span>`
      : `<span class="ansbox" dir="ltr"><span class="usym">${symHtml(esc(a.sym))}</span> =
          <input data-i="${i}" class="val" type="text" inputmode="decimal" dir="ltr" spellcheck="false">
          ${pre ? `<select data-i="${i}" class="pre" aria-label="תחילית">${PREFIX_OPTS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>` : ''}
          <span>${esc(a.unit)}</span></span>`).join('');
    $('checkBtn').disabled = false;
    setFeedback('', '');
    $('solution').hidden = true;
    $('summary').innerHTML = E.currentSummary(ex).map(s =>
      `<li><bdi dir="ltr">${symHtml(s.sym)}</bdi>: <bdi dir="ltr">${esc(s.text)}</bdi>, ${s.dir}</li>`).join('');
    $('next').hidden = false;
    $('choices').hidden = true;
    $('seed').textContent = '#' + ex.seed;
    updateTries();
  }
  function updateTries() { $('tries').textContent = st.finished ? '' : `ניסיון ${st.failed + 1} מתוך ${E.MAX_ATTEMPTS}`; }
  function setFeedback(cls, html) { $('feedback').className = 'fb ' + cls; $('feedback').innerHTML = html; }
  const answerText = () => st.ex.answers.map(a => a.dir ? DIR_TEXT[a.value]
    : `<bdi dir="ltr">${symHtml(esc(a.sym))} = ${esc(E.Units.formatAnswer(a.value, a.unit, st.ex.prefixes))}</bdi>`).join(', ');
  function finish(correct, attempt) {
    st.finished = true;
    document.querySelectorAll('#ansRows input, #ansRows select').forEach(el => (el.disabled = true));
    $('checkBtn').disabled = true;
    const opts = E.levelChoices(st.level, correct, attempt, E.minLevel());
    const label = n => (opts.length === 1 ? 'לתרגיל הבא'
      : n > st.level ? `לעלות לרמה ${n}` : n < st.level ? `לרדת לרמה ${n}` : `להישאר ברמה ${n}`);
    $('choices').innerHTML = opts.map(o =>
      `<button type="button" data-level="${o.level}"${o.primary ? ' class="primary"' : ''}>${label(o.level)}</button>`).join('');
    $('choices').hidden = false;
    $('next').hidden = true;
    updateTries();
  }
  $('choices').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-level]');
    if (!b) return;
    st.level = +b.dataset.level;
    newExercise();
  });

  $('ansForm').addEventListener('submit', ev => {
    ev.preventDefault();
    if (st.finished) return;
    const ex = st.ex;
    const vals = ex.answers.map((a, i) => {
      if (a.dir) return document.querySelector(`#ansRows select.dir[data-i="${i}"]`).value || NaN;
      const n = E.Units.parseNumber(document.querySelector(`#ansRows input[data-i="${i}"]`).value);
      const pre = document.querySelector(`#ansRows select.pre[data-i="${i}"]`);
      return n * (pre ? +pre.value : 1);
    });
    if (vals.some(v => typeof v === 'number' && isNaN(v))) {
      setFeedback('warn', 'נא להקליד מספר בכל שדה ולבחור כיוון (אפשר נקודה או פסיק עשרוני). הניסיון לא נספר.');
      return;
    }
    const ok = ex.answers.map((a, i) => (a.dir ? vals[i] === a.value : E.Units.check(vals[i], a.value)));
    const attempt = st.failed + 1;
    if (ok.every(Boolean)) {
      let msg = `נכון! ${answerText()}. `;
      if (st.level >= E.MAX_LEVEL) msg += 'זו הרמה הגבוהה ביותר.';
      else if (attempt >= E.MAX_ATTEMPTS) msg += 'הצלחתם בניסיון השלישי. אפשר לעלות רמה, או להישאר ולתרגל עוד.';
      else msg += 'אפשר לעלות רמה או להישאר באותה רמה.';
      setFeedback('ok', msg);
      finish(true, attempt);
      return;
    }
    st.failed++;
    let detail = '';
    if (ex.answers.length > 1)
      detail = ' ' + ex.answers.map((a, i) => `${a.dir ? 'הכיוון' : `<bdi dir="ltr">${symHtml(esc(a.sym))}</bdi>`} ${ok[i] ? 'נכון' : 'לא נכון'}`).join(', ') + '.';
    if (st.failed < E.MAX_ATTEMPTS) {
      const left = E.MAX_ATTEMPTS - st.failed;
      let msg = (left === 1 ? 'לא נכון. נשאר ניסיון אחד.' : `לא נכון. נשארו ${left} ניסיונות.`) + detail;
      if (ex.answers.some((a, i) => !a.dir && !ok[i] && E.Units.prefixHint(vals[i], a.value)))
        msg += ' שימו לב ליחידות ולתחיליות: התשובה רחוקה פי 1000 או יותר.';
      setFeedback('bad', msg);
      updateTries();
    } else {
      setFeedback('bad', `לא נכון.${detail} התשובה הנכונה: ${answerText()}. למטה הזרמים בכל הנגדים.`);
      $('solution').hidden = false;
      finish(false, attempt);
    }
  });
  $('next').addEventListener('click', newExercise);
})();
</script>
