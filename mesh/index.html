<!-- ======================= מנוע (ללא DOM) ======================= -->
<script src="../common/core.js"></script>
<script id="engine">
(function (global) {
  'use strict';

  const VERSION = 'v2.1';
  const MAX_LEVEL = 5;
  const MAX_ATTEMPTS = 3;
  const TOL = 0.01;        // סטייה יחסית מותרת (1%)
  const MAX_TRIES = 6000;  // הגרלות עד מעגל עם תשובות ונתונים "נקיים"

  // ערכים "יפים" כמו בשאלות לדוגמה: נגד = בסיס × קנה מידה אחד לכל המעגל
  const VALUES = {
    RB: [1, 1.5, 2, 2.4, 3, 4, 5, 6, 8, 10, 12, 15, 20, 24, 30, 40, 48, 50, 60, 80],
    RS: [1, 10, 100],
    E: [1.5, 3, 4, 4.5, 5, 6, 9, 10, 12, 15, 18, 20, 24, 30, 36, 40, 45, 48, 50],
  };
  const sum = a => a.reduce((s, x) => s + x, 0);

  // ---------------- Rng, Units (קוד משותף: common/core.js) ----------------
  const { makeRng, randomSeed } = global.Core;
  const Units = global.Core.makeUnits({ prefixes: ['M', 'k', '', 'm', 'µ'], tol: TOL });
  const { roundSig, numStr, pickPrefix } = Units;

  // ---------------- Circuit ----------------
  // שלושה ענפים בין צומת עליון לצומת תחתון. כל ענף = מסלול מהצומת התחתון לעליון, מורכב ממקטעים (slots):
  // L: Lb (פס תחתון שמאלה) → Lv (אנכי שמאלי, למעלה) → Lt (פס עליון ימינה)
  // M: Mv (אנכי אמצעי, למעלה)
  // R: Rb (פס תחתון ימינה) → Rv (אנכי ימני, למעלה) → Rt (פס עליון שמאלה)
  // פריט: { k:'R', idx, R } | { k:'E', idx, E, pol } (pol=+1: הקוטב החיובי למעלה) | { k:'A', idx }
  const BRANCH_SLOTS = { L: ['Lb', 'Lv', 'Lt'], M: ['Mv'], R: ['Rb', 'Rv', 'Rt'] };
  const R_ORDER = ['Lt', 'Lv', 'Lb', 'Mv', 'Rt', 'Rv', 'Rb'];   // מספור נגדים כמו בשאלות לדוגמה
  const OUTER = { L: ['Lt', 'Lv', 'Lb'], R: ['Rt', 'Rv', 'Rb'] };

  // בנייה לאחור (כדי שכל תשובות הסעיפים יהיו עגולות): בוחרים זרמים עגולים בענפים הצדדיים,
  // הזרם האמצעי נובע מחוק הצמתים, מתח הצמתים מהענף האמצעי (או עגול כשיש בו סוללה),
  // ומתח כל סוללה נגזר: E = V + I·R. עדיפות לסוללה עגולה (חצאי וולט); אחרת עד 3 ספרות משמעותיות.
  const mant = (ms, e0, e1) => { const out = []; for (let e = e0; e <= e1; e++) ms.forEach(m => out.push(Number((m * Math.pow(10, e)).toPrecision(6)))); return out; };
  const CUR = mant([1, 1.2, 1.5, 2, 2.4, 2.5, 3, 4, 5, 6, 8], -4, 0);
  const V_NICE = [1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 18, 20, 24, 30];
  const halfVolt = x => Math.abs(x * 2 - Math.round(x * 2)) < 1e-9;
  function buildCircuit(rng, cfg, roundE, minI = 0) {
    const slots = { Lb: [], Lv: [], Lt: [], Mv: [], Rb: [], Rv: [], Rt: [] };
    // נגדים: אחד בכל ענף לפחות (באמצע תמיד), השאר במקומות פנויים בענפים החיצוניים
    const pos = new Set(['Mv', rng.pick(OUTER.L), rng.pick(OUTER.R)]);
    const free = rng.shuffle(OUTER.L.concat(OUTER.R).filter(p => !pos.has(p)));
    while (pos.size < cfg.nR) pos.add(free.shift());
    const scale = rng.pick(VALUES.RS);
    let ri = 0;
    R_ORDER.forEach(p => { if (pos.has(p)) slots[p].push({ k: 'R', idx: ++ri, R: rng.pick(VALUES.RB) * scale, slot: p }); });
    // סוללות: שמאל, (אמצע), ימין; בענף אנכי סדר הנגד והסוללה אקראי. הערך והכיוון נקבעים בהמשך.
    const eSlots = cfg.nE === 3 ? ['Lv', 'Mv', 'Rv'] : ['Lv', 'Rv'];
    const bats = eSlots.map((p, i) => {
      const e = { k: 'E', idx: i + 1, E: 0, pol: 1, slot: p };
      if (rng.next() < 0.5) slots[p].push(e); else slots[p].unshift(e);
      return e;
    });
    const c = { slots, nE: cfg.nE, nR: cfg.nR };
    const Rb = b => sum(items(c, b).filter(x => x.k === 'R').map(x => x.R));
    const pickI = b => {
      const ok = CUR.filter(i => i >= minI && i * Rb(b) >= 0.5 && i * Rb(b) <= 30);
      return ok.length ? rng.pick(ok) * (rng.next() < 0.5 ? 1 : -1) : null;
    };
    const IL = pickI('L'), IR = pickI('R');
    if (IL == null || IR == null) return null;
    const I = { L: IL, R: IR, M: -(IL + IR) };   // זרם לאורך המסלול (מלמטה למעלה)
    const V = cfg.nE === 3 ? rng.pick(V_NICE) * (rng.next() < 0.5 ? 1 : -1) : -I.M * Rb('M');
    if (Math.abs(V) > 60) return null;
    for (const e of bats) {
      const b = e.slot[0], sv = V + I[b] * Rb(b), E = Math.abs(sv);
      if (E < 1 || E > 60 || !Units.isClean(E) || (roundE && !halfVolt(E))) return null;
      e.E = Number(E.toPrecision(6));
      e.pol = sv > 0 ? 1 : -1;
    }
    return solve(c);
  }
  const items = (c, b) => [].concat(...BRANCH_SLOTS[b].map(s => c.slots[s]));
  function solve(c) {
    c.branch = {};
    for (const b of ['L', 'M', 'R']) {
      const it = items(c, b);
      c.branch[b] = { R: sum(it.filter(x => x.k === 'R').map(x => x.R)), s: sum(it.filter(x => x.k === 'E').map(x => x.pol * x.E)) };
    }
    const B = c.branch;
    c.V = sum(['L', 'M', 'R'].map(b => B[b].s / B[b].R)) / sum(['L', 'M', 'R'].map(b => 1 / B[b].R));
    for (const b of ['L', 'M', 'R']) {
      B[b].I = (B[b].s - c.V) / B[b].R;   // זרם לאורך המסלול (מהצומת התחתון לעליון)
      let phi = 0;
      items(c, b).forEach(x => {
        x.branch = b; x.I = B[b].I; x.phiIn = phi;
        if (x.k === 'R') phi -= B[b].I * x.R;
        else if (x.k === 'E') phi += x.pol * x.E;
        x.phiOut = phi;
      });
    }
    c.res = R_ORDER.map(p => c.slots[p].filter(x => x.k === 'R')).reduce((a, b) => a.concat(b), []);
    c.bats = ['Lv', 'Mv', 'Rv'].map(p => c.slots[p].find(x => x.k === 'E')).filter(Boolean);
    return c;
  }
  function validCircuit(c) {
    const Is = ['L', 'M', 'R'].map(b => Math.abs(c.branch[b].I)), mx = Math.max(...Is);
    return mx <= 10 && Math.min(...Is) >= 1e-4 && Math.min(...Is) >= 0.05 * mx;
  }
  // בלי תחיליות: אף זרם (בכל ענף) ואף הספק שנשאל לא קטן מ-MIN_PLAIN, כדי שלא יופיעו מספרים כמו 0.0002 A.
  // עם תחיליות אין צורך (מוצג ב-mA, µA)
  const MIN_PLAIN = 0.01;

  // ---------------- Questions ----------------
  // נקודה = { item, end:'in'|'out' } או { node:'T'|'B' }
  const ptPhi = (c, p) => (p.node ? (p.node === 'T' ? c.V : 0) : p.item[p.end === 'in' ? 'phiIn' : 'phiOut']);
  const ptKey = p => (p.node ? p.node : p.item.slot + ':' + p.item.k + p.item.idx + ':' + p.end);
  function allPoints(c) {
    const pts = [{ node: 'T' }, { node: 'B' }];
    for (const b of ['L', 'M', 'R']) items(c, b).forEach(x => pts.push({ item: x, end: 'in' }, { item: x, end: 'out' }));
    return pts;
  }
  // רמה 1: שאלה אחת
  const Q = {
    I_R(rng, c) {
      const r = rng.pick(c.res), v = Math.abs(r.I);
      return { answers: [{ sym: `I_R${r.idx}`, value: v, unit: 'A' }], ref: r, text: `חשבו את הזרם הזורם דרך הנגד R_${r.idx}.` };
    },
    P_R(rng, c) {
      const r = rng.pick(c.res), v = r.I * r.I * r.R;
      return { answers: [{ sym: `P_R${r.idx}`, value: v, unit: 'W' }], ref: r, text: `חשבו את ההספק המתפתח בנגד R_${r.idx}.` };
    },
  };
  // רמות 2–5: סעיפים. כל סעיף: { kind, text, answers, ref? }
  const curPart = (r, kind) => ({ kind: kind || 'IR', ref: r, text: `חשבו את הזרם הזורם דרך הנגד R_${r.idx}.`,
    answers: [{ sym: `I_R${r.idx}`, value: Math.abs(r.I), unit: 'A' }] });
  const powPart = r => ({ kind: 'PR', ref: r, text: `חשבו את ההספק המתפתח בנגד R_${r.idx}.`,
    answers: [{ sym: `P_R${r.idx}`, value: r.I * r.I * r.R, unit: 'W' }] });
  function dirPart(rng, r, n1, n2, marks) {
    const aIn = rng.next() < 0.5;
    marks[n1] = { item: r, end: aIn ? 'in' : 'out' };
    marks[n2] = { item: r, end: aIn ? 'out' : 'in' };
    return { kind: 'IRdir', ref: r, names: [n1, n2],
      text: `חשבו את הזרם הזורם דרך הנגד R_${r.idx}, וקבעו את כיוונו: מ-${n1} ל-${n2} או מ-${n2} ל-${n1}.`,
      // זרם חיובי זורם מ-in ל-out
      answers: [{ sym: `I_R${r.idx}`, value: Math.abs(r.I), unit: 'A' }, { dir: true, from: n1, to: n2, value: (r.I > 0) === aIn ? 'XY' : 'YX' }] };
  }
  function batPart(rng, c) {
    const [a, b] = rng.shuffle(c.bats).slice(0, 2).sort((x, y) => x.idx - y.idx);
    return { kind: 'I12', refs: [a, b],
      text: `חשבו את הזרם I_${a.idx} הזורם דרך הסוללה E_${a.idx} ואת הזרם I_${b.idx} הזורם דרך הסוללה E_${b.idx}.`,
      answers: [{ sym: `I_${a.idx}`, value: Math.abs(a.I), unit: 'A' }, { sym: `I_${b.idx}`, value: Math.abs(b.I), unit: 'A' }] };
  }
  // מתח בין שתי נקודות שלא מסומנות כבר
  function vabPart(rng, c, n1, n2, marks) {
    const used = new Set(Object.values(marks).map(ptKey));
    const pts = rng.shuffle(allPoints(c)).filter(p => !used.has(ptKey(p)));
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const A = pts[i], B = pts[j], v = Math.abs(ptPhi(c, A) - ptPhi(c, B));
      if (ptKey(A) === ptKey(B) || v < 0.5 || !Units.isClean(v)) continue;
      marks[n1] = A; marks[n2] = B;
      return { kind: 'VAB', names: [n1, n2], text: `חשבו את המתח בין הנקודות ${n1} ו-${n2}.`, answers: [{ sym: `V_${n1}${n2}`, value: v, unit: 'V' }] };
    }
    return null;
  }
  // שאלה רגילה עם סעיפים: זרמי הסוללות, זרם בנגד (לפעמים עם כיוון), מתח בין נקודות (מרמה 3), הספק
  function forwardParts(rng, c, level, power) {
    const marks = {}, letters = ['A', 'B', 'C', 'D'], res = rng.shuffle(c.res);
    const nextPair = () => letters.splice(0, 2);
    const cur = r => (rng.next() < 0.5 ? dirPart(rng, r, ...nextPair(), marks) : curPart(r));
    const parts = [batPart(rng, c), cur(res[0])];
    const extra = r => (power && rng.next() < 0.6 ? powPart(r) : curPart(r));
    if (level === 2) {
      if (rng.next() < 0.5) parts.push(extra(res[1]));
    } else {
      const v = vabPart(rng, c, ...nextPair(), marks);
      if (!v) return null;
      parts.push(v);
      if (rng.next() < 0.5) parts.push(extra(res[1]));
    }
    return { parts, marks, hidden: new Map(), metered: [] };
  }
  // שאלה הפוכה עם מדי זרם (כמו בדוגמה): שני מדים, ולכן כל הזרמים ידועים.
  // ענף אחד ידוע לגמרי (ממנו V_AB), ובכל אחד משני הענפים האחרים לכל היותר נעלם אחד.
  const unkPart = x => (x.k === 'R'
    ? { kind: 'Rrev', ref: x, text: `חשבו את התנגדות הנגד R_${x.idx}.`, answers: [{ sym: `R_${x.idx}`, value: x.R, unit: 'Ω' }] }
    : { kind: 'Erev', ref: x, text: `חשבו את מתח הסוללה E_${x.idx}.`, answers: [{ sym: `E_${x.idx}`, value: x.E, unit: 'V' }] });
  function reverseParts(rng, c, power) {
    if (Math.abs(c.V) < 0.5) return null;
    const brs = ['L', 'M', 'R'], K = rng.pick(brs), [X, Y] = rng.shuffle(brs.filter(b => b !== K));
    const metered = rng.shuffle(brs).slice(0, 2), hidden = new Map();
    const top = rng.next() < 0.5, marks = { A: { node: top ? 'T' : 'B' }, B: { node: top ? 'B' : 'T' } };
    const pickUnknown = b => {
      const es = items(c, b).filter(x => x.k === 'E'), rs = items(c, b).filter(x => x.k === 'R');
      return es.length && rng.next() < 0.35 ? es[0] : rng.pick(rs);
    };
    const u1 = pickUnknown(X);
    hidden.set(u1, 'ask');
    const parts = [{ kind: 'VABrev', text: 'חשבו את המתח בין הנקודות A ו-B.', answers: [{ sym: 'V_AB', value: Math.abs(c.V), unit: 'V' }] }, unkPart(u1)];
    if (rng.next() < 0.6) { const u2 = pickUnknown(Y); hidden.set(u2, 'ask'); parts.push(unkPart(u2)); }
    const want = parts.length === 3 ? rng.int(3, 4) : 3;
    if (parts.length < want) {
      // זרם בנגד בענף בלי מד (מחוק הצמתים), או הספק בנגד ידוע
      const nb = brs.find(b => !metered.includes(b));
      const cand = c.res.filter(r => r.branch === nb && !hidden.has(r));
      if (cand.length && rng.next() < 0.6) parts.push(curPart(rng.pick(cand), 'IRrev'));
      else if (power) parts.push(powPart(rng.pick(c.res.filter(r => !hidden.has(r)))));
      else if (cand.length) parts.push(curPart(rng.pick(cand), 'IRrev'));
    }
    if (parts.length < 3) return null;
    return { parts, marks, hidden, metered, known: K };
  }

  // ---------------- Levels ----------------
  const LEVELS = {
    1: { nE: [2], nR: [3] }, 2: { nE: [2], nR: [4, 5] }, 3: { nE: [3], nR: [3, 4, 5] },
    4: { nE: [2, 3], nR: [3, 4, 5] }, 5: { nE: [3], nR: [5] },
  };
  // רמה 1: שאלה אחת. רמות 2–3: שאלה עם סעיפים. רמה 4: הפוכה עם מדי זרם. רמה 5: אחת מהשתיים.
  const LEVEL_FORMATS = { 1: ['single'], 2: ['fwd'], 3: ['fwd'], 4: ['rev'], 5: ['fwd', 'rev'] };
  const levelChoices = (level, correct, attempt, min) => global.Core.levelChoices(level, correct, attempt, min, MAX_LEVEL, MAX_ATTEMPTS);
  const INTRO = { fwd: 'באיור נתון מעגל חשמלי.', rev: 'באיור נתון מעגל חשמלי שמחוברים אליו מדי זרם אידיאליים. קריאות המדים מוצגות באיור.' };

  // opts: { level, power, prefixes, prevKind?, seed?, format? (לבדיקות) }
  function makeExercise(opts) {
    const seed = opts.seed != null ? opts.seed >>> 0 : randomSeed();
    const rng = makeRng(seed), level = opts.level, L = LEVELS[level];
    const format = opts.format || rng.pick(LEVEL_FORMATS[level]);
    let kind = format;
    if (format === 'single') {
      const pool = ['I_R'].concat(opts.power ? ['P_R'] : []).filter(k => pool1(k, opts.prevKind));
      kind = rng.pick(pool.length ? pool : ['I_R']);
    }
    let tries = 0, c = null, built = null;
    for (let t = 0; t < MAX_TRIES && !built; t++) {
      tries++;
      c = buildCircuit(rng, { nE: rng.pick(L.nE), nR: rng.pick(L.nR) }, t < MAX_TRIES / 2, opts.prefixes ? 0 : MIN_PLAIN);
      if (!c || !validCircuit(c)) continue;
      if (!opts.prefixes && ['L', 'M', 'R'].some(x => Math.abs(c.branch[x].I) < MIN_PLAIN)) continue;
      let b = null;
      if (format === 'single') {
        const q = Q[kind](rng, c);
        b = { parts: [{ kind, ref: q.ref, answers: q.answers }], text: q.text, marks: {}, hidden: new Map(), metered: [] };
      } else {
        b = format === 'rev' ? reverseParts(rng, c, opts.power) : forwardParts(rng, c, level, opts.power);
        if (b) b.text = INTRO[format];
      }
      if (!b) continue;
      const vals = b.parts.flatMap(p => p.answers.filter(a => !a.dir).map(a => a.value)).concat(b.metered.map(x => c.branch[x].I));
      const tiny = !opts.prefixes && b.parts.some(p => p.answers.some(a => !a.dir && a.value < MIN_PLAIN));
      if (vals.every(Units.isClean) && !tiny) built = b;
    }
    if (!built) throw new Error('no clean exercise');
    // מדי זרם: מקום אקראי בענף (פס עליון או תחתון בענף חיצוני, אנכי באמצע). + בצד שבו הזרם נכנס.
    const meters = [];
    built.metered.forEach((b, i) => {
      const slot = b === 'M' ? 'Mv' : rng.pick(b === 'L' ? ['Lt', 'Lb'] : ['Rt', 'Rb']);
      const m = { k: 'A', idx: i + 1, slot, branch: b, I: c.branch[b].I, reading: Math.abs(c.branch[b].I) };
      if (rng.next() < 0.5) c.slots[slot].push(m); else c.slots[slot].unshift(m);
      meters.push(m);
    });
    if (meters.length) solve(c);   // מחשב מחדש פוטנציאלים לכל הפריטים, כולל המדים (אין להם השפעה)
    return {
      version: VERSION, seed, level, format, kind, tries, prefixes: !!opts.prefixes, power: !!opts.power,
      circuit: c, text: built.text, parts: built.parts, marks: built.marks, hidden: built.hidden, meters, known: built.known,
    };
  }
  const pool1 = (k, prev) => k !== prev;
  function shownValue(ex, x) {   // undefined = שם בלבד, null = נעלם, מספר = נתון
    const h = ex.hidden.get(x);
    if (h === 'ask') return null;
    if (h === 'name') return undefined;
    return x.k === 'R' ? x.R : x.E;
  }
  function givensList(ex) {
    const c = ex.circuit, f = (x, u) => Units.format(x, u, ex.prefixes, 4), out = [];
    c.bats.forEach(e => { const v = shownValue(ex, e); if (typeof v === 'number') out.push({ sym: `E_${e.idx}`, text: f(v, 'V'), q: 'E' + e.idx }); });
    c.res.forEach(r => { const v = shownValue(ex, r); if (typeof v === 'number') out.push({ sym: `R_${r.idx}`, text: f(v, 'Ω'), q: 'R' + r.idx }); });
    ex.meters.forEach(m => out.push({ sym: `I_A${m.idx}`, text: f(m.reading, 'A'), q: 'A' + m.idx }));
    return out;
  }
  // סיכום הזרמים בכל נגד וכיוונם בשרטוט (אחרי 3 ניסיונות)
  const SLOT_DIR = { Lb: 'שמאלה', Lv: 'למעלה', Lt: 'ימינה', Mv: 'למעלה', Rb: 'ימינה', Rv: 'למעלה', Rt: 'שמאלה' };
  const OPP = { 'שמאלה': 'ימינה', 'ימינה': 'שמאלה', 'למעלה': 'למטה', 'למטה': 'למעלה' };
  function currentSummary(ex) {
    const c = ex.circuit, f = x => Units.format(x, 'A', ex.prefixes, 4);
    return c.res.map(r => ({ sym: `R_${r.idx}`, text: f(Math.abs(r.I)), dir: r.I > 0 ? SLOT_DIR[r.slot] : OPP[SLOT_DIR[r.slot]] }));
  }

  // ---------------- Draw (SVG) ----------------
  // פריסה קבועה בסגנון השאלות לדוגמה: שלושה ענפים אנכיים, פסים עליון ותחתון
  const D = { M: 16, XL: 110, MW: 230, YT: 56, H: 270, RLEN: 56, ELEN: 12, ALEN: 26, MR: 12, CH: 7.8 };
  const rd = x => Math.round(x * 10) / 10;
  const ln = (x1, y1, x2, y2) => `<line x1="${rd(x1)}" y1="${rd(y1)}" x2="${rd(x2)}" y2="${rd(y2)}"/>`;
  const dot = (x, y) => `<circle class="ckt-fill" cx="${rd(x)}" cy="${rd(y)}" r="3.5"/>`;
  function svgSym(sym) {
    const m = /^([^_]*)_([0-9A-Za-z]+)(.*)$/.exec(sym);
    return m ? `${m[1]}<tspan dy="4" font-size="11">${m[2]}</tspan><tspan dy="-4">${m[3]}</tspan>` : sym;
  }
  const Q_MARK = '<tspan class="ckt-q">?</tspan>';
  const text = (x, y, inner, anchor, extra) => `<text x="${rd(x)}" y="${rd(y)}" text-anchor="${anchor || 'middle'}"${extra || ''}>${inner}</text>`;
  const LEN = x => (x.k === 'R' ? D.RLEN : x.k === 'E' ? D.ELEN : D.ALEN);

  function render(ex) {
    const c = ex.circuit, o = [], fmt = (x, u) => Units.format(x, u, ex.prefixes, 4);
    const xL = D.M + D.XL, xM = xL + D.MW, xR = xM + D.MW, yT = D.YT, yB = yT + D.H;
    const seg = {   // התחלה וסוף של כל מקטע, בכיוון המסלול
      Lb: [[xM, yB], [xL, yB]], Lv: [[xL, yB], [xL, yT]], Lt: [[xL, yT], [xM, yT]],
      Mv: [[xM, yB], [xM, yT]],
      Rb: [[xM, yB], [xR, yB]], Rv: [[xR, yB], [xR, yT]], Rt: [[xR, yT], [xM, yT]],
    };
    const placed = new Map();
    for (const [name, [p0, p1]] of Object.entries(seg)) {
      const list = c.slots[name], n = list.length, dx = p1[0] - p0[0], dy = p1[1] - p0[1], L = Math.hypot(dx, dy), u = [dx / L, dy / L];
      let cur = p0;
      list.forEach((x, i) => {
        const t = (i + 1) / (n + 1), cx = p0[0] + dx * t, cy = p0[1] + dy * t, h = LEN(x) / 2;
        const pin = [cx - u[0] * h, cy - u[1] * h], pout = [cx + u[0] * h, cy + u[1] * h];
        o.push(ln(cur[0], cur[1], pin[0], pin[1]));
        placed.set(x, { cx, cy, pin, pout, vert: dx === 0, u, slot: name });
        cur = pout;
      });
      o.push(ln(cur[0], cur[1], p1[0], p1[1]));
    }
    o.push(dot(xM, yT), dot(xM, yB));

    for (const [x, P] of placed) {
      const { cx, cy, vert } = P;
      if (x.k === 'R') {
        const pts = [];
        for (let i = 0; i <= 7; i++) {
          const s = i === 0 ? -25 : i === 7 ? 25 : -25 + 50 * (2 * i - 1) / 12, w = i === 0 || i === 7 ? 0 : (i % 2 ? -8 : 8);
          pts.push(vert ? [cx + w, cy + s] : [cx + s, cy + w]);
        }
        const v = shownValue(ex, x), unk = v === null;
        o.push(ln(...P.pin, cx - 25 * P.u[0], cy - 25 * P.u[1]));
        o.push(`<polyline${unk ? ' class="ckt-unk"' : ''} points="${pts.map(p => rd(p[0]) + ',' + rd(p[1])).join(' ')}"/>`);
        o.push(ln(cx + 25 * P.u[0], cy + 25 * P.u[1], ...P.pout));
        const val = v === null ? Q_MARK : v === undefined ? '' : fmt(v, 'Ω');
        if (vert) {
          o.push(text(cx - 16, cy + 5, svgSym(`R_${x.idx}`), 'end'));
          if (val) o.push(text(cx + 16, cy + 5, val, 'start'));
        } else {
          o.push(text(cx, cy - 16, svgSym(`R_${x.idx}`)));
          if (val) o.push(text(cx, cy + 28, val));
        }
      } else if (x.k === 'E') {   // סוללה אנכית: קו ארוך = +
        const plus = x.pol > 0 ? -1 : 1;   // צד הקו הארוך (y): למעלה אם pol=+1
        o.push(`<line class="ckt-plate" x1="${rd(cx - 18)}" y1="${rd(cy + plus * 6)}" x2="${rd(cx + 18)}" y2="${rd(cy + plus * 6)}"/>`);
        o.push(`<line class="ckt-plate ckt-short" x1="${rd(cx - 9)}" y1="${rd(cy - plus * 6)}" x2="${rd(cx + 9)}" y2="${rd(cy - plus * 6)}"/>`);
        o.push(ln(cx, P.pin[1], cx, cy + 6 * Math.sign(P.pin[1] - cy)), ln(cx, P.pout[1], cx, cy + 6 * Math.sign(P.pout[1] - cy)));
        const v = shownValue(ex, x);
        o.push(text(cx - 24, cy + 5, svgSym(`E_${x.idx}`), 'end'));
        o.push(text(cx + 24, cy + 5, v === null ? Q_MARK : v === undefined ? '' : fmt(v, 'V'), 'start'));
      } else {   // מד זרם, + בצד שבו הזרם נכנס
        o.push(`<circle class="ckt-meter" cx="${rd(cx)}" cy="${rd(cy)}" r="${D.MR}"/>`, text(cx, cy + 5, svgSym(`A_${x.idx}`), 'middle', ' font-size="12"'));
        const enter = x.I > 0 ? P.pin : P.pout, leave = x.I > 0 ? P.pout : P.pin;
        const off = vert ? [-12, 0] : [0, -12];
        o.push(text(enter[0] + off[0], enter[1] + off[1] + 4, '+', 'middle', ' font-size="13"'), text(leave[0] + off[0], leave[1] + off[1] + 4, '−', 'middle', ' font-size="13"'));
        const r = fmt(x.reading, 'A');
        o.push(vert ? text(cx + D.MR + 6, cy + 5, r, 'start') : text(cx, cy + D.MR + 18, r));
      }
    }

    // נקודות A ו-B
    for (const name of Object.keys(ex.marks || {})) {
      const p = ex.marks[name];
      let x, y, lx, ly;
      if (p.node) { x = xM; y = p.node === 'T' ? yT : yB; lx = x + 10; ly = p.node === 'T' ? y - 8 : y + 20; }
      else {
        const P = placed.get(p.item), q = p.end === 'in' ? P.pin : P.pout, s = p.end === 'in' ? -1 : 1;
        [x, y] = q;
        if (P.vert) { lx = x + 10; ly = y + s * Math.sign(P.u[1]) * 12 + 4; }
        else { lx = x + s * P.u[0] * 10; ly = y === yT ? y - 10 : y + 22; }
      }
      o.push(dot(x, y), text(lx, ly, `<tspan font-weight="bold">${name}</tspan>`));
    }
    const W = xR + 110, H = yB + 40;
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" class="ckt" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" ` +
      `direction="ltr" font-family="Arial, Helvetica, sans-serif" font-size="14" role="img" aria-label="שרטוט המעגל">` +
      `<style>.ckt line,.ckt polyline{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}` +
      `.ckt .ckt-unk{stroke:#d9480f;stroke-width:2.6}.ckt text{fill:#1f2937}.ckt .ckt-q{fill:#d9480f;font-weight:bold}` +
      `.ckt .ckt-fill{fill:#1f2937;stroke:none}.ckt .ckt-plate{stroke-width:3}.ckt .ckt-short{stroke-width:5}` +
      `.ckt .ckt-meter{fill:#fff;stroke:#1f2937;stroke-width:2}</style>` +
      `<rect width="100%" height="100%" fill="#fff"/>` + o.join('') + `</svg>`;
    return { svg, width: W, height: H, placed };
  }

  global.Engine = {
    VERSION, MAX_LEVEL, MAX_ATTEMPTS, TOL, MAX_TRIES, VALUES, LEVELS, LEVEL_FORMATS, BRANCH_SLOTS, CUR,
    makeRng, randomSeed, Units, makeExercise, givensList, shownValue, currentSummary, levelChoices,
    minLevel: () => 1, Draw: { render, D },
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<!-- ======================= ממשק (common/core.js) ======================= -->
<script>
(function () {
  'use strict';
  const E = window.Engine, $ = id => document.getElementById(id), esc = Core.esc, symHtml = Core.symHtml;
  const readSettings = () => ({ level: +$('level').value, power: $('power').checked, prefixes: $('prefixes').checked });
  // אחרי 3 ניסיונות: רק תשובות סופיות, ולצדן הזרם בכל נגד וכיוונו בשרטוט (בלי שיטת פתרון)
  const summaryHtml = ex => '<ul class="summary">' + E.currentSummary(ex).map(s =>
    `<li><bdi dir="ltr">${symHtml(s.sym)}</bdi>: <bdi dir="ltr">${esc(s.text)}</bdi>, ${s.dir}</li>`).join('') + '</ul>';
  Core.mountUI({
    engine: E, units: E.Units, prefixes: ['', 'M', 'k', 'm', 'µ'],
    readSettings, minLevel: () => E.minLevel(),
    makeExercise: (s, level, prevKind) => E.makeExercise({ level, power: s.power, prefixes: s.prefixes, prevKind }),
    render: ex => E.Draw.render(ex),
    givens: ex => E.givensList(ex),
    parts: ex => ex.parts.map(p => ({ text: p.text, answers: p.answers.map(a => (a.dir
      ? { type: 'choice', label: 'כיוון הזרם', short: 'הכיוון', value: a.value,
          options: [{ value: 'XY', label: `מ-${a.from} ל-${a.to}` }, { value: 'YX', label: `מ-${a.to} ל-${a.from}` }] }
      : { type: 'num', sym: a.sym, value: a.value, unit: a.unit, prefix: ex.prefixes })) })),
    solution: { title: 'הזרמים במעגל', html: summaryHtml, onCorrect: false },
    failSuffix: 'למטה הזרמים בכל הנגדים.',
  });
})();
</script>
</body>
