<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקות: תרגול מעגלי זרם חילופין טוריים</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 16px; color: #1f2937; background: #f4f6f9; }
  h1 { font-size: 20px; } h2 { font-size: 17px; margin-top: 24px; }
  pre { background: #fff; border: 1px solid #d9dee6; border-radius: 8px; padding: 10px; direction: ltr; text-align: left; white-space: pre-wrap; font-size: 13px; }
  .pass { color: #15803d; font-weight: bold; } .fail { color: #b42318; font-weight: bold; }
  .gal { direction: ltr; display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
  figure { margin: 0; background: #fff; border: 1px solid #d9dee6; border-radius: 8px; padding: 6px; min-width: 0; }
  figcaption { font-size: 12px; color: #6b7280; }
  figure svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<h1>בדיקות מנוע AC וגלריית ציורים</h1>
<p>דורש שרת מקומי. פרמטר <code dir="ltr">?n=40</code> = מספר תרגילים לכל צירוף (סוגי מעגל × רמה).</p>
<div id="summary"></div>
<pre id="log"></pre>
<h2>גלריה</h2>
<div id="gallery" class="gal"></div>

<script>
(async function () {
  const lines = [], log = s => lines.push(s);
  const html = await (await fetch('index.html', { cache: 'no-store' })).text();
  await new Promise((res, rej) => { const c = document.createElement('script'); c.src = '../common/core.js'; c.onload = res; c.onerror = rej; document.head.appendChild(c); });
  const sc = document.createElement('script');
  sc.textContent = new DOMParser().parseFromString(html, 'text/html').getElementById('engine').textContent;
  document.head.appendChild(sc);
  const E = window.Engine, U = E.Units;

  let pass = 0, fail = 0;
  const failures = [];
  function ok(cond, msg) { if (cond) pass++; else { fail++; if (failures.length < 40) failures.push(msg); } }
  const rel = (a, b) => Math.abs(a - b) / Math.abs(b);
  const PI2 = 2 * Math.PI, MULT = { M: 1e6, k: 1e3, m: 1e-3, 'µ': 1e-6, n: 1e-9 };

  // ---------- מאמת עצמאי: פותר רק מתוך מה שמוצג לתלמיד ----------
  function parseShown(str) {
    let m = /^(-?\d+(?:\.\d+)?) rad\/s$/.exec(str);
    if (m) return Number(m[1]);
    m = /^(-?\d+(?:\.\d+)?) (M|k|m|µ|n)?(Ω|H|F|Hz|V|A|s)$/.exec(str);
    if (!m) throw new Error('bad displayed value: ' + str);
    return Number(m[1]) * (m[2] ? MULT[m[2]] : 1);
  }
  function parseUt(str) {
    const m = /^(\d+(?:\.\d+)?)(√2)?·sin\((\d+(?:\.\d+)?)·t\) \[V\]$/.exec(str);
    if (!m) throw new Error('bad u(t): ' + str);
    const a = Number(m[1]);
    return { U: m[2] ? a : a / Math.SQRT2, w: Number(m[3]) };
  }
  function verify(ex) {
    const g = {};
    for (const x of E.givensList(ex)) {
      ok(!(x.q in g), `duplicate given ${x.q} (seed ${ex.seed})`);
      if (x.q === 'ut') { const p = parseUt(x.text); g.U = p.U; g.w = p.w; }
      else g[x.q] = parseShown(x.text);
    }
    const type = ex.ctype, has = t => E.COMPS[type].includes(t);
    const w = g.w != null ? g.w : g.f != null ? PI2 * g.f : NaN;
    const XL = g.XL != null ? g.XL : has('L') && g.L != null ? w * g.L : 0;
    const XC = g.XC != null ? g.XC : has('C') && g.C != null ? 1 / (w * g.C) : 0;
    const Zof = ww => Math.hypot(g.R, (has('L') ? ww * g.L : 0) - (has('C') ? 1 / (ww * g.C) : 0));
    const Z = Math.hypot(g.R, XL - XC);
    switch (ex.kind) {
      case 'XL': return [XL];
      case 'XC': return [XC];
      case 'w_from_f': return [w];
      case 'f_from_w': case 'f_from_ut': return [w / PI2];
      case 'T': case 'T_from_ut': return [PI2 / w];
      case 'U_from_ut': return [g.U];
      case 'Zphi': return [Z, Math.atan2(XL - XC, g.R) * 180 / Math.PI];
      case 'I': case 'I_ut': return [g.U / Z];
      case 'UR': case 'UR_ut': return [g.U / Z * g.R];
      case 'UL': case 'UL_ut': return [g.U / Z * XL];
      case 'UC': case 'UC_ut': return [g.U / Z * XC];
      case 'U_parts': return [Math.hypot(g.UR, (g.UL || 0) - (g.UC || 0))];
      case 'L_from_XL': return [g.XL / w];
      case 'C_from_XC': return [1 / (w * g.XC)];
      case 'R_from_UR_I': return [g.UR / g.I];
      case 'L_from_UL_I': return [g.UL / g.I / w];
      case 'C_from_UC_I': return [1 / (w * g.UC / g.I)];
      case 'X_from_Z': {
        const I = g.UR / g.R, X = Math.sqrt((g.U / I) ** 2 - g.R ** 2);
        return [type === 'RL' ? X / w : 1 / (w * X)];
      }
      case 'I_after_fk': return [g.U / Zof(w * ex.k)];
    }
    throw new Error('unknown kind ' + ex.kind);
  }
  function physics(ex) {
    const s = ex.state, tag = `(seed ${ex.seed}, ${ex.kind}, ${ex.ctype})`;
    const has = t => E.COMPS[ex.ctype].includes(t);
    ok(s.R >= 1 && s.R <= 1e5, `R out of range ${tag}`);
    if (has('L')) ok(s.L >= 1e-4 && s.L <= 10, `L out of range ${s.L} ${tag}`);
    if (has('C')) ok(s.C >= 1e-9 && s.C <= 1e-3, `C out of range ${s.C} ${tag}`);
    ok(Math.abs(s.phi) >= 3 && Math.abs(s.phi) <= 87, `phi out of range ${s.phi} ${tag}`);
    if (ex.ctype === 'RLC') ok(Math.abs(s.XL - s.XC) >= 0.25 * Math.max(s.XL, s.XC) - 1e-9, `near resonance ${tag}`);
    ok(s.U > 0 && s.U <= 1000 && s.I >= 1e-5 && s.I <= 10, `U/I out of range ${tag}`);
    ok(Math.abs(Math.hypot(s.UR, s.UL - s.UC) - s.U) <= 1e-9 * s.U, `voltage triangle ${tag}`);
  }
  function drawChecks(ex, stats) {
    const r = E.Draw.render(ex), tag = `(seed ${ex.seed}, ${ex.kind}, ${ex.ctype})`;
    ok(!/NaN|undefined|Infinity|null/.test(r.svg), `bad svg ${tag}`);
    ok(r.boxes.length === E.COMPS[ex.ctype].length, `component count ${tag}`);
    const b = r.boxes;
    for (let i = 0; i < b.length; i++) for (let j = i + 1; j < b.length; j++) {
      const A = b[i], B = b[j];
      ok(!(A.x < B.x + B.w - 0.5 && B.x < A.x + A.w - 0.5 && A.y < B.y + B.h - 0.5 && B.y < A.y + A.h - 0.5), `component boxes overlap ${tag}`);
    }
    for (const bx of b) {
      ok(bx.x >= 0 && bx.y >= 0 && bx.x + bx.w <= r.width && bx.y + bx.h <= r.height, `component outside drawing ${tag}`);
      for (const s of bx.labels) ok(s.length * 7.8 <= bx.w - 6, `label too wide "${s}" ${tag}`);
    }
    for (const s of r.srcLines) ok(s.length * 7.8 <= r.width - 32, `source label too wide "${s}" ${tag}`);
    const vms = (r.svg.match(/class="ckt-meter"/g) || []).length;
    const expect = 1 + (ex.disp.current && ex.disp.current.meter ? 1 : 0) + ex.disp.comps.filter(c => c.extras.some(e => e.meter)).length;
    ok(vms === expect, `meter count ${vms} != ${expect} ${tag}`);
    stats.maxW = Math.max(stats.maxW, r.width); stats.maxH = Math.max(stats.maxH, r.height);
  }

  // ---------- יחידות ----------
  ok(U.parseNumber('2,2') === 2.2 && isNaN(U.parseNumber('-5')) && U.parseNumber('-36.87', true) === -36.87 && U.parseNumber('−5', true) === -5, 'parse');
  ok(U.check(-36.6, -36.87, '°') && !U.check(-36.2, -36.87, '°') && !U.check(36.87, -36.87, '°'), 'angle tolerance and sign');
  ok(U.check(1.005, 1, 'Ω') && !U.check(1.02, 1, 'Ω'), 'tolerance 1%');
  ok(E.fmt(2.2e-8, 'F') === '22 nF' && E.fmt(0.047, 'H') === '47 mH' && E.fmt(2000, 'rad/s') === '2000 rad/s' && E.fmt(5000, 'Hz') === '5 kHz', 'format');
  ok(U.formatAnswer(-36.8699, '°') === '-36.87°' && U.formatAnswer(12566.3706, 'rad/s') === '12566.37 rad/s', 'formatAnswer');
  ok(U.prefixHint(22, 22e-9, 'F') && !U.prefixHint(10, 22, '°'), 'prefix hint');
  {
    const a = E.makeExercise({ level: 5, types: ['RLC'], seed: 99 }), b = E.makeExercise({ level: 5, types: ['RLC'], seed: 99 });
    ok(JSON.stringify(a.parts.map(p => p.answers)) === JSON.stringify(b.parts.map(p => p.answers)) && E.Draw.render(a).svg === E.Draw.render(b).svg, 'deterministic');
  }

  // ---------- דף הנחיתה: גרסה וקישורים ----------
  {
    const pages = { landing: '../index.html', ohm: '../ohm/index.html', ac: 'index.html' }, vers = {};
    for (const [name, path] of Object.entries(pages)) {
      const url = new URL(path, location.href), src = await (await fetch(url, { cache: 'no-store' })).text();
      const m = /const VERSION = '(v\d+\.\d+)'/.exec(src);
      vers[name] = m && m[1];
      for (const a of new DOMParser().parseFromString(src, 'text/html').querySelectorAll('a[href]')) {
        const href = a.getAttribute('href');
        ok(!/^(\/|[a-z]+:)/i.test(href), `non-relative link "${href}" on ${name}`);
        const r = await fetch(new URL(href, url), { cache: 'no-store' });
        ok(r.ok, `broken link "${href}" on ${name}`);
        log(`link ${name} -> ${href}: ${r.status}`);
      }
    }
    log('versions: ' + JSON.stringify(vers));
    ok(vers.landing === vers.ohm && vers.ohm === vers.ac && vers.ac === E.VERSION, 'site versions match');
  }

  // ---------- מאמת עצמאי לסעיפים: כל הגדלים נגזרים רק מהנתונים המוצגים, לפי כללי הפיזיקה ----------
  function deriveAll(ex) {
    const v = {}, type = ex.ctype, has = t => E.COMPS[type].includes(t), PI2 = 2 * Math.PI;
    for (const x of E.givensList(ex)) {
      if (x.q === 'ut') { const p = parseUt(x.text); v.U = p.U; v.w = p.w; }
      else v[x.q] = parseShown(x.text);
    }
    const k = n => v[n] !== undefined;
    let changed = true;
    const set = (n, val) => { if (!k(n) && isFinite(val)) { v[n] = val; changed = true; } };
    const reactKnown = () => (!has('L') || k('XL')) && (!has('C') || k('XC'));
    const Xnet = () => (has('L') ? v.XL : 0) - (has('C') ? v.XC : 0);
    for (let it = 0; it < 40 && changed; it++) {
      changed = false;
      if (k('f')) set('w', PI2 * v.f);
      if (k('w')) { set('f', v.w / PI2); set('T', PI2 / v.w); }
      if (has('L')) { if (k('L') && k('w')) set('XL', v.w * v.L); if (k('XL') && k('w')) set('L', v.XL / v.w); if (k('UL') && k('I')) set('XL', v.UL / v.I); }
      if (has('C')) { if (k('C') && k('w')) set('XC', 1 / (v.w * v.C)); if (k('XC') && k('w')) set('C', 1 / (v.w * v.XC)); if (k('UC') && k('I')) set('XC', v.UC / v.I); }
      if (k('UR') && k('I')) set('R', v.UR / v.I);
      if (k('UR') && k('R')) set('I', v.UR / v.R);
      if (k('R') && reactKnown()) { set('Z', Math.hypot(v.R, Xnet())); set('phi', Math.atan2(Xnet(), v.R) * 180 / Math.PI); }
      if (k('U') && k('I')) set('Z', v.U / v.I);
      if (k('U') && k('Z')) set('I', v.U / v.Z);
      if (k('Z') && k('R') && type !== 'RLC') { const X = Math.sqrt(v.Z ** 2 - v.R ** 2); set(has('L') ? 'XL' : 'XC', X); }
      if (k('I')) { if (k('R')) set('UR', v.I * v.R); if (has('L') && k('XL')) set('UL', v.I * v.XL); if (has('C') && k('XC')) set('UC', v.I * v.XC); }
      if (k('UR') && (!has('L') || k('UL')) && (!has('C') || k('UC'))) set('U', Math.hypot(v.UR, (has('L') ? v.UL : 0) - (has('C') ? v.UC : 0)));
    }
    if (ex.k && k('w') && k('R') && k('U') && (!has('L') || k('L')) && (!has('C') || k('C'))) {
      const w2 = v.w * ex.k;
      v.Inew = v.U / Math.hypot(v.R, (has('L') ? w2 * v.L : 0) - (has('C') ? 1 / (w2 * v.C) : 0));
    }
    return v;
  }

  // ---------- ריצה המונית ----------
  const N = +(new URLSearchParams(location.search).get('n') || 40);
  const typeSets = [['RL'], ['RC'], ['RLC'], ['RL', 'RC', 'RLC']];
  const fmtStats = {}, partStats = {}, dstats = { maxW: 0, maxH: 0 };
  let total = 0, meters = 0, ut = 0, vLetter = 0;
  const t0 = performance.now();
  for (const types of typeSets) for (let level = 1; level <= 5; level++) for (let i = 0; i < N; i++) {
    const seed = (total * 2654435761 + 11) >>> 0;
    let ex;
    try { ex = E.makeExercise({ level, types, seed }); } catch (e) { ok(false, `makeExercise threw ${e.message} (seed ${seed})`); total++; continue; }
    total++;
    const tag = `(seed ${seed}, L${level} ${ex.format}/${ex.kind}, ${ex.ctype})`;
    const fs = fmtStats[`L${level} ${ex.kind}`] || (fmtStats[`L${level} ${ex.kind}`] = { n: 0, tries: 0, maxTries: 0 });
    fs.n++; fs.tries += ex.tries; fs.maxTries = Math.max(fs.maxTries, ex.tries);
    ok(types.includes(ex.ctype), 'ctype from selected ' + tag);
    { // R, X_L, X_C, X, Z בפער של עד פי 100
      const s = ex.state, zs = [s.R, s.Z, Math.abs(s.X)].concat(s.XL ? [s.XL] : [], s.XC ? [s.XC] : []);
      ok(Math.max(...zs) <= 100 * Math.min(...zs) * (1 + 1e-9), 'impedance spread over 100x ' + tag);
    }
    if (ex.meters) meters++; if (ex.src !== 'U') ut++; if (ex.u === 'V') vLetter++;
    // מבנה לפי רמה
    const n = ex.parts.length, qs = ex.parts.map(p => p.answers.map(a => a.q).join('+')).join(',');
    partStats[`L${level}: ${qs}`] = (partStats[`L${level}: ${qs}`] || 0) + 1;
    if (level === 1) ok(n === 1 && ex.format === 'single' && E.KINDS.find(x => x.kind === ex.kind).lv === 1, 'L1 single question ' + tag);
    else if (level === 2) ok(n >= 2 && n <= 3 && ex.kind === 'fwd', 'L2: 2-3 parts ' + tag);
    else if (level <= 4) ok(n >= 3 && n <= 4 && ex.kind === 'fwd', 'L3-4: 3-4 parts ' + tag);
    else ok(n >= 3 && n <= 4 && ['A', 'B', 'C'].includes(ex.kind) && (ex.kind !== 'A' || ex.ctype !== 'RLC'), 'L5: reverse 3-4 parts ' + tag);
    if (level === 4) ok(ex.src !== 'U', 'L4 source as u(t) ' + tag);
    physics(ex);
    const v = deriveAll(ex);
    ex.parts.forEach((p, pi) => {
      p.answers.forEach(a => {
        ok(a.q && v[a.q] !== undefined, `part ${pi + 1} answer ${a.sym} (${a.q}) not derivable from the displayed givens ` + tag);
        if (v[a.q] === undefined) return;
        const good = a.unit === '°' ? Math.abs(v[a.q] - a.value) < 1e-9 : rel(v[a.q], a.value) < 1e-9;
        ok(good, `answer mismatch part ${pi + 1} ${a.sym}: engine ${a.value} vs derived ${v[a.q]} ` + tag);
        const shown = U.formatAnswer(a.value, a.unit);
        const back = a.unit === '°' ? Number(shown.replace('°', '')) : parseShown(shown);
        ok(U.check(back, a.value, a.unit), `displayed answer not accepted ${shown} ` + tag);
      });
      // הפתרון של כל סעיף מסתיים בתשובות שלו
      const tail = p.steps.slice(-p.answers.length);
      ok(p.steps.length > 0 && p.answers.every((a, j) => Math.abs(tail[j].value - a.value) <= 1e-9 * Math.max(1, Math.abs(a.value))),
        `last steps != answers in part ${pi + 1} ` + tag);
      ok(p.steps.every(s => isFinite(s.value)), 'bad step value ' + tag);
      if (level > 1) ok(p.text && !/undefined/.test(p.text), 'part text ' + tag);
    });
    drawChecks(ex, dstats);
  }
  const dt = performance.now() - t0;
  log(`exercises: ${total}   time: ${(dt / 1000).toFixed(1)} s`);
  log(`meters ${(100 * meters / total).toFixed(0)}%, u(t) ${(100 * ut / total).toFixed(0)}%, letter V ${(100 * vLetter / total).toFixed(0)}%`);
  log(`drawing: max width ${dstats.maxW.toFixed(0)}, max height ${dstats.maxH.toFixed(0)}`);
  log('\nformat           n   avgTries  maxTries');
  Object.keys(fmtStats).sort().forEach(k => { const s = fmtStats[k]; log(`${k.padEnd(14)} ${String(s.n).padStart(5)}  ${(s.tries / s.n).toFixed(1).padStart(8)}  ${String(s.maxTries).padStart(8)}`); });
  log('\nparts (by quantity): ' + JSON.stringify(partStats));
  if (failures.length) log('\nFAILURES (first 40):\n' + failures.join('\n'));
  document.getElementById('log').textContent = lines.join('\n');
  document.getElementById('summary').innerHTML =
    `<p class="${fail ? 'fail' : 'pass'}">${fail ? 'נכשל' : 'עבר'}: <bdi dir="ltr">${pass} passed, ${fail} failed</bdi></p>`;
  window.TEST_RESULT = { pass, fail, total, failures, text: lines.join('\n') };

  // ---------- גלריה ----------
  const gal = [];
  ['RL', 'RC', 'RLC'].forEach((t, ti) => [1, 2, 3, 4, 5, 5].forEach((lv, i) => {
    const ex = E.makeExercise({ level: lv, types: [t], seed: 700 + i * 13 + ti });
    gal.push(`<figure><figcaption>${t} L${lv} ${ex.kind} seed ${ex.seed} | ${ex.parts.map(p => p.text || ex.text).join(' / ')}</figcaption>${E.Draw.render(ex).svg}</figure>`);
  }));
  document.getElementById('gallery').innerHTML = gal.join('');
})().catch(e => { document.getElementById('log').textContent = 'ERROR: ' + e.stack; window.TEST_RESULT = { error: String(e.stack) }; });
</script>
</body>
</html>
