<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תרגול מעגלי זרם חילופין טוריים (RC, RL, RLC)</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --fg: #1f2937; --muted: #6b7280; --line: #d9dee6;
    --accent: #1d4ed8; --accent-soft: #e8efff; --ok: #15803d; --ok-soft: #e7f6ec;
    --bad: #b42318; --bad-soft: #fdecea; --warn: #9a6700; --warn-soft: #fff6db; --unk: #d9480f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 17px; line-height: 1.5; }
  header { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header .ver { font-size: 13px; opacity: .85; }
  header .home { margin-inline-start: auto; color: #fff; font-size: 15px; white-space: nowrap; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  h2 { margin: 0 0 12px; font-size: 19px; }
  h3 { margin: 18px 0 8px; font-size: 17px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 14px; padding: 10px 14px; }
  legend { padding: 0 6px; color: var(--muted); font-size: 15px; }
  .opt { display: inline-flex; align-items: center; gap: 6px; margin-inline-end: 18px; cursor: pointer; }
  .opt input, .switch input { width: 18px; height: 18px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .switch { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; cursor: pointer; }
  select, input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid #b8c0cc; border-radius: 8px; background: #fff; color: var(--fg); }
  button { font: inherit; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--accent);
           background: #fff; color: var(--accent); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.link { border: none; background: none; padding: 4px 0; text-decoration: underline; }
  .note { color: var(--muted); font-size: 15px; min-height: 1.2em; margin: 4px 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 8px; }
  .badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 12px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 15px; }
  .q { font-size: 18px; margin: 6px 0 10px; }
  .circuit { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; }
  .circuit svg { width: 100%; height: auto; display: block; margin: 0 auto; }
  .givens { margin: 10px 0 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { background: #f1f3f6; border-radius: 6px; padding: 1px 8px; font-size: 16px; white-space: nowrap; }
  .chip.unk { background: #fff0e6; color: var(--unk); font-weight: 600; }
  .ans { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 14px 0 8px; }
  .ansbox { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ansbox input { width: 8.5em; }
  .fb { border-radius: 8px; padding: 0; margin: 8px 0; }
  .fb:not(:empty) { padding: 8px 12px; }
  .fb.ok { background: var(--ok-soft); color: var(--ok); }
  .fb.bad { background: var(--bad-soft); color: var(--bad); }
  .fb.warn { background: var(--warn-soft); color: var(--warn); }
  #steps { padding-inline-start: 22px; margin: 0; }
  #steps li { margin-bottom: 10px; }
  #steps .sn { color: var(--muted); font-size: 15px; }
  #steps .eq { font-family: Consolas, "Courier New", monospace; font-size: 16px; text-align: left; overflow-x: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .actions .actions { margin-top: 0; }
  .seed { color: #a0a7b3; font-size: 12px; text-align: left; margin-top: 10px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 16px 24px; }
  bdi[dir=ltr], [dir=ltr] { unicode-bidi: isolate; }
  [hidden] { display: none !important; }
  .ansrows { display: flex; flex-direction: column; gap: 8px; }
  .ansbox .usym { min-width: 1.6em; text-align: right; }
</style>
</head>
<body>
<header>
  <h1>תרגול מעגלי זרם חילופין טוריים (RC, RL, RLC)</h1>
  <span class="ver" dir="ltr" id="ver"></span>
  <a class="home" href="../index.html">→ לדף הראשי</a>
</header>

<main>
  <section id="setup" class="card">
    <h2>הגדרות תרגול</h2>
    <fieldset>
      <legend>סוג מעגל (אפשר לבחור כמה)</legend>
      <label class="opt"><input type="checkbox" id="tRL" checked> <bdi dir="ltr">RL</bdi></label>
      <label class="opt"><input type="checkbox" id="tRC" checked> <bdi dir="ltr">RC</bdi></label>
      <label class="opt"><input type="checkbox" id="tRLC" checked> <bdi dir="ltr">RLC</bdi></label>
    </fieldset>
    <label class="row">רמת קושי התחלתית:
      <select id="level">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>
    <p id="setNote" class="note"></p>
    <button id="start" class="primary">התחלה</button>
  </section>

  <section id="play" class="card" hidden>
    <div class="bar">
      <span id="lvl" class="badge"></span>
      <span id="ctype" class="muted"></span>
      <span id="tries" class="muted"></span>
    </div>
    <p id="qtext" class="q"></p>
    <div id="circuit" class="circuit" dir="ltr"></div>
    <div id="givens" class="givens"></div>
    <div id="unknown" class="givens"></div>

    <form id="ansForm" class="ans" autocomplete="off">
      <label>התשובה:</label>
      <div id="ansRows" class="ansrows"></div>
      <button type="submit" id="checkBtn" class="primary">בדיקה</button>
    </form>

    <div id="feedback" class="fb" role="status" aria-live="polite"></div>
    <button id="showSol" type="button" class="link" hidden>הצג פתרון מלא</button>
    <div id="solution" hidden>
      <h3>פתרון שלב אחר שלב</h3>
      <ol id="steps"></ol>
    </div>

    <div class="actions">
      <span id="choices" class="actions" hidden></span>
      <button id="next" type="button">תרגיל חדש</button>
      <button id="back" type="button">חזרה להגדרות</button>
    </div>
    <div id="seed" class="seed" dir="ltr"></div>
  </section>
</main>

<footer>נוצר על ידי ראשון דיבקר בעזרת Claude · <span dir="ltr" id="ver2"></span></footer>

<!-- ======================= מנוע (ללא DOM) ======================= -->
<script id="engine">
(function (global) {
  'use strict';

  const VERSION = 'v1.4';
  const MAX_LEVEL = 5;
  const MAX_ATTEMPTS = 3;
  const TOL = 0.01;        // סטייה יחסית מותרת (1%)
  const ANG_TOL = 0.5;     // סטייה מותרת בזווית, במעלות
  const MAX_TRIES = 2000;  // הגרלות עד מעגל שעומד באילוצים הפיזיקליים

  const TYPE_NAMES = { RL: 'RL', RC: 'RC', RLC: 'RLC' };
  const COMPS = { RL: ['R', 'L'], RC: ['R', 'C'], RLC: ['R', 'L', 'C'] };
  const UNITS = { R: 'Ω', L: 'H', C: 'F' };
  const sum = a => a.reduce((s, x) => s + x, 0);
  const mant = (ms, e0, e1) => {
    const out = [];
    for (let e = e0; e <= e1; e++) ms.forEach(m => out.push(Number((m * Math.pow(10, e)).toPrecision(6))));
    return out;
  };
  // ערכים "יפים". כל נתון שמוצג לתלמיד נלקח מכאן, וכל השאר מחושב ממנו.
  const VALUES = {
    R: [10, 15, 22, 33, 47, 68, 100, 150, 220, 330, 470, 680, 1000, 1500, 2200, 3300, 4700, 6800, 10000],
    L: [0.001, 0.0022, 0.0047, 0.01, 0.022, 0.047, 0.1, 0.22, 0.47, 1],
    C: [1e-8, 2.2e-8, 4.7e-8, 1e-7, 2.2e-7, 4.7e-7, 1e-6, 2.2e-6, 4.7e-6, 1e-5, 2.2e-5, 4.7e-5, 1e-4],
    F: [50, 60, 100, 200, 500, 1000, 2000, 5000, 10000],
    W: [100, 200, 500, 1000, 2000, 5000, 10000, 20000],
    U: [5, 6, 9, 10, 12, 15, 20, 24, 25, 30, 48, 50, 100, 110, 120, 220, 230],
    UM: [10, 20, 50, 100, 150, 200, 300],
    I: mant([1, 1.2, 1.5, 2, 2.4, 2.5, 3, 4, 5, 6, 8], -4, -1),
    VX: mant([1, 1.2, 1.5, 2, 2.4, 2.5, 3, 3.6, 4, 4.8, 5, 5.6, 6, 7, 8, 9], -1, 2),
    X: mant([1, 1.2, 1.4, 1.5, 1.6, 2, 2.2, 2.5, 3, 3.3, 4, 4.7, 5, 6, 6.8, 8], 1, 3),
    K: [2, 3, 4, 0.5],
  };

  // ---------------- Rng (mulberry32, seedable) ----------------
  function makeRng(seed) {
    let a = seed >>> 0;
    const next = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const int = (lo, hi) => lo + Math.floor(next() * (hi - lo + 1));
    const pick = arr => arr[Math.floor(next() * arr.length)];
    const shuffle = arr => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = int(0, i); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    return { next, int, pick, shuffle };
  }
  const randomSeed = () => (Math.random() * 4294967296) >>> 0;

  // ---------------- Units (תחיליות תמיד פעילות) ----------------
  const PREFIXES = [
    { p: 'M', f: 1e6 }, { p: 'k', f: 1e3 }, { p: '', f: 1 }, { p: 'm', f: 1e-3 }, { p: 'µ', f: 1e-6 }, { p: 'n', f: 1e-9 },
  ];
  const roundSig = (x, s) => (x === 0 ? 0 : Number(x.toPrecision(s)));
  function numStr(v) {
    let s = String(v);
    if (/e/i.test(s)) s = v.toFixed(15).replace(/\.?0+$/, '');
    return s;
  }
  function pickPrefix(x) {
    const a = Math.abs(x);
    for (const P of PREFIXES) if (a >= P.f * (1 - 1e-9)) return P;
    return PREFIXES[PREFIXES.length - 1];
  }
  // הצגת ערך (נתון או שלב ביניים). ω בלי תחילית, זווית ב-2 ספרות אחרי הנקודה
  function fmt(x, unit, sig = 4) {
    if (unit === '°') return numStr(Math.round(x * 100) / 100) + '°';
    if (unit === 'rad/s') return numStr(roundSig(x, sig)) + ' rad/s';
    const P = pickPrefix(x);
    return numStr(roundSig(x / P.f, sig)) + ' ' + P.p + unit;
  }
  const Units = {
    PREFIXES, fmt,
    // התשובה הנכונה: 2 ספרות אחרי הנקודה ביחידה הטבעית; ערך קטן מ-1: 3 ספרות משמעותיות
    formatAnswer(x, unit) {
      if (unit === '°') return fmt(x, unit);
      const P = unit === 'rad/s' ? { p: '', f: 1 } : pickPrefix(x);
      let v = x / P.f;
      v = Math.abs(v) >= 1 ? Math.round(v * 100) / 100 : roundSig(v, 3);
      return numStr(v) + ' ' + P.p + unit;
    },
    // קלט תלמיד: נקודה או פסיק עשרוני; מינוס רק בזווית
    parseNumber(str, allowNeg) {
      const s = String(str).trim().replace(',', '.').replace('−', '-');
      const re = allowNeg ? /^-?(\d+(\.\d*)?|\.\d+)$/ : /^(\d+(\.\d*)?|\.\d+)$/;
      return re.test(s) ? Number(s) : NaN;
    },
    check(student, correct, unit) {
      if (unit === '°') return Math.abs(student - correct) <= ANG_TOL;
      return Math.abs(student - correct) <= TOL * Math.abs(correct);
    },
    prefixHint(student, correct, unit) {
      return unit !== '°' && [1e3, 1e6, 1e9, 1e-3, 1e-6, 1e-9].some(k => Units.check(student, correct * k, unit));
    },
  };

  // ---------------- Circuit state ----------------
  // s: { type, order, R, L?, C?, w, U, Um? } -> כל השאר מחושב
  function solveState(s) {
    const has = t => COMPS[s.type].includes(t);
    s.f = s.w / (2 * Math.PI);
    s.T = 1 / s.f;
    s.XL = has('L') ? s.w * s.L : 0;
    s.XC = has('C') ? 1 / (s.w * s.C) : 0;
    s.X = s.XL - s.XC;
    s.Z = Math.hypot(s.R, s.X);
    s.phi = Math.atan2(s.X, s.R) * 180 / Math.PI;
    s.I = s.U / s.Z;
    s.UR = s.I * s.R; s.UL = s.I * s.XL; s.UC = s.I * s.XC;
    if (s.Um == null) s.Um = s.U * Math.SQRT2;
    return s;
  }
  // אילוצים פיזיקליים וטווחים מציאותיים. תהודה לא בתוכנית, לכן ב-RLC מרחיקים את X_L מ-X_C.
  function valid(s) {
    const has = t => COMPS[s.type].includes(t);
    if (!(s.R >= 1 && s.R <= 1e5)) return false;
    if (has('L') && !(s.L >= 1e-4 && s.L <= 10)) return false;
    if (has('C') && !(s.C >= 1e-9 && s.C <= 1e-3)) return false;
    if (!(s.f >= 10 && s.f <= 1e5)) return false;
    if (!(s.I >= 1e-5 && s.I <= 10)) return false;
    if (!(s.U > 0 && s.U <= 1000)) return false;
    const a = Math.abs(s.phi);
    if (a < 3 || a > 87) return false;
    if (s.type === 'RLC' && Math.abs(s.XL - s.XC) < 0.25 * Math.max(s.XL, s.XC)) return false;
    return true;
  }
  function newState(rng, type, o) {
    const s = { type, order: rng.shuffle(COMPS[type]) };
    s.w = o.fmode === 'f' ? 2 * Math.PI * rng.pick(VALUES.F) : rng.pick(VALUES.W);
    return s;
  }
  function pickSource(rng, s, o) {
    if (o.src === 'utn') { s.Um = rng.pick(VALUES.UM); s.U = s.Um / Math.SQRT2; }
    else s.U = rng.pick(VALUES.U);
  }
  function forwardState(rng, type, o) {
    const s = newState(rng, type, o);
    s.R = rng.pick(VALUES.R);
    if (COMPS[type].includes('L')) s.L = rng.pick(VALUES.L);
    if (COMPS[type].includes('C')) s.C = rng.pick(VALUES.C);
    pickSource(rng, s, o);
    solveState(s);
    return valid(s) ? s : null;
  }
  // קובע L ו/או C כך שההיגב הכולל בערכו המוחלט יהיה X
  function realizeX(rng, s, X) {
    if (s.type === 'RL') s.L = X / s.w;
    else if (s.type === 'RC') s.C = 1 / (s.w * X);
    else {
      const base = X * (0.5 + 2 * rng.next());
      const [XL, XC] = rng.next() < 0.5 ? [base + X, base] : [base, base + X];
      s.L = XL / s.w; s.C = 1 / (s.w * XC);
    }
  }

  // ---------------- Display spec ----------------
  // comps: לפי סדר הציור. value: מספר = נתון, null = נעלם, undefined = שם בלבד
  function dispFor(s) {
    return {
      comps: s.order.map(t => ({ t, name: t, q: t, value: t === 'R' ? s.R : t === 'L' ? s.L : s.C, unit: UNITS[t], extras: [] })),
      src: [], current: null, bottom: [],
    };
  }
  const comp = (d, t) => d.comps.find(c => c.t === t);
  function srcLines(d, s, o, U = 'show') {
    if (o.src !== 'U') {   // u(t) = Um·sin(ωt)
      const amp = o.src === 'ut2' ? `${numStr(s.U)}√2` : numStr(s.Um);
      d.src.push({ sym: o.u.toLowerCase() + '(t)', text: `${amp}·sin(${numStr(s.w)}·t) [V]`, q: 'ut' });
      if (U === 'ask') d.src.push({ sym: o.u, value: null, unit: 'V' });
      return;
    }
    if (U === 'show') d.src.push({ sym: o.u, value: s.U, unit: 'V', q: 'U' });
    if (U === 'ask') d.src.push({ sym: o.u, value: null, unit: 'V' });
    d.src.push(o.fmode === 'f' ? { sym: 'f', value: s.f, unit: 'Hz', q: 'f' } : { sym: 'ω', value: s.w, unit: 'rad/s', q: 'w' });
  }

  // ---------------- Solution steps ----------------
  // step = { note, lhs, formula, subst, value, unit }; סמלים בכתיב X_sub
  const S = (ctx, note, lhs, formula, subst, value, unit) => ctx.steps.push({ note, lhs, formula, subst, value, unit });
  function wStep(ctx) {
    if (ctx.o.src !== 'U' && !ctx.wRead) { S(ctx, 'קוראים את ω מתוך הביטוי של מתח המקור', 'ω', '', '', ctx.s.w, 'rad/s'); ctx.wRead = true; }
  }
  function uStep(ctx) {
    if (ctx.o.src === 'U' || ctx.uRead) return;
    const s = ctx.s, u = ctx.o.u, amp = ctx.o.src === 'ut2' ? `${numStr(s.U)}√2 V` : fmt(s.Um, 'V');
    S(ctx, 'ערך יעיל = ערך השיא חלקי √2', u, `${u}_m / √2`, `${amp} / √2`, s.U, 'V');
    ctx.uRead = true;
  }
  const freqSub = (ctx, w) => (ctx.o.fmode === 'f' ? `2π·${fmt(w / (2 * Math.PI), 'Hz')}` : fmt(w, 'rad/s'));
  function reactStep(ctx, t, w, p = '') {
    const s = ctx.s, useF = ctx.o.fmode === 'f';
    wStep(ctx);
    if (t === 'L') S(ctx, 'היגב הסליל', 'X_L' + p, useF ? `2π·f${p}·L` : `ω${p}·L`,
      `${freqSub(ctx, w)}·${fmt(s.L, 'H')}`, w * s.L, 'Ω');
    else S(ctx, 'היגב הקבל', 'X_C' + p, useF ? `1 / (2π·f${p}·C)` : `1 / (ω${p}·C)`,
      `1 / (${freqSub(ctx, w)}·${fmt(s.C, 'F')})`, 1 / (w * s.C), 'Ω');
  }
  function zSteps(ctx, w, p = '') {
    const s = ctx.s, has = t => COMPS[s.type].includes(t);
    const XL = has('L') ? w * s.L : 0, XC = has('C') ? 1 / (w * s.C) : 0, X = XL - XC, Z = Math.hypot(s.R, X);
    if (has('L')) reactStep(ctx, 'L', w, p);
    if (has('C')) reactStep(ctx, 'C', w, p);
    if (s.type === 'RLC') S(ctx, 'ההיגב הכולל', 'X' + p, `X_L${p} − X_C${p}`, `${fmt(XL, 'Ω')} − ${fmt(XC, 'Ω')}`, X, 'Ω');
    const xs = s.type === 'RL' ? 'X_L' : s.type === 'RC' ? 'X_C' : 'X';
    S(ctx, 'עכבת המעגל', 'Z' + p, `√(R² + ${xs}${p}²)`, `√((${fmt(s.R, 'Ω')})² + (${fmt(Math.abs(X), 'Ω')})²)`, Z, 'Ω');
    return { XL, XC, X, Z };
  }
  function phiStep(ctx, X) {
    const s = ctx.s;
    const [f, v] = s.type === 'RL' ? ['arctan(X_L / R)', fmt(X, 'Ω')] : s.type === 'RC' ? ['arctan(−X_C / R)', '−' + fmt(-X, 'Ω')] : ['arctan(X / R)', fmt(X, 'Ω')];
    S(ctx, 'הפרש המופע: חיובי במעגל השראותי, שלילי במעגל קיבולי', 'φ', f, `arctan(${v} / ${fmt(s.R, 'Ω')})`,
      Math.atan2(X, s.R) * 180 / Math.PI, '°');
  }
  function iStep(ctx, Z, p = '') {
    uStep(ctx);
    const s = ctx.s, u = ctx.o.u;
    S(ctx, 'חוק אוהם במעגל זרם חילופין', 'I' + p, `${u} / Z${p}`, `${fmt(s.U, 'V')} / ${fmt(Z, 'Ω')}`, s.U / Z, 'A');
  }
  const xSym = t => (t === 'R' ? 'R' : 'X_' + t);
  const xVal = (s, t) => (t === 'R' ? s.R : t === 'L' ? s.XL : s.XC);
  const COMP_NAME = { R: 'הנגד', L: 'הסליל', C: 'הקבל' };

  // ---------------- Question builders ----------------
  // כל בונה מחזיר null אם המעגל לא עומד באילוצים (ואז מגרילים שוב).
  // שאלות ישירות: כל הרכיבים והמקור נתונים. שאלות הפוכות: בוחרים את הנתונים המוצגים מתוך ערכים יפים
  // ומחשבים מהם את כל השאר, כך ששום נתון לא מוצג מעוגל.
  const B = {
    XL(rng, type, o, ctx) {
      const s = forwardState(rng, type, o); if (!s) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      comp(d, 'L').extras.push({ sym: 'X_L', value: null, unit: 'Ω' });
      reactStep(ctx, 'L', s.w);
      return { s, d, answers: [{ sym: 'X_L', value: s.XL, unit: 'Ω' }], text: 'חשבו את ההיגב של הסליל, X_L.' };
    },
    XC(rng, type, o, ctx) {
      const s = forwardState(rng, type, o); if (!s) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      comp(d, 'C').extras.push({ sym: 'X_C', value: null, unit: 'Ω' });
      reactStep(ctx, 'C', s.w);
      return { s, d, answers: [{ sym: 'X_C', value: s.XC, unit: 'Ω' }], text: 'חשבו את ההיגב של הקבל, X_C.' };
    },
    w_from_f(rng, type, o, ctx) {
      const s = forwardState(rng, type, o); if (!s) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      d.src.push({ sym: 'ω', value: null, unit: 'rad/s' });
      S(ctx, 'מהירות זוויתית', 'ω', '2π·f', `2π·${fmt(s.f, 'Hz')}`, s.w, 'rad/s');
      return { s, d, answers: [{ sym: 'ω', value: s.w, unit: 'rad/s' }], text: 'חשבו את המהירות הזוויתית ω של מתח המקור.' };
    },
    f_from_w(rng, type, o, ctx) {
      const s = forwardState(rng, type, o); if (!s) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      d.src.push({ sym: 'f', value: null, unit: 'Hz' });
      wStep(ctx);
      S(ctx, 'תדירות', 'f', 'ω / (2π)', `${fmt(s.w, 'rad/s')} / (2π)`, s.f, 'Hz');
      return { s, d, answers: [{ sym: 'f', value: s.f, unit: 'Hz' }], text: 'חשבו את תדירות מתח המקור f.' };
    },
    T(rng, type, o, ctx) {
      const s = forwardState(rng, type, o); if (!s) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      d.src.push({ sym: 'T', value: null, unit: 's' });
      wStep(ctx);
      if (o.fmode === 'f') S(ctx, 'זמן מחזור', 'T', '1 / f', `1 / ${fmt(s.f, 'Hz')}`, s.T, 's');
      else S(ctx, 'זמן מחזור', 'T', '2π / ω', `2π / ${fmt(s.w, 'rad/s')}`, s.T, 's');
      return { s, d, answers: [{ sym: 'T', value: s.T, unit: 's' }], text: 'חשבו את זמן המחזור T של מתח המקור.' };
    },
    U_from_ut(rng, type, o, ctx) {
      const s = forwardState(rng, type, o); if (!s) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o, 'ask');
      uStep(ctx);
      return { s, d, answers: [{ sym: o.u, value: s.U, unit: 'V' }], text: `חשבו את מתח המקור ${o.u} (ערך יעיל).` };
    },
    Zphi(rng, type, o, ctx) {
      const s = forwardState(rng, type, o); if (!s) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      d.bottom.push({ sym: 'Z', value: null, unit: 'Ω' }, { sym: 'φ', value: null, unit: '°' });
      const r = zSteps(ctx, s.w); phiStep(ctx, r.X);
      return { s, d, answers: [{ sym: 'Z', value: s.Z, unit: 'Ω' }, { sym: 'φ', value: s.phi, unit: '°' }],
        text: 'חשבו את עכבת המעגל Z ואת הפרש המופע φ בין מתח המקור לזרם.' };
    },
    I(rng, type, o, ctx) {
      const s = forwardState(rng, type, o); if (!s) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      d.current = { value: null, meter: o.meters };
      const r = zSteps(ctx, s.w); iStep(ctx, r.Z);
      return { s, d, answers: [{ sym: 'I', value: s.I, unit: 'A' }], text: 'חשבו את הזרם I במעגל.' };
    },
    UX(rng, type, o, ctx, t) {
      const s = forwardState(rng, type, o); if (!s) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      const sym = `${o.u}_${t}`, val = s['U' + t];
      comp(d, t).extras.push({ sym, value: null, unit: 'V', meter: o.meters, q: 'U' + t });
      const r = zSteps(ctx, s.w); iStep(ctx, r.Z);
      S(ctx, `חוק אוהם על ${COMP_NAME[t]}`, sym, `I·${xSym(t)}`, `${fmt(s.I, 'A')}·${fmt(xVal(s, t), 'Ω')}`, val, 'V');
      return { s, d, answers: [{ sym, value: val, unit: 'V' }], text: `חשבו את המתח ${sym} על ${COMP_NAME[t]}.` };
    },
    U_parts(rng, type, o, ctx) {
      const s = newState(rng, type, o), has = t => COMPS[type].includes(t);
      const I = rng.pick(VALUES.I), V = { R: rng.pick(VALUES.VX), L: rng.pick(VALUES.VX), C: rng.pick(VALUES.VX) };
      s.R = V.R / I;
      if (has('L')) s.L = V.L / I / s.w;
      if (has('C')) s.C = 1 / (s.w * V.C / I);
      s.U = Math.hypot(V.R, (has('L') ? V.L : 0) - (has('C') ? V.C : 0));
      solveState(s); if (!valid(s)) return null;
      ctx.s = s; const d = dispFor(s), u = o.u;
      d.comps.forEach(c => { c.value = undefined; c.extras.push({ sym: `${u}_${c.t}`, value: V[c.t], unit: 'V', meter: o.meters, q: 'U' + c.t }); });
      srcLines(d, s, o, 'ask');
      const f = type === 'RL' ? `√(${u}_R² + ${u}_L²)` : type === 'RC' ? `√(${u}_R² + ${u}_C²)` : `√(${u}_R² + (${u}_L − ${u}_C)²)`;
      const sub = type === 'RL' ? `√((${fmt(V.R, 'V')})² + (${fmt(V.L, 'V')})²)` : type === 'RC' ? `√((${fmt(V.R, 'V')})² + (${fmt(V.C, 'V')})²)`
        : `√((${fmt(V.R, 'V')})² + (${fmt(V.L, 'V')} − ${fmt(V.C, 'V')})²)`;
      S(ctx, 'משולש המתחים: המתחים על הרכיבים לא מתחברים כמו מספרים רגילים', u, f, sub, s.U, 'V');
      return { s, d, answers: [{ sym: u, value: s.U, unit: 'V' }], text: `חשבו את מתח המקור ${u}.` };
    },
    LC_from_X(rng, type, o, ctx, t) {
      const s = newState(rng, type, o);
      s.R = rng.pick(VALUES.R);
      const X = rng.pick(VALUES.X);
      if (t === 'L') { s.L = X / s.w; if (type === 'RLC') s.C = rng.pick(VALUES.C); }
      else { s.C = 1 / (s.w * X); if (type === 'RLC') s.L = rng.pick(VALUES.L); }
      pickSource(rng, s, o); solveState(s); if (!valid(s)) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      const c = comp(d, t);
      Object.assign(c, { name: 'X_' + t, value: X, unit: 'Ω', q: 'X' + t });
      c.extras.push({ sym: t, value: null, unit: UNITS[t] });
      wStep(ctx);
      const useF = o.fmode === 'f';
      if (t === 'L') S(ctx, 'מתוך X_L = ωL', 'L', useF ? 'X_L / (2π·f)' : 'X_L / ω', `${fmt(X, 'Ω')} / ${useF ? '(' + freqSub(ctx, s.w) + ')' : fmt(s.w, 'rad/s')}`, s.L, 'H');
      else S(ctx, 'מתוך X_C = 1/(ωC)', 'C', useF ? '1 / (2π·f·X_C)' : '1 / (ω·X_C)', `1 / (${freqSub(ctx, s.w)}·${fmt(X, 'Ω')})`, s.C, 'F');
      return { s, d, answers: [{ sym: t, value: t === 'L' ? s.L : s.C, unit: UNITS[t] }],
        text: t === 'L' ? 'חשבו את השראות הסליל L.' : 'חשבו את קיבול הקבל C.' };
    },
    R_from_UR_I(rng, type, o, ctx) {
      const s = newState(rng, type, o); pickSource(rng, s, o);
      const I = rng.pick(VALUES.I), UR = rng.pick(VALUES.VX.filter(v => v < 0.97 * s.U));
      if (!UR) return null;
      s.R = UR / I;
      const Z = s.U / I, X = Math.sqrt(Z * Z - s.R * s.R);
      realizeX(rng, s, X); solveState(s); if (!valid(s)) return null;
      ctx.s = s; const d = dispFor(s), u = o.u; srcLines(d, s, o);
      d.comps.forEach(c => { if (c.t !== 'R') c.value = undefined; });
      Object.assign(comp(d, 'R'), { value: null });
      comp(d, 'R').extras.push({ sym: `${u}_R`, value: UR, unit: 'V', meter: o.meters, q: 'UR' });
      d.current = { value: I, meter: o.meters };
      S(ctx, 'חוק אוהם על הנגד', 'R', `${u}_R / I`, `${fmt(UR, 'V')} / ${fmt(I, 'A')}`, s.R, 'Ω');
      return { s, d, answers: [{ sym: 'R', value: s.R, unit: 'Ω' }], text: 'חשבו את התנגדות הנגד R.' };
    },
    LC_from_UX_I(rng, type, o, ctx, t) {
      const s = newState(rng, type, o);
      const I = rng.pick(VALUES.I), UX = rng.pick(VALUES.VX), X = UX / I;
      s.R = rng.pick(VALUES.R);
      if (t === 'L') { s.L = X / s.w; if (type === 'RLC') s.C = rng.pick(VALUES.C); }
      else { s.C = 1 / (s.w * X); if (type === 'RLC') s.L = rng.pick(VALUES.L); }
      s.U = 1; solveState(s); s.U = I * s.Z; solveState(s);   // מתח המקור נקבע כך שהזרם יהיה I
      if (!valid(s)) return null;
      ctx.s = s; const d = dispFor(s), u = o.u; srcLines(d, s, o, 'hide');
      const c = comp(d, t);
      c.value = null;
      c.extras.push({ sym: `${u}_${t}`, value: UX, unit: 'V', meter: o.meters, q: 'U' + t });
      d.current = { value: I, meter: o.meters };
      S(ctx, `חוק אוהם על ${COMP_NAME[t]}`, 'X_' + t, `${u}_${t} / I`, `${fmt(UX, 'V')} / ${fmt(I, 'A')}`, X, 'Ω');
      const useF = o.fmode === 'f';
      if (t === 'L') S(ctx, 'מתוך X_L = ωL', 'L', useF ? 'X_L / (2π·f)' : 'X_L / ω', `${fmt(X, 'Ω')} / ${useF ? '(' + freqSub(ctx, s.w) + ')' : fmt(s.w, 'rad/s')}`, s.L, 'H');
      else S(ctx, 'מתוך X_C = 1/(ωC)', 'C', useF ? '1 / (2π·f·X_C)' : '1 / (ω·X_C)', `1 / (${freqSub(ctx, s.w)}·${fmt(X, 'Ω')})`, s.C, 'F');
      return { s, d, answers: [{ sym: t, value: t === 'L' ? s.L : s.C, unit: UNITS[t] }],
        text: t === 'L' ? 'חשבו את השראות הסליל L.' : 'חשבו את קיבול הקבל C.' };
    },
    X_from_Z(rng, type, o, ctx) {   // RL או RC בלבד (ב-RLC יש שני פתרונות)
      const t = type === 'RL' ? 'L' : 'C';
      const s = newState(rng, type, o); pickSource(rng, s, o);
      s.R = rng.pick(VALUES.R);
      const UR = rng.pick(VALUES.VX.filter(v => v < 0.97 * s.U));
      if (!UR) return null;
      const I = UR / s.R, Z = s.U / I, X = Math.sqrt(Z * Z - s.R * s.R);
      realizeX(rng, s, X); solveState(s); if (!valid(s)) return null;
      ctx.s = s; const d = dispFor(s), u = o.u; srcLines(d, s, o);
      comp(d, 'R').extras.push({ sym: `${u}_R`, value: UR, unit: 'V', meter: o.meters, q: 'UR' });
      comp(d, t).value = null;
      S(ctx, 'חוק אוהם על הנגד', 'I', `${u}_R / R`, `${fmt(UR, 'V')} / ${fmt(s.R, 'Ω')}`, I, 'A');
      uStep(ctx);
      S(ctx, 'חוק אוהם על כל המעגל', 'Z', `${u} / I`, `${fmt(s.U, 'V')} / ${fmt(I, 'A')}`, Z, 'Ω');
      S(ctx, 'מתוך Z² = R² + X²', 'X_' + t, '√(Z² − R²)', `√((${fmt(Z, 'Ω')})² − (${fmt(s.R, 'Ω')})²)`, X, 'Ω');
      wStep(ctx);
      const useF = o.fmode === 'f';
      if (t === 'L') S(ctx, 'מתוך X_L = ωL', 'L', useF ? 'X_L / (2π·f)' : 'X_L / ω', `${fmt(X, 'Ω')} / ${useF ? '(' + freqSub(ctx, s.w) + ')' : fmt(s.w, 'rad/s')}`, s.L, 'H');
      else S(ctx, 'מתוך X_C = 1/(ωC)', 'C', useF ? '1 / (2π·f·X_C)' : '1 / (ω·X_C)', `1 / (${freqSub(ctx, s.w)}·${fmt(X, 'Ω')})`, s.C, 'F');
      return { s, d, answers: [{ sym: t, value: t === 'L' ? s.L : s.C, unit: UNITS[t] }],
        text: t === 'L' ? 'חשבו את השראות הסליל L.' : 'חשבו את קיבול הקבל C.' };
    },
    I_after_fk(rng, type, o, ctx) {
      const s = forwardState(rng, type, o); if (!s) return null;
      const k = rng.pick(VALUES.K), s2 = solveState(Object.assign({}, s, { w: s.w * k, Um: null }));
      if (!valid(s2)) return null;
      ctx.s = s; const d = dispFor(s); srcLines(d, s, o);
      const useF = o.fmode === 'f', kk = k < 1 ? 1 / k : k;
      if (useF) S(ctx, 'התדירות החדשה', 'f′', k < 1 ? `f / ${kk}` : `${k}·f`, k < 1 ? `${fmt(s.f, 'Hz')} / ${kk}` : `${k}·${fmt(s.f, 'Hz')}`, s2.f, 'Hz');
      else S(ctx, 'המהירות הזוויתית החדשה', 'ω′', k < 1 ? `ω / ${kk}` : `${k}·ω`, k < 1 ? `${fmt(s.w, 'rad/s')} / ${kk}` : `${k}·${fmt(s.w, 'rad/s')}`, s2.w, 'rad/s');
      const r = zSteps(ctx, s2.w, '′'); iStep(ctx, r.Z, '′');
      const what = useF ? 'תדירות המקור' : 'המהירות הזוויתית של המקור';
      const change = k < 1 ? `מקטינים את ${what} פי ${kk}` : `מגדילים את ${what} פי ${k}`;
      return { s, d, k, answers: [{ sym: 'I′', value: s2.I, unit: 'A' }], text: `${change}. חשבו את הזרם I′ במעגל אחרי השינוי.` };
    },
  };

  // ---------------- Kinds & levels ----------------
  // needs: רכיב שחייב להיות במעגל ('X1' = RL או RC בלבד). ut: מקור כביטוי u(t). meter: אפשר להציג מכשירי מדידה
  const KINDS = [
    { kind: 'XL', lv: 1, needs: 'L' }, { kind: 'XC', lv: 1, needs: 'C' },
    { kind: 'w_from_f', lv: 1, fmode: 'f' }, { kind: 'f_from_w', lv: 1, fmode: 'w' }, { kind: 'T', lv: 1 },
    { kind: 'Zphi', lv: 2 },
    { kind: 'I', lv: 3, meter: true }, { kind: 'UR', lv: 3, base: 'UX', t: 'R', meter: true },
    { kind: 'UL', lv: 3, base: 'UX', t: 'L', needs: 'L', meter: true }, { kind: 'UC', lv: 3, base: 'UX', t: 'C', needs: 'C', meter: true },
    { kind: 'U_parts', lv: 3, meter: true },
    { kind: 'I_ut', lv: 4, base: 'I', ut: 'always', meter: true }, { kind: 'UR_ut', lv: 4, base: 'UX', t: 'R', ut: 'always', meter: true },
    { kind: 'UL_ut', lv: 4, base: 'UX', t: 'L', needs: 'L', ut: 'always', meter: true },
    { kind: 'UC_ut', lv: 4, base: 'UX', t: 'C', needs: 'C', ut: 'always', meter: true },
    { kind: 'U_from_ut', lv: 4, ut: 'always' }, { kind: 'f_from_ut', lv: 4, base: 'f_from_w', ut: 'always' },
    { kind: 'T_from_ut', lv: 4, base: 'T', ut: 'always' },
    { kind: 'L_from_XL', lv: 5, base: 'LC_from_X', t: 'L', needs: 'L', ut: 'maybe' },
    { kind: 'C_from_XC', lv: 5, base: 'LC_from_X', t: 'C', needs: 'C', ut: 'maybe' },
    { kind: 'R_from_UR_I', lv: 5, ut: 'maybe', meter: true },
    { kind: 'L_from_UL_I', lv: 5, base: 'LC_from_UX_I', t: 'L', needs: 'L', meter: true },
    { kind: 'C_from_UC_I', lv: 5, base: 'LC_from_UX_I', t: 'C', needs: 'C', meter: true },
    { kind: 'X_from_Z', lv: 5, needs: 'X1', ut: 'maybe', meter: true },
    { kind: 'I_after_fk', lv: 5 },
  ];
  const fits = (k, type) => !k.needs || (k.needs === 'X1' ? type !== 'RLC' : COMPS[type].includes(k.needs));
  const CURRENT_LEVEL_SHARE = 0.6;   // שאר השאלות מרמות נמוכות יותר
  const METER_SHARE = 1 / 3;
  function kindOptions(rng, k, level) {
    const ut = k.ut === 'always' || (k.ut === 'maybe' && level >= 4 && rng.next() < 0.5);
    const o = { u: rng.next() < 0.5 ? 'U' : 'V', src: ut ? (rng.next() < 0.5 ? 'ut2' : 'utn') : 'U',
                meters: !!k.meter && rng.next() < METER_SHARE };
    o.fmode = ut ? 'w' : k.fmode || (rng.next() < 0.7 ? 'f' : 'w');
    return o;
  }
  function levelChoices(level, correct, attempt, min) {
    const out = [];
    if (correct) {
      const up = level < MAX_LEVEL;
      if (up) out.push({ level: level + 1, primary: attempt < MAX_ATTEMPTS });
      out.push({ level, primary: !up || attempt >= MAX_ATTEMPTS });
    } else {
      out.push({ level, primary: true });
      if (level > min) out.push({ level: level - 1, primary: false });
    }
    return out;
  }

  // opts: { level, types:['RL','RC','RLC'], prevKind?, seed?, kind?, type? }
  function makeExercise(opts) {
    const seed = opts.seed != null ? opts.seed >>> 0 : randomSeed();
    const rng = makeRng(seed);
    const level = opts.level, type = opts.type || rng.pick(opts.types);
    let k;
    if (opts.kind) k = KINDS.find(x => x.kind === opts.kind);
    else {
      // רמה נוכחית ב-60%; אחרת רמה נמוכה יותר (כל רמה בסיכוי שווה), ובתוכה סוג שאלה
      const lv = level === 1 || rng.next() < CURRENT_LEVEL_SHARE ? level : rng.int(1, level - 1);
      let pool = KINDS.filter(x => x.lv === lv && fits(x, type));
      if (opts.prevKind && pool.length > 1) pool = pool.filter(x => x.kind !== opts.prevKind);
      k = rng.pick(pool);
    }
    const requestedKind = k.kind;
    let tries = 0, r = null, o, ctx;
    for (const kk of [k, KINDS.find(x => x.kind === 'I')]) {
      for (let t = 0; t < MAX_TRIES && !r; t++) {
        tries++;
        o = kindOptions(rng, kk, level);
        ctx = { steps: [], o };
        r = B[kk.base || kk.kind](rng, type, o, ctx, kk.t);
      }
      if (r) { k = kk; break; }
    }
    // מספור מדי המתח לפי סדר הציור
    let vm = 0;
    r.d.comps.forEach(c => c.extras.forEach(e => { if (e.meter) e.meterName = 'V_' + (++vm); }));
    return {
      version: VERSION, seed, level, ctype: type, kind: k.kind, requestedKind, fallback: k.kind !== requestedKind, tries,
      u: o.u, src: o.src, fmode: o.fmode, meters: o.meters, k: r.k,
      state: r.s, disp: r.d, answers: r.answers, text: r.text, steps: ctx.steps,
    };
  }
  function givensList(ex) {
    const out = [], d = ex.disp;
    d.src.forEach(x => {
      if (x.text) out.push({ sym: x.sym, text: x.text, q: 'ut' });
      else if (typeof x.value === 'number') out.push({ sym: x.sym, text: fmt(x.value, x.unit), q: x.q });
    });
    d.comps.forEach(c => {
      if (typeof c.value === 'number') out.push({ sym: c.name, text: fmt(c.value, c.unit), q: c.q });
      c.extras.forEach(e => { if (typeof e.value === 'number') out.push({ sym: e.meter ? e.meterName : e.sym, text: fmt(e.value, e.unit), q: e.q }); });
    });
    if (d.current && typeof d.current.value === 'number') out.push({ sym: 'I', text: fmt(d.current.value, 'A'), q: 'I' });
    return out;
  }

  // ---------------- Draw (SVG) ----------------
  // פריסה קבועה: הרכיבים בקו העליון, המקור במרכז הקו התחתון ונתוניו מתחתיו,
  // מד זרם (או חץ זרם) בצד שמאל, ומד מתח מעל כל רכיב שמודדים עליו.
  const D = { CW: 132, M: 16, LEFT: 112, PAD: 40, LINE: 20, CH: 7.8, VM_Y: 62, VM_R: 14 };
  const rd = x => Math.round(x * 10) / 10;
  const ln = (x1, y1, x2, y2) => `<line x1="${rd(x1)}" y1="${rd(y1)}" x2="${rd(x2)}" y2="${rd(y2)}"/>`;
  const dot = (x, y) => `<circle class="ckt-fill" cx="${rd(x)}" cy="${rd(y)}" r="3.5"/>`;
  function svgSym(sym) {   // X_L -> X עם L בכתב תחתון
    const i = sym.indexOf('_');
    if (i < 0) return sym;
    const m = /^([^_]*)_([0-9A-Za-z]+)(.*)$/.exec(sym);
    return `${m[1]}<tspan dy="4" font-size="11">${m[2]}</tspan><tspan dy="-4">${m[3]}</tspan>`;
  }
  const q = '<tspan class="ckt-q">?</tspan>';
  function text(x, y, inner, anchor, extra) {
    return `<text x="${rd(x)}" y="${rd(y)}" text-anchor="${anchor || 'middle'}"${extra || ''}>${inner}</text>`;
  }
  const lineLabel = (sym, val) => (sym ? `${svgSym(sym)}<tspan> = </tspan>` : '') + (val == null ? q : val);
  const plain = (sym, val) => (sym ? sym.replace('_', '') + ' = ' : '') + (val == null ? '?' : val);

  function drawComp(c, x, y, o, boxes) {
    const cx = x + D.CW / 2, unknown = c.value === null;
    let symW;
    if (c.t === 'R') {
      symW = 50;
      const a = cx - 25, pts = [[a, y]];
      for (let i = 0; i < 6; i++) pts.push([a + 50 * (2 * i + 1) / 12, y + (i % 2 ? 8 : -8)]);
      pts.push([a + 50, y]);
      o.push(`<polyline${unknown ? ' class="ckt-unk"' : ''} points="${pts.map(p => rd(p[0]) + ',' + rd(p[1])).join(' ')}"/>`);
    } else if (c.t === 'L') {
      symW = 48;
      o.push(`<path${unknown ? ' class="ckt-unk"' : ''} d="M${rd(cx - 24)},${rd(y)} a6,6 0 0 1 12,0 a6,6 0 0 1 12,0 a6,6 0 0 1 12,0 a6,6 0 0 1 12,0"/>`);
    } else {
      symW = 10;
      o.push(`<line${unknown ? ' class="ckt-unk"' : ''} x1="${rd(cx - 5)}" y1="${rd(y - 14)}" x2="${rd(cx - 5)}" y2="${rd(y + 14)}"/>`);
      o.push(`<line${unknown ? ' class="ckt-unk"' : ''} x1="${rd(cx + 5)}" y1="${rd(y - 14)}" x2="${rd(cx + 5)}" y2="${rd(y + 14)}"/>`);
    }
    o.push(ln(x, y, cx - symW / 2, y), ln(cx + symW / 2, y, x + D.CW, y));
    // שם מעל, ערך ותוויות מתחת
    o.push(text(cx, y - 18, svgSym(c.name)));
    const lines = [];
    if (c.value !== undefined) lines.push({ sym: null, val: c.value === null ? null : fmt(c.value, c.unit) });
    c.extras.filter(e => !e.meter).forEach(e => lines.push({ sym: e.sym, val: e.value === null ? null : fmt(e.value, e.unit) }));
    lines.forEach((l, i) => o.push(text(cx, y + 32 + i * D.LINE, lineLabel(l.sym, l.val))));
    // מד מתח מעל הרכיב
    const vm = c.extras.find(e => e.meter);
    if (vm) {
      const xl = x + 8, xr = x + D.CW - 8, ym = y - D.VM_Y, r = D.VM_R;
      o.push(ln(xl, y, xl, ym), ln(xl, ym, cx - r, ym), ln(cx + r, ym, xr, ym), ln(xr, ym, xr, y), dot(xl, y), dot(xr, y));
      o.push(`<circle class="ckt-meter" cx="${rd(cx)}" cy="${rd(ym)}" r="${r}"/>`);
      o.push(text(cx, ym + 5, svgSym(vm.meterName), 'middle', ' font-size="13"'));
      o.push(text(cx, ym - r - 8, vm.value === null ? q : fmt(vm.value, vm.unit)));
    }
    const up = vm ? D.VM_Y + D.VM_R + 26 : 32;
    boxes.push({ t: c.t, x, y: y - up, w: D.CW, h: up + 36 + lines.length * D.LINE,
      labels: [plain(null, c.name)].concat(lines.map(l => plain(l.sym, l.val))) });
  }

  function render(ex) {
    const d = ex.disp, o = [], boxes = [];
    const anyVM = d.comps.some(c => c.extras.some(e => e.meter));
    const nBelow = Math.max(...d.comps.map(c => (c.value !== undefined ? 1 : 0) + c.extras.filter(e => !e.meter).length));
    const yT = D.M + (anyVM ? D.VM_Y + D.VM_R + 26 : 34);
    const xL = D.M + D.LEFT, cx0 = xL + D.PAD, xR = cx0 + d.comps.length * D.CW + D.PAD;
    const yB = yT + Math.max(150, 44 + nBelow * D.LINE + 50);
    const xs = (xL + xR) / 2, rs = 17;

    // לולאה
    o.push(ln(xL, yT, cx0, yT));
    d.comps.forEach((c, i) => drawComp(c, cx0 + i * D.CW, yT, o, boxes));
    o.push(ln(cx0 + d.comps.length * D.CW, yT, xR, yT), ln(xR, yT, xR, yB));
    o.push(ln(xR, yB, xs + rs, yB), ln(xs - rs, yB, xL, yB));

    // צד שמאל: מד זרם, חץ זרם, או חוט
    const ym = (yT + yB) / 2, cur = d.current;
    if (cur && cur.meter) {
      o.push(ln(xL, yT, xL, ym - D.VM_R), ln(xL, ym + D.VM_R, xL, yB));
      o.push(`<circle class="ckt-meter" cx="${xL}" cy="${rd(ym)}" r="${D.VM_R}"/>`);
      o.push(text(xL, ym + 5, 'A', 'middle', ' font-size="13"'));
      o.push(text(xL - D.VM_R - 8, ym + 5, cur.value === null ? q : fmt(cur.value, 'A'), 'end'));
    } else {
      o.push(ln(xL, yT, xL, yB));
      if (cur) {
        o.push(`<path class="ckt-fill" d="M${xL},${rd(ym - 6)} l-5,10 h10 z"/>`);
        o.push(text(xL - 12, ym + 5, lineLabel('I', cur.value === null ? null : fmt(cur.value, 'A')), 'end'));
      }
    }

    // מקור: עיגול עם ~
    o.push(`<circle class="ckt-meter" cx="${rd(xs)}" cy="${rd(yB)}" r="${rs}"/>`);
    o.push(`<path d="M${rd(xs - 9)},${rd(yB)} q4.5,-9 9,0 t9,0"/>`);
    const lines = d.src.map(x => (x.text ? { sym: x.sym, val: x.text } : { sym: x.sym, val: x.value === null ? null : fmt(x.value, x.unit) }))
      .concat(d.bottom.map(x => ({ sym: x.sym, val: null })));
    lines.forEach((l, i) => o.push(text(xs, yB + rs + 24 + i * D.LINE, lineLabel(l.sym, l.val))));
    const srcW = Math.max(0, ...lines.map(l => plain(l.sym, l.val).length * D.CH));

    const W = Math.max(xR + D.M, xs + srcW / 2 + D.M);
    const H = yB + rs + 24 + Math.max(0, lines.length - 1) * D.LINE + 10 + D.M;
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" class="ckt" viewBox="0 0 ${rd(W)} ${rd(H)}" width="${rd(W)}" height="${rd(H)}" ` +
      `direction="ltr" font-family="Arial, Helvetica, sans-serif" font-size="14" role="img" aria-label="שרטוט המעגל">` +
      `<style>.ckt line,.ckt polyline,.ckt path{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}` +
      `.ckt .ckt-unk{stroke:#d9480f;stroke-width:2.6}.ckt text{fill:#1f2937}.ckt .ckt-q{fill:#d9480f;font-weight:bold}` +
      `.ckt .ckt-fill{fill:#1f2937;stroke:none}.ckt .ckt-meter{fill:#fff;stroke:#1f2937;stroke-width:2}</style>` +
      `<rect width="100%" height="100%" fill="#fff"/>` + o.join('') + `</svg>`;
    return { svg, width: W, height: H, boxes, srcLines: lines.map(l => plain(l.sym, l.val)) };
  }

  global.Engine = {
    VERSION, MAX_LEVEL, MAX_ATTEMPTS, TOL, ANG_TOL, MAX_TRIES, VALUES, TYPE_NAMES, COMPS, KINDS,
    makeRng, randomSeed, Units, fmt, solveState, valid, makeExercise, givensList, levelChoices,
    minLevel: () => 1, Draw: { render, D },
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<!-- ======================= ממשק ======================= -->
<script>
(function () {
  'use strict';
  const E = window.Engine;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // סמלים בכתיב X_sub ← HTML עם כתב תחתון, מבודד משמאל לימין
  const symHtml = s => s.replace(/\b([A-Za-z])_([0-9A-Za-z]+)/g, '<bdi dir="ltr">$1<sub>$2</sub></bdi>');
  const PREFIX_OPTS = [['1', '(ללא)'], ['1000000', 'M'], ['1000', 'k'], ['0.001', 'm'], ['0.000001', 'µ'], ['1e-9', 'n']];

  const st = { settings: null, level: 1, ex: null, failed: 0, finished: false, prevKind: null };

  $('ver').textContent = E.VERSION;
  $('ver2').textContent = E.VERSION;

  // ---------- הגדרות ----------
  const readSettings = () => ({ types: ['RL', 'RC', 'RLC'].filter(t => $('t' + t).checked), level: +$('level').value });
  function syncSettings() {
    const s = readSettings();
    $('setNote').textContent = s.types.length ? '' : 'יש לבחור לפחות סוג מעגל אחד.';
    $('start').disabled = !s.types.length;
  }
  ['tRL', 'tRC', 'tRLC'].forEach(id => $(id).addEventListener('change', syncSettings));
  syncSettings();

  $('start').addEventListener('click', () => {
    st.settings = readSettings();
    st.level = st.settings.level;
    st.prevKind = null;
    $('setup').hidden = true;
    $('play').hidden = false;
    newExercise();
  });
  $('back').addEventListener('click', () => {
    $('play').hidden = true;
    $('setup').hidden = false;
    window.scrollTo(0, 0);
  });

  // ---------- תרגיל ----------
  function newExercise() {
    st.ex = E.makeExercise({ level: st.level, types: st.settings.types, prevKind: st.prevKind });
    st.prevKind = st.ex.kind;
    st.failed = 0;
    st.finished = false;
    renderExercise();
  }
  function renderExercise() {
    const ex = st.ex;
    $('lvl').textContent = `רמה ${ex.level}`;
    $('ctype').innerHTML = `מעגל <bdi dir="ltr">${esc(E.TYPE_NAMES[ex.ctype])}</bdi> טורי`;
    $('qtext').innerHTML = symHtml(esc(ex.text));
    const r = E.Draw.render(ex);
    $('circuit').innerHTML = r.svg;
    const svg = $('circuit').querySelector('svg');
    svg.style.maxWidth = Math.round(r.width * 1.15) + 'px';
    svg.style.minWidth = Math.round(r.width * 0.78) + 'px';

    const g = E.givensList(ex).map(x => `<span class="chip" dir="ltr">${symHtml(esc(x.sym))} = ${esc(x.text)}</span>`);
    $('givens').innerHTML = '<span class="muted">נתונים:</span> ' + g.join(' ');
    $('unknown').innerHTML = '<span class="muted">נעלם:</span> ' +
      ex.answers.map(a => `<span class="chip unk" dir="ltr">${symHtml(esc(a.sym))} = ?</span>`).join(' ');

    $('ansRows').innerHTML = ex.answers.map((a, i) => {
      const pre = a.unit === '°' ? '' :
        `<select data-i="${i}" class="pre" aria-label="תחילית">${PREFIX_OPTS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
      return `<span class="ansbox" dir="ltr"><span class="usym">${symHtml(esc(a.sym))}</span> =
        <input data-i="${i}" class="val" type="text" inputmode="${a.unit === '°' ? 'text' : 'decimal'}" dir="ltr" spellcheck="false">
        ${pre}<span>${esc(a.unit)}</span></span>`;
    }).join('');
    $('checkBtn').disabled = false;
    setFeedback('', '');
    $('solution').hidden = true;
    $('showSol').hidden = true;
    $('showSol').textContent = 'הצג פתרון מלא';
    $('steps').innerHTML = ex.steps.map(stepHtml).join('');
    $('next').hidden = false;
    $('choices').hidden = true;
    $('seed').textContent = '#' + ex.seed;
    updateTries();
  }
  function stepHtml(step) {
    const parts = [step.lhs, step.formula, step.subst].filter(Boolean).map(p => symHtml(esc(p)));
    return `<li><div class="sn">${esc(step.note)}</div><div class="eq" dir="ltr">${parts.join(' = ')} = ${esc(E.fmt(step.value, step.unit))}</div></li>`;
  }
  function updateTries() {
    $('tries').textContent = st.finished ? '' : `ניסיון ${st.failed + 1} מתוך ${E.MAX_ATTEMPTS}`;
  }
  function setFeedback(cls, html) {
    $('feedback').className = 'fb ' + cls;
    $('feedback').innerHTML = html;
  }
  const answerText = () => st.ex.answers.map(a =>
    `<bdi dir="ltr">${symHtml(esc(a.sym))} = ${esc(E.Units.formatAnswer(a.value, a.unit))}</bdi>`).join(', ');
  function finish(correct, attempt) {
    st.finished = true;
    document.querySelectorAll('#ansRows input, #ansRows select').forEach(el => (el.disabled = true));
    $('checkBtn').disabled = true;
    const opts = E.levelChoices(st.level, correct, attempt, E.minLevel());
    const label = n => (opts.length === 1 ? 'לתרגיל הבא'
      : n > st.level ? `לעלות לרמה ${n}` : n < st.level ? `לרדת לרמה ${n}` : `להישאר ברמה ${n}`);
    $('choices').innerHTML = opts.map(o =>
      `<button type="button" data-level="${o.level}"${o.primary ? ' class="primary"' : ''}>${label(o.level)}</button>`).join('');
    $('choices').hidden = false;
    $('next').hidden = true;
    updateTries();
  }
  $('choices').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-level]');
    if (!b) return;
    st.level = +b.dataset.level;
    newExercise();
  });

  $('ansForm').addEventListener('submit', ev => {
    ev.preventDefault();
    if (st.finished) return;
    const ex = st.ex;
    const vals = ex.answers.map((a, i) => {
      const n = E.Units.parseNumber(document.querySelector(`#ansRows input[data-i="${i}"]`).value, a.unit === '°');
      const pre = document.querySelector(`#ansRows select[data-i="${i}"]`);
      return n * (pre ? +pre.value : 1);
    });
    if (vals.some(isNaN)) {
      setFeedback('warn', 'נא להקליד מספר בכל שדה (אפשר נקודה או פסיק עשרוני; בזווית אפשר גם מינוס). הניסיון לא נספר.');
      return;
    }
    const ok = ex.answers.map((a, i) => E.Units.check(vals[i], a.value, a.unit));
    const attempt = st.failed + 1;
    if (ok.every(Boolean)) {
      let msg = `נכון! ${answerText()}. `;
      if (st.level >= E.MAX_LEVEL) msg += 'זו הרמה הגבוהה ביותר.';
      else if (attempt >= E.MAX_ATTEMPTS) msg += 'הצלחתם בניסיון השלישי. אפשר לעלות רמה, או להישאר ולתרגל עוד.';
      else msg += 'אפשר לעלות רמה או להישאר באותה רמה.';
      setFeedback('ok', msg);
      $('showSol').hidden = false;
      finish(true, attempt);
      return;
    }
    st.failed++;
    let detail = '';
    if (ex.answers.length > 1)
      detail = ' ' + ex.answers.map((a, i) => `<bdi dir="ltr">${symHtml(esc(a.sym))}</bdi> ${ok[i] ? 'נכון' : 'לא נכון'}`).join(', ') + '.';
    if (st.failed < E.MAX_ATTEMPTS) {
      const left = E.MAX_ATTEMPTS - st.failed;
      let msg = (left === 1 ? 'לא נכון. נשאר ניסיון אחד.' : `לא נכון. נשארו ${left} ניסיונות.`) + detail;
      if (ex.answers.some((a, i) => !ok[i] && E.Units.prefixHint(vals[i], a.value, a.unit)))
        msg += ' שימו לב ליחידות ולתחיליות: התשובה רחוקה פי 1000 או יותר.';
      if (ex.answers.some((a, i) => !ok[i] && a.unit === '°' && E.Units.check(-vals[i], a.value, a.unit)))
        msg += ' שימו לב לסימן של הזווית.';
      setFeedback('bad', msg);
      updateTries();
    } else {
      setFeedback('bad', `לא נכון.${detail} התשובה הנכונה: ${answerText()}. הנה הפתרון המלא:`);
      $('solution').hidden = false;
      finish(false, attempt);
    }
  });
  $('showSol').addEventListener('click', () => {
    $('solution').hidden = !$('solution').hidden;
    $('showSol').textContent = $('solution').hidden ? 'הצג פתרון מלא' : 'הסתר פתרון';
  });
  $('next').addEventListener('click', newExercise);
})();
</script>
