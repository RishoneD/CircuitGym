<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקות: תרגול מסננים</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 16px; color: #1f2937; background: #f4f6f9; }
  h1 { font-size: 20px; } h2 { font-size: 17px; margin-top: 24px; }
  pre { background: #fff; border: 1px solid #d9dee6; border-radius: 8px; padding: 10px; direction: ltr; text-align: left; white-space: pre-wrap; font-size: 13px; }
  .pass { color: #15803d; font-weight: bold; } .fail { color: #b42318; font-weight: bold; }
  .gal { direction: ltr; display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
  figure { margin: 0; background: #fff; border: 1px solid #d9dee6; border-radius: 8px; padding: 6px; min-width: 0; }
  figcaption { font-size: 12px; color: #6b7280; direction: rtl; text-align: right; }
  figure svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<h1>בדיקות מנוע המסננים וגלריית ציורים</h1>
<p>דורש שרת מקומי. פרמטר <code dir="ltr">?n=40</code> = מספר תרגילים לכל צירוף (סוג מסנן × רמה).</p>
<div id="summary"></div>
<pre id="log"></pre>
<h2>גלריה</h2>
<div id="gallery" class="gal"></div>

<script>
(async function () {
  const lines = [], log = s => lines.push(s);
  await new Promise((res, rej) => { const c = document.createElement('script'); c.src = '../common/core.js'; c.onload = res; c.onerror = rej; document.head.appendChild(c); });
  const html = await (await fetch('index.html', { cache: 'no-store' })).text();
  const sc = document.createElement('script');
  sc.textContent = new DOMParser().parseFromString(html, 'text/html').getElementById('engine').textContent;
  document.head.appendChild(sc);
  const E = window.Engine, U = E.Units;

  let pass = 0, fail = 0;
  const failures = [];
  function ok(cond, msg) { if (cond) pass++; else { fail++; if (failures.length < 40) failures.push(msg); } }
  const rel = (a, b) => Math.abs(a - b) / Math.max(Math.abs(b), 1e-9);
  const MULT = { M: 1e6, k: 1e3, '': 1, m: 1e-3, 'µ': 1e-6, n: 1e-9 };
  function parseShown(str) {
    const m = /^(\d+(?:\.\d+)?) (M|k|m|µ|n)?(Ω|F|H)$/.exec(str);
    if (!m) throw new Error('bad displayed value: ' + str);
    return Number(m[1]) * MULT[m[2] || ''];
  }

  // ---------- פתרון נומרי עצמאי של משוואת המעגל (RK4) ----------
  // RC-LP / RL-LP: dVo/dt = (Vi − Vo)/τ.   RC-HP: Vo = Vi − Vc,  dVc/dt = (Vi − Vc)/τ.   RL-HP: Vo = Vi − VR, dVR/dt = (Vi − VR)/τ.
  // המצב (Vo או המתח על הרכיב השני) רציף במעברים; מתחילים ממצב יציב ברמת המבוא הראשונה.
  function simulate(ft, tau, wave, tq, side) {
    const ts = wave.ts, rk = (x, vin, T) => {
      const n = Math.max(200, Math.ceil(T / tau * 400)), h = T / n, f = y => (vin - y) / tau;
      for (let i = 0; i < n; i++) { const k1 = f(x), k2 = f(x + h * k1 / 2), k3 = f(x + h * k2 / 2), k4 = f(x + h * k3); x += h * (k1 + 2 * k2 + 2 * k3 + k4) / 6; }
      return x;
    };
    let state = wave.v[0], t = -1e9, vin = wave.v[0];
    const out = s => (ft === 'LP' ? s : vin - s);
    if (tq < ts[0] || (side === -1 && tq === ts[0])) return out(state);
    t = ts[0];
    for (let k = 0; k < ts.length; k++) {
      const end = k < ts.length - 1 ? ts[k + 1] : Infinity;
      vin = wave.v[k + 1];
      if (tq < end || (tq === end && side !== -1 && false) || (side === -1 && tq === end)) {
        if (side === -1 && tq === end) { state = rk(state, vin, end - t); return out(state); }
        state = rk(state, vin, tq - t);
        return out(state);
      }
      state = rk(state, vin, end - t);
      t = end;
    }
  }
  const tauFromShown = ex => {
    const g = Object.fromEntries(E.givensList(ex).map(x => [x.sym, parseShown(x.text)]));
    return (ex.circ.fam === 'RC' ? g.R * g.C : g.L / g.R) * 1000;
  };

  // ---------- יחידות ----------
  ok(U.parseNumber('-2.94', true) === -2.94 && isNaN(U.parseNumber('-2.94')), 'signed parse');
  ok(E.fmtC(1e-7) === '0.1 µF' && E.fmtC(2e-6) === '2 µF' && E.fmtR(1e4) === '10 kΩ' && E.fmtL(0.05) === '50 mH', 'component format');
  ok(E.PAIRS.RC.length >= 5 && E.PAIRS.RL.length >= 5, 'enough component pairs ' + E.PAIRS.RC.length + '/' + E.PAIRS.RL.length);
  // מקרה מהשאלה לדוגמה: HP, τ = 1 ms, 0→10 ב-1 ms, 10→−8 ב-2 ms
  {
    const r = E.response({ ts: [1, 2], v: [0, 10, -8] }, 'HP', 1);
    ok(Math.abs(r.plus[1] - (10 * Math.exp(-1) - 18)) < 1e-12, 'sample: jump at 2 ms');
    ok(Math.abs(r.at(3) - (10 * Math.exp(-1) - 18) * Math.exp(-1)) < 1e-12, 'sample: Vo(3 ms)');
  }

  // ---------- גרסה, קישורים ופרקים בדף הנחיתה ----------
  {
    const pages = { landing: '../index.html', ohm: '../ohm/index.html', mesh: '../mesh/index.html', ac: '../ac/index.html', opamp: '../opamp/index.html', filters: 'index.html' }, vers = {};
    for (const [name, path] of Object.entries(pages)) {
      const url = new URL(path, location.href), src = await (await fetch(url, { cache: 'no-store' })).text();
      vers[name] = (/const VERSION = '(v\d+\.\d+)'/.exec(src) || [])[1];
      for (const a of new DOMParser().parseFromString(src, 'text/html').querySelectorAll('a[href]')) {
        const href = a.getAttribute('href');
        ok(!/^(\/|[a-z]+:)/i.test(href), `non-relative link "${href}" on ${name}`);
        const r = await fetch(new URL(href, url), { cache: 'no-store' });
        ok(r.ok, `broken link "${href}" on ${name}`);
      }
      // סמלים, מניפסט ותמונות: קישור יחסי לקובץ שקיים
      const doc = new DOMParser().parseFromString(src, 'text/html');
      const refs = [...doc.querySelectorAll('link[href]')].map(l => l.getAttribute('href'))
        .concat([...doc.querySelectorAll('img[src]')].map(i => i.getAttribute('src')));
      ok(refs.some(h => /favicon\.svg$/.test(h)) && refs.some(h => /manifest\.webmanifest$/.test(h)), `icons on ${name}`);
      for (const href of refs) {
        ok(!/^(\/|[a-z]+:)/i.test(href), `non-relative resource "${href}" on ${name}`);
        ok((await fetch(new URL(href, url), { cache: 'no-store' })).ok, `missing resource "${href}" on ${name}`);
      }
      // תמונת התצוגה המקדימה חייבת כתובת מלאה (חריג מכוון): בודקים שהקובץ קיים כאן באותו נתיב
      const og = doc.querySelector('meta[property="og:image"]')?.getAttribute('content') || '';
      const BASE = 'https://rishoned.github.io/CircuitGym/';
      ok(og.startsWith(BASE), `og:image on ${name}`);
      ok((await fetch(new URL('../' + og.slice(BASE.length), location.href), { cache: 'no-store' })).ok, `og:image file on ${name}`);
    }
    {
      const man = await (await fetch('../manifest.webmanifest', { cache: 'no-store' })).json();
      ok(man.icons.length >= 3 && man.icons.some(i => i.purpose === 'maskable'), 'manifest icons');
      for (const ic of man.icons) ok((await fetch(new URL('../' + ic.src, location.href), { cache: 'no-store' })).ok, `manifest icon ${ic.src}`);
    }
    log('versions: ' + JSON.stringify(vers));
    ok(new Set(Object.values(vers)).size === 1 && vers.filters === E.VERSION, 'site versions match');
    const land = new DOMParser().parseFromString(await (await fetch('../index.html', { cache: 'no-store' })).text(), 'text/html');
    const chapters = [...land.querySelectorAll('h2.chapter')].map(h => h.textContent.trim() + ': ' +
      [...h.nextElementSibling.querySelectorAll('a.card')].map(a => a.getAttribute('href').split('/')[0]).join(','));
    log('landing: ' + chapters.join(' | '));
    ok(chapters.join(' | ') === 'חשמל: ohm,mesh,ac | אלקטרוניקה: opamp,filters', 'landing chapters');
  }

  // ---------- ריצה המונית ----------
  const N = +(new URLSearchParams(location.search).get('n') || 40);
  const typeSets = [['RC-LP'], ['RC-HP'], ['RL-LP'], ['RL-HP'], ['RC-LP', 'RC-HP', 'RL-LP', 'RL-HP']];
  const stats = { parts: {}, lv: {}, rev: 0, edge: 0, plain: 0, options: {} };
  let total = 0;
  const t0 = performance.now();
  for (const types of typeSets) for (let level = 1; level <= 4; level++) for (let i = 0; i < N; i++) {
    const seed = (total * 2654435761 + 9) >>> 0;
    let ex;
    try { ex = E.makeExercise({ level, types, seed }); } catch (e) { ok(false, `makeExercise threw ${e.message} (seed ${seed})`); total++; continue; }
    total++;
    const tag = `(seed ${seed}, L${level}/${ex.lv}, ${ex.circ.type})`, c = ex.circ, w = ex.wave;
    (stats.lv[level] = stats.lv[level] || {})[ex.lv] = (stats.lv[level][ex.lv] || 0) + 1;
    ok(ex.lv === level, 'format must match level (no mixing) ' + tag);
    // סוג המסנן: מההגדרות, וברמה 4 רק המשפחה מההגדרות
    if (ex.lv < 4) ok(types.includes(c.type), 'type from settings ' + tag);
    else ok(types.some(t => t.startsWith(c.fam)), 'family from settings ' + tag);
    // נתונים נקיים
    ok(E.TAUS.includes(c.tau) && Math.abs(tauFromShown(ex) - c.tau) < 1e-9, 'tau from displayed values ' + tag);
    ok(w.ts.every(t => Number.isInteger(t)) && w.v.every(v => Number.isInteger(v) && Math.abs(v) <= 10), 'clean waveform ' + tag);
    ok(w.v.every((v, k) => k === 0 || Math.abs(v - w.v[k - 1]) >= 2), 'transitions at least 2 V ' + tag);
    const nT = { 1: [1, 2], 2: [1], 3: [2], 4: [3, 4] }[ex.lv];
    ok(nT.includes(w.ts.length), `transitions ${w.ts.length} for L${ex.lv} ` + tag);
    // מבנה הסעיפים לפי רמה
    const kinds = ex.parts.map(p => p.kind).join(',');
    stats.parts[kinds] = (stats.parts[kinds] || 0) + 1;
    if (ex.lv === 1) ok(kinds === 'graph', 'L1 parts ' + kinds);
    if (ex.lv === 2) ok(/^tau,sketch,vo(,vo)?$/.test(kinds), 'L2 parts ' + kinds);
    if (ex.lv === 3) ok(/^tau,sketch,vo(,vo)?(,rev)?$/.test(kinds), 'L3 parts ' + kinds);
    if (ex.lv === 4) ok(/^type,sketch,vo(,vo)?(,rev)?$/.test(kinds), 'L4 parts ' + kinds);
    for (const p of ex.parts) {
      if (p.kind === 'tau') ok(rel(p.answers[0].value, tauFromShown(ex)) < 1e-9, 'tau answer ' + tag);
      if (p.kind === 'type') ok(p.answers[0].value === c.ft, 'type answer ' + tag);
      if (p.kind === 'vo') {
        const q = p.q, v = p.answers[0].value, sim = simulate(c.ft, tauFromShown(ex), w, q.t, q.side === -1 ? -1 : 1);
        ok(Math.abs(v - sim) < 1e-4 * Math.max(1, Math.abs(v)), `Vo mismatch engine ${v} vs ODE ${sim} at t=${q.t} side ${q.side} ` + tag);
        ok(Math.abs(v) >= E.MIN_VO, 'Vo too small ' + tag);
        ok(q.side === 0 ? !w.ts.includes(q.t) : w.ts.includes(q.t), 'time vs wording ' + tag);
        ok(q.side === 0 ? /בזמן t =/.test(p.text) : q.side === -1 ? /רגע לפני/.test(p.text) : /רגע אחרי/.test(p.text), 'wording ' + tag);
        if (q.side === 0) stats.plain++; else stats.edge++;
      }
      if (p.kind === 'rev') {
        stats.rev++;
        ok(ex.lv >= 3, 'reverse only from level 3 ' + tag);
        const { x, t } = p.rq, tau = tauFromShown(ex);
        const sim = simulate(c.ft, tau, w, t, 1);
        ok(Math.abs(sim - x) < 1e-4 * Math.max(1, Math.abs(x)), `reverse: ODE at t=${t} gives ${sim}, expected ${x} ` + tag);
        // ייחודיות: X מושג פעם אחת בלבד בקטעים הרציפים של הגרף
        let crossings = 0, prev = simulate(c.ft, tau, w, ex.range.t0, 1);
        const step = 0.01;
        for (let tt = ex.range.t0 + step; tt <= ex.range.t1; tt += step) {
          const jump = w.ts.some(tk => tk > tt - step && tk <= tt);
          const cur = simulate(c.ft, tau, w, tt, 1);
          if (!jump && (prev - x) * (cur - x) < 0) crossings++;
          prev = cur;
        }
        ok(crossings === 1, `reverse value reached ${crossings} times ` + tag);
      }
      if (p.kind === 'graph') {
        const opts = ex.options, ci = +p.answers[0].value;
        stats.options[opts.length] = (stats.options[opts.length] || 0) + 1;
        ok(opts.length >= 3 && opts.length <= 4 && opts[ci].why === 'correct', 'graph options ' + tag);
        const tau = tauFromShown(ex), scale = Math.max(1, ...w.v.map(Math.abs));
        for (let tt = ex.range.t0; tt <= ex.range.t1; tt += 0.25)
          ok(Math.abs(opts[ci].r.at(tt) - simulate(c.ft, tau, w, tt, 1)) < 1e-4 * scale, 'correct option matches ODE ' + tag);
        // המסיחים שונים מהנכון ומזה מזה
        for (let a = 0; a < opts.length; a++) for (let b = a + 1; b < opts.length; b++) {
          let d = 0;
          for (let tt = ex.range.t0; tt <= ex.range.t1; tt += 0.05) d = Math.max(d, Math.abs(opts[a].r.at(tt) - opts[b].r.at(tt)));
          ok(d >= 0.2 * scale - 1e-9, `options ${opts[a].why}/${opts[b].why} too similar ` + tag);
        }
      }
    }
    // ציור
    const r = E.Draw.render(ex);
    ok(!/NaN|undefined|Infinity/.test(r.svg), 'bad svg ' + tag);
    ok((r.svg.match(/<polyline class="sig"/g) || []).length === 1 + (ex.options ? ex.options.length : 0), 'graph count ' + tag);
    ok(!/NaN|undefined|Infinity/.test(E.answerGraph(ex)), 'bad answer graph ' + tag);
    {  // הגרף לבדיקה עצמית לא מציג ערכים של סעיפי מתח המוצא שאחריו
      const si = ex.parts.findIndex(p => p.kind === 'sketch');
      if (si >= 0) {
        const labels = (E.answerGraph(ex, si).match(/class="lbl">([^<]*)</g) || []).map(m => m.replace(/.*>/, '').replace('<', ''));
        const later = ex.parts.slice(si + 1).filter(p => p.kind === 'vo' || p.kind === 'rev').map(p => p.kind === 'vo' ? p.answers[0].value : p.rq.x);
        ok(!labels.length || later.every(v => !labels.includes(String(Math.round(v * 100) / 100))), 'answer graph reveals a later answer ' + tag);
        ok(labels.length === 0, 'answer graph shows values before they were asked ' + tag);
      }
      if (c.ft === 'LP') {   // ב-LP לא שואלים גם "רגע לפני" וגם "רגע אחרי" אותו מעבר (אותו ערך)
        const ts = ex.parts.filter(p => p.kind === 'vo' && p.q.side !== 0).map(p => p.q.t);
        ok(new Set(ts).size === ts.length, 'LP asks both sides of one transition ' + tag);
      }
      // הפתרון של סעיף לא מציג את תשובת סעיף מאוחר יותר
      ex.parts.forEach((p, pi) => {
        if (p.kind !== 'vo') return;
        const txt = E.solutionHtml(ex, pi);
        ex.parts.slice(pi + 1).filter(q => q.kind === 'vo' && Math.abs(q.answers[0].value - p.answers[0].value) > 0.006).forEach(q => {
          const v = q.answers[0].value, s2 = String(Math.round(v * 100) / 100);
          // רק ערכי V_o שמוצגים בפתרון (לא קפיצות המבוא, שהן נתון)
          const vos = [...txt.matchAll(/V<sub>o<\/sub><\/bdi>\([^)]*\)(?: = [^=,<]*)* = (-?[\d.]+) V/g)].map(m => m[1]);
          if (pi === 0 || !vos.length) stats.vosEmpty = (stats.vosEmpty || 0) + (vos.length ? 0 : 1);
          ok(!vos.includes(s2), `solution of part ${pi + 1} reveals later answer ${s2} V ` + tag);
        });
      });
    }
    ex.parts.forEach((p, pi) => ok(!/undefined|NaN/.test(E.solutionHtml(ex, pi)), 'bad solution ' + tag));
  }
  log(`exercises: ${total}   time: ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  log('level -> format: ' + JSON.stringify(stats.lv));
  log('parts: ' + JSON.stringify(stats.parts));
  log(`Vo questions: plain ${stats.plain}, before/after ${stats.edge}; reverse ${stats.rev}; L1 options ${JSON.stringify(stats.options)}`);
  if (failures.length) log('\nFAILURES (first 40):\n' + failures.join('\n'));
  document.getElementById('log').textContent = lines.join('\n');
  document.getElementById('summary').innerHTML =
    `<p class="${fail ? 'fail' : 'pass'}">${fail ? 'נכשל' : 'עבר'}: <bdi dir="ltr">${pass} passed, ${fail} failed</bdi></p>`;
  window.TEST_RESULT = { pass, fail, total, failures, text: lines.join('\n') };

  // ---------- גלריה ----------
  const gal = [];
  ['RC-LP', 'RC-HP', 'RL-LP', 'RL-HP'].forEach((t, i) => [1, 2, 3, 4].forEach(lv => {
    const ex = E.makeExercise({ level: lv, lv, types: [t], seed: 500 + i * 10 + lv });
    gal.push(`<figure><figcaption>${ex.circ.type} L${lv} | ${ex.text} | ${ex.parts.map(p => p.text).join(' / ')}</figcaption>${E.Draw.render(ex).svg}${lv > 1 ? E.answerGraph(ex) : ''}</figure>`);
  }));
  document.getElementById('gallery').innerHTML = gal.join('');
})().catch(e => { document.getElementById('log').textContent = 'ERROR: ' + e.stack; window.TEST_RESULT = { error: String(e.stack) }; });
</script>
</body>
</html>
