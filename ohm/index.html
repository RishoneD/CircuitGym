<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תרגול מעגל טורי, מקבילי ומעורב</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --fg: #1f2937; --muted: #6b7280; --line: #d9dee6;
    --accent: #1d4ed8; --accent-soft: #e8efff; --ok: #15803d; --ok-soft: #e7f6ec;
    --bad: #b42318; --bad-soft: #fdecea; --warn: #9a6700; --warn-soft: #fff6db; --unk: #d9480f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 17px; line-height: 1.5; }
  header { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header .ver { font-size: 13px; opacity: .85; }
  header .home { margin-inline-start: auto; color: #fff; font-size: 15px; white-space: nowrap; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  h2 { margin: 0 0 12px; font-size: 19px; }
  h3 { margin: 18px 0 8px; font-size: 17px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 14px; padding: 10px 14px; }
  legend { padding: 0 6px; color: var(--muted); font-size: 15px; }
  .opt { display: inline-flex; align-items: center; gap: 6px; margin-inline-end: 18px; cursor: pointer; }
  .opt input, .switch input { width: 18px; height: 18px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .switch { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; cursor: pointer; }
  select, input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid #b8c0cc; border-radius: 8px; background: #fff; color: var(--fg); }
  button { font: inherit; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--accent);
           background: #fff; color: var(--accent); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.link { border: none; background: none; padding: 4px 0; text-decoration: underline; }
  .note { color: var(--muted); font-size: 15px; min-height: 1.2em; margin: 4px 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 8px; }
  .badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 12px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 15px; }
  .q { font-size: 18px; margin: 6px 0 10px; }
  .circuit { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; }
  .circuit svg { width: 100%; height: auto; display: block; margin: 0 auto; }
  .givens { margin: 10px 0 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { background: #f1f3f6; border-radius: 6px; padding: 1px 8px; font-size: 16px; white-space: nowrap; }
  .chip.unk { background: #fff0e6; color: var(--unk); font-weight: 600; }
  .ans { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 14px 0 8px; }
  .ansbox { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ansbox input { width: 8.5em; }
  .fb { border-radius: 8px; padding: 0; margin: 8px 0; }
  .fb:not(:empty) { padding: 8px 12px; }
  .fb.ok { background: var(--ok-soft); color: var(--ok); }
  .fb.bad { background: var(--bad-soft); color: var(--bad); }
  .fb.warn { background: var(--warn-soft); color: var(--warn); }
  #steps { padding-inline-start: 22px; margin: 0; }
  #steps li { margin-bottom: 10px; }
  #steps .sn { color: var(--muted); font-size: 15px; }
  #steps .eq { font-family: Consolas, "Courier New", monospace; font-size: 16px; text-align: left; overflow-x: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .actions .actions { margin-top: 0; }
  .seed { color: #a0a7b3; font-size: 12px; text-align: left; margin-top: 10px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 16px 24px; }
  bdi[dir=ltr], [dir=ltr] { unicode-bidi: isolate; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>תרגול מעגל טורי, מקבילי ומעורב</h1>
  <span class="ver" dir="ltr" id="ver"></span>
  <a class="home" href="../index.html">→ לדף הראשי</a>
</header>

<main>
  <section id="setup" class="card">
    <h2>הגדרות תרגול</h2>
    <fieldset>
      <legend>סוג מעגל (אפשר לבחור כמה)</legend>
      <label class="opt"><input type="checkbox" id="tS" checked> טורי</label>
      <label class="opt"><input type="checkbox" id="tP" checked> מקבילי</label>
      <label class="opt"><input type="checkbox" id="tM" checked> מעורב</label>
    </fieldset>
    <label class="row">רמת קושי התחלתית:
      <select id="level">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>
    <label class="switch"><input type="checkbox" id="power"> כולל נושא הספק</label>
    <label class="switch"><input type="checkbox" id="prefixes"> כולל תחיליות <bdi dir="ltr">(k, m, µ)</bdi></label>
    <label class="switch"><input type="checkbox" id="meters"> כולל מכשירי מדידה (מד זרם ומד מתח)</label>
    <p id="setNote" class="note"></p>
    <button id="start" class="primary">התחלה</button>
  </section>

  <section id="play" class="card" hidden>
    <div class="bar">
      <span id="lvl" class="badge"></span>
      <span id="ctype" class="muted"></span>
      <span id="tries" class="muted"></span>
    </div>
    <p id="qtext" class="q"></p>
    <div id="circuit" class="circuit" dir="ltr"></div>
    <div id="givens" class="givens"></div>
    <div id="unknown" class="givens"></div>

    <form id="ansForm" class="ans" autocomplete="off">
      <label for="ans">התשובה:</label>
      <span class="ansbox" dir="ltr">
        <span id="ansSym"></span> =
        <input id="ans" type="text" inputmode="decimal" dir="ltr" spellcheck="false">
        <select id="prefix" aria-label="תחילית">
          <option value="1">(ללא)</option>
          <option value="1000000">M</option>
          <option value="1000">k</option>
          <option value="0.001">m</option>
          <option value="0.000001">µ</option>
        </select>
        <span id="unit"></span>
      </span>
      <button type="submit" id="checkBtn" class="primary">בדיקה</button>
    </form>

    <div id="feedback" class="fb" role="status" aria-live="polite"></div>
    <button id="showSol" type="button" class="link" hidden>הצג פתרון מלא</button>
    <div id="solution" hidden>
      <h3>פתרון שלב אחר שלב</h3>
      <ol id="steps"></ol>
    </div>

    <div class="actions">
      <span id="choices" class="actions" hidden></span>
      <button id="next" type="button">תרגיל חדש</button>
      <button id="back" type="button">חזרה להגדרות</button>
    </div>
    <div id="seed" class="seed" dir="ltr"></div>
  </section>
</main>

<footer>נוצר על ידי ראשון דיבקר בעזרת Claude · <span dir="ltr" id="ver2"></span></footer>

<!-- ======================= מנוע (ללא DOM) ======================= -->
<script id="engine">
(function (global) {
  'use strict';

  const VERSION = 'v1.5';
  const MAX_LEVEL = 5;
  const MAX_ATTEMPTS = 3;
  const TOL = 0.01;        // סטייה יחסית מותרת בבדיקת תשובה (1%)
  const MAX_TRIES = 400;
  const METER_SHARE = 0.6;  // חלק התרגילים עם מכשירי מדידה כשהמתג דולק   // הגרלות מעגל עד שכל הנתונים המוצגים "נקיים"

  const VALUES = {
    R_BASE: [10, 15, 22, 33, 47, 68, 100, 150, 220, 330, 470, 680, 1000],
    R_PREFIX: [100, 150, 220, 330, 470, 680, 1000, 1500, 2200, 3300, 4700, 6800, 10000],
    V: [1.5, 3, 4.5, 5, 6, 9, 12, 15, 24],
  };
  const UNIT = { R: 'Ω', V: 'V', I: 'A', P: 'W' };
  const TYPE_NAMES = { S: 'טורי', P: 'מקבילי', M: 'מעורב' };

  const sum = a => a.reduce((s, x) => s + x, 0);

  // ---------------- Rng (mulberry32, seedable) ----------------
  function makeRng(seed) {
    let a = seed >>> 0;
    const next = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const int = (lo, hi) => lo + Math.floor(next() * (hi - lo + 1));
    const pick = arr => arr[Math.floor(next() * arr.length)];
    const shuffle = arr => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = int(0, i); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    return { next, int, pick, shuffle };
  }
  const randomSeed = () => (Math.random() * 4294967296) >>> 0;

  // ---------------- Units ----------------
  const PREFIXES = [
    { p: 'M', f: 1e6 }, { p: 'k', f: 1e3 }, { p: '', f: 1 }, { p: 'm', f: 1e-3 }, { p: 'µ', f: 1e-6 },
  ];
  const roundSig = (x, s) => (x === 0 ? 0 : Number(x.toPrecision(s)));
  function numStr(v) {
    let s = String(v);
    if (/e/i.test(s)) s = v.toFixed(15).replace(/\.?0+$/, '');
    return s;
  }
  function pickPrefix(x) {
    const a = Math.abs(x);
    for (const P of PREFIXES) if (a >= P.f * (1 - 1e-9)) return P;
    return PREFIXES[PREFIXES.length - 1];
  }
  const Units = {
    PREFIXES,
    // הצגת ערך (נתון או שלב ביניים): sig ספרות משמעותיות
    format(x, unit, prefixes, sig = 4) {
      const P = prefixes ? pickPrefix(x) : { p: '', f: 1 };
      return numStr(roundSig(x / P.f, sig)) + ' ' + P.p + unit;
    },
    // הצגת התשובה הנכונה: 2 ספרות אחרי הנקודה ביחידה הטבעית; ערך קטן מ-1: 3 ספרות משמעותיות
    formatAnswer(x, unit, prefixes) {
      const P = prefixes ? pickPrefix(x) : { p: '', f: 1 };
      let v = x / P.f;
      v = Math.abs(v) >= 1 ? Math.round(v * 100) / 100 : roundSig(v, 3);
      return numStr(v) + ' ' + P.p + unit;
    },
    // קלט תלמיד: נקודה או פסיק עשרוני, בלי מפרידי אלפים. מחזיר NaN אם לא תקין
    parseNumber(str) {
      const s = String(str).trim().replace(',', '.');
      if (!/^(\d+(\.\d*)?|\.\d+)$/.test(s)) return NaN;
      return Number(s);
    },
    check(student, correct) {
      return Math.abs(student - correct) <= TOL * Math.abs(correct);
    },
    // האם התשובה נכונה פרט לפקטור של 1000 או מיליון (טעות תחילית/יחידות)
    prefixHint(student, correct) {
      return [1e3, 1e6, 1e-3, 1e-6].some(k => Units.check(student, correct * k));
    },
    // "נקי": ניתן לייצוג מדויק בעד 3 ספרות משמעותיות
    isClean(x) {
      return x > 0 && Math.abs(roundSig(x, 3) - x) <= 1e-9 * x;
    },
  };

  // ---------------- Circuit tree ----------------
  // { type:'R', idx, R }  |  { type:'S'|'P', children:[...] }
  const leaf = () => ({ type: 'R' });

  function randomComposition(rng, n, k) {
    const cuts = new Set();
    while (cuts.size < k - 1) cuts.add(rng.int(1, n - 1));
    const c = [0, ...[...cuts].sort((a, b) => a - b), n];
    const parts = [];
    for (let i = 1; i < c.length; i++) parts.push(c[i] - c[i - 1]);
    return parts;
  }
  // טורי ומקבילי מתחלפים בכל רמת קינון, עומק קבוצות מקסימלי 3
  function buildMixed(rng, n, type, depth) {
    if (n === 1) return leaf();
    if (depth >= 3) return { type, children: Array.from({ length: n }, leaf) };
    const other = type === 'S' ? 'P' : 'S';
    const k = rng.int(2, Math.min(n, 3));
    return { type, children: randomComposition(rng, n, k).map(p => buildMixed(rng, p, other, depth + 1)) };
  }
  // אורך שרשרת הנגדים הטורית הארוכה ביותר (קובע את רוחב הציור)
  const run = nd => (nd.type === 'R' ? 1 : nd.type === 'S' ? sum(nd.children.map(run)) : Math.max(...nd.children.map(run)));
  const branchesOk = nd => nd.type === 'R' || (nd.type === 'P' ? nd.children.every(c => run(c) <= 3) : true) && nd.children.every(branchesOk);
  function buildTree(rng, n, ctype) {
    if (ctype === 'S' || ctype === 'P') return { type: ctype, children: Array.from({ length: n }, leaf) };
    for (;;) {
      const root = buildMixed(rng, n, rng.next() < 0.5 ? 'S' : 'P', 1);
      // מעורב אמיתי, ובלי ענף מקבילי שיש בו יותר מ-3 נגדים בטור (ציור רחב מדי)
      if (root.children.some(c => c.type !== 'R') && branchesOk(root)) return root;
    }
  }
  // מספור לפי סדר הציור; sub = כתב תחתון לשמות (R_23, I_T ...)
  function numberTree(root) {
    let i = 0;
    const leaves = [];
    (function walk(nd, parent) {
      nd.parent = parent;
      if (nd.type === 'R') { nd.idx = ++i; nd.nums = [i]; leaves.push(nd); }
      else { nd.children.forEach(c => walk(c, nd)); nd.nums = [].concat(...nd.children.map(c => c.nums)); }
      nd.sub = nd === root ? 'T' : nd.nums.join('');
    })(root, null);
    return leaves;
  }
  function computeReq(nd) {
    if (nd.type === 'R') return (nd.Req = nd.R);
    const rs = nd.children.map(computeReq);
    return (nd.Req = nd.type === 'S' ? sum(rs) : 1 / sum(rs.map(r => 1 / r)));
  }
  function distribute(nd, I) {
    nd.I = I; nd.V = I * nd.Req; nd.P = nd.V * I;
    if (nd.type === 'S') nd.children.forEach(c => distribute(c, I));
    else if (nd.type === 'P') nd.children.forEach(c => distribute(c, nd.V / c.Req));
  }
  function solve(c) {
    computeReq(c.root);
    distribute(c.root, c.VT / c.root.Req);
    c.IT = c.root.I;
    c.PT = c.VT * c.IT;
    return c;
  }
  function buildCircuit(rng, n, ctype, prefixes) {
    const root = buildTree(rng, n, ctype);
    const leaves = numberTree(root);
    const set = prefixes ? VALUES.R_PREFIX : VALUES.R_BASE;
    leaves.forEach(l => (l.R = rng.pick(set)));
    return solve({ root, leaves, ctype, VT: rng.pick(VALUES.V) });
  }

  // ---------------- Solution steps ----------------
  // step = { note, lhs, formula, subst, value, unit }; סמלים בכתיב X_sub
  function foldSteps(ctx, nd) {
    if (nd.type === 'R') return;
    nd.children.forEach(c => foldSteps(ctx, c));
    const cs = nd.children, f = ctx.f;
    const names = cs.map(c => 'R_' + c.sub), vals = cs.map(c => f(c.Req, 'Ω'));
    let note, formula, subst;
    if (nd.type === 'S') {
      note = 'חיבור טורי: ההתנגדות השקולה היא סכום ההתנגדויות';
      formula = names.join(' + '); subst = vals.join(' + ');
    } else if (cs.length === 2) {
      note = 'חיבור מקבילי של שני ענפים: מכפלה חלקי סכום';
      formula = `${names[0]}·${names[1]} / (${names[0]} + ${names[1]})`;
      subst = `${vals[0]}·${vals[1]} / (${vals[0]} + ${vals[1]})`;
    } else {
      note = 'חיבור מקבילי: ההופכי של השקולה שווה לסכום ההופכיים';
      formula = `1 / (${names.map(x => '1/' + x).join(' + ')})`;
      subst = `1 / (${vals.map(x => '1/' + x).join(' + ')})`;
    }
    ctx.steps.push({ note, lhs: 'R_' + nd.sub, formula, subst, value: nd.Req, unit: 'Ω' });
  }
  function ohmStep(ctx, nd, q) {
    const s = nd.sub, f = ctx.f;
    if (ctx.used) ctx.used.add(nd);
    if (q === 'I') ctx.steps.push({ note: 'חוק אוהם', lhs: 'I_' + s, formula: `V_${s} / R_${s}`,
      subst: `${f(nd.V, 'V')} / ${f(nd.Req, 'Ω')}`, value: nd.I, unit: 'A' });
    else ctx.steps.push({ note: 'חוק אוהם', lhs: 'V_' + s, formula: `I_${s}·R_${s}`,
      subst: `${f(nd.I, 'A')}·${f(nd.Req, 'Ω')}`, value: nd.V, unit: 'V' });
  }
  function sameStep(ctx, from, to, q, groupType) {
    ctx.steps.push({
      note: groupType === 'S' ? 'בחיבור טורי עובר אותו זרם בכל הרכיבים' : 'בחיבור מקבילי יש אותו מתח על כל הענפים',
      lhs: `${q}_${to.sub}`, formula: `${q}_${from.sub}`, subst: '', value: q === 'I' ? to.I : to.V, unit: UNIT[q],
    });
  }
  function powerStep(ctx, nd) {
    const s = nd.sub, f = ctx.f;
    ctx.steps.push({ note: 'הספק', lhs: 'P_' + s, formula: `V_${s}·I_${s}`,
      subst: `${f(nd.V, 'V')}·${f(nd.I, 'A')}`, value: nd.V * nd.I, unit: 'W' });
  }
  function pathTo(nd) { const p = []; for (let n = nd; n; n = n.parent) p.unshift(n); return p; }

  // מהמקור כלפי מטה עד target; בכל צומת מחשבים רק את מה שצריך להמשך
  function walkDown(ctx, target, needs) {
    const path = pathTo(target);
    let known = new Set(['V']);   // בשורש: V_T ידוע
    const ensure = (nd, q) => { if (!known.has(q)) { ohmStep(ctx, nd, q); known.add(q); } };
    for (let i = 0; i < path.length - 1; i++) {
      const p = path[i], ch = path[i + 1], q = p.type === 'S' ? 'I' : 'V';
      ensure(p, q);
      sameStep(ctx, p, ch, q, p.type);
      known = new Set([q]);
    }
    needs.forEach(q => ensure(target, q));
  }
  // מנגד עם נתון ידוע כלפי מעלה עד מתח המקור
  function walkUp(ctx, leafNd, given) {
    let nd = leafNd, known = new Set([given]);
    const ensure = (n, q) => { if (!known.has(q)) { ohmStep(ctx, n, q); known.add(q); } };
    while (nd.parent) {
      const p = nd.parent, q = p.type === 'S' ? 'I' : 'V';
      ensure(nd, q);
      sameStep(ctx, nd, p, q, p.type);
      nd = p;
      known = new Set([q]);
    }
    ensure(nd, 'V');
  }

  // ---------------- Questions ----------------
  function baseAnn(c) {
    const R = {};
    c.leaves.forEach(l => (R[l.idx] = l.R));
    // R[idx]=null => נעלם; VT=null => נעלם; IT: undefined=לא מוצג, null=נעלם; totalLabel: 'R_T'|'P_T'
    return { R, VT: c.VT, IT: undefined, resExtra: {}, totalLabel: undefined };
  }
  const KIND_DEFS = [
    { kind: 'Req', w: 1 }, { kind: 'IT', w: 1 }, { kind: 'Ik', w: 1 }, { kind: 'Vk', w: 1 },
    { kind: 'Pk', w: 1, power: true }, { kind: 'PT', w: 0.6, power: true },
    { kind: 'VT_IT', w: 0.5, inverse: true }, { kind: 'VT_k', w: 0.7, inverse: true },
    { kind: 'Rx_ohm', w: 0.5, inverse: true }, { kind: 'Rx_T', w: 0.8, inverse: true },
  ];
  const FALLBACK = { VT_IT: ['VT_k'], Rx_T: ['Rx_ohm'], Rx_ohm: ['VT_k'] };
  const Q = {
    Req(c, rng, ctx) {
      const a = baseAnn(c); a.totalLabel = 'R_T';
      foldSteps(ctx, c.root);
      return { ann: a, sym: 'R_T', answer: c.root.Req, unit: 'Ω', clean: [],
        text: 'חשבו את ההתנגדות השקולה R_T של המעגל.' };
    },
    IT(c, rng, ctx) {
      const a = baseAnn(c); a.IT = null;
      foldSteps(ctx, c.root); walkDown(ctx, c.root, ['I']);
      return { ann: a, sym: 'I_T', answer: c.root.I, unit: 'A', clean: [],
        text: 'חשבו את הזרם הכולל I_T במעגל.' };
    },
    Ik(c, rng, ctx) {

  function seriesOf(list, ctx, o) {
    if (!list || !list.length) return null;
    const nd = list.length === 1 ? list[0] : { type: 'S', children: list };
    measure(nd, ctx, o);
    return nd;
  }

  // תוכנית פריסה: אילו בלוקים של השורש בקו העליון (H, ימינה), בצד ימין (V, למטה) ובקו התחתון (H, שמאלה)
  function classicPlan(root, ctx) {
    measure(root, ctx, 'H');
    // שורש טורי רחב: מחלקים בין הקו העליון לתחתון כך שהרוחב המקסימלי מינימלי
    if (root.type === 'S' && root.box.w > DR.SPLIT_W) {
      const ws = root.children.map(ch => ch.box.w);
      let best = null;
      for (let m = 1; m < ws.length; m++) {
        const s = Math.max(sum(ws.slice(0, m)), sum(ws.slice(m)));
        if (!best || s < best.s) best = { m, s };
      }
      return { top: root.children.slice(0, best.m), bottom: root.children.slice(best.m) };
    }
    return { top: [root] };
  }
  // כל החלוקות האפשריות עם בלוק אנכי בצד ימין
  function verticalPlans(root) {
    if (root.type === 'P') return [{ right: [root] }];   // מקבילי כסולם: ענפים אנכיים זה לצד זה
    const ch = root.children, k = ch.length, plans = [];
    for (let r = 1; r <= Math.min(2, k - 1); r++)
      for (let t = 1; t <= k - r; t++) plans.push({ top: ch.slice(0, t), right: ch.slice(t, t + r), bottom: ch.slice(t + r) });
    return plans;
  }

  function layout(ex, plan) {
    const ann = ex.ann;
    const ctx = { o: [], boxes: [], ann, meters: !!ex.meters, fmt: (x, u) => Units.format(x, u, ex.prefixes, 4) };
    const o = ctx.o;
    const top = seriesOf(plan.top, ctx, 'H'), right = seriesOf(plan.right, ctx, 'V'), bot = seriesOf(plan.bottom, ctx, 'H');

    const M = DR.M, xL = M + DR.LABEL_W, gapL = ann.IT !== undefined ? 124 : 30, rowX = xL + gapL;
    const tw = top ? top.box.w : 0, bw = bot ? bot.box.w : 0;
    const W = Math.max(tw, bw, right ? 40 : 160);
    const xR = rowX + W + 30 + (right ? right.box.up : 0);
    const yTop = M + Math.max(top ? top.box.up : 0, 30);
    let inner = Math.max((top ? top.box.down : 0) + 26 + (bot ? bot.box.up : 0), 110);
    if (right) inner = Math.max(inner, right.box.w + 40);
    const yBot = yTop + inner;

    // הזרם הכולל: מד זרם על הקו העליון (כשיש מכשירים), אחרת חץ ותווית
    const mainAm = ann.IT !== undefined && ctx.meters, mx = xL + gapL / 2;
    const topWire = (x1, x2) => (mainAm && x1 < mx && mx < x2
      ? o.push(ln(x1, yTop, mx - DR.MR, yTop), ln(mx + DR.MR, yTop, x2, yTop)) : o.push(ln(x1, yTop, x2, yTop)));
    if (top) {
      const tx = rowX + (W - tw) / 2;
      topWire(xL, tx);
      drawNode(top, tx, yTop, 'H', 1, ctx);
      o.push(ln(tx + tw, yTop, xR, yTop));
    } else topWire(xL, xR);
    if (right) {
      const ay = yTop + (inner - right.box.w) / 2;
      o.push(ln(xR, yTop, xR, ay));
      drawNode(right, ay, xR, 'V', 1, ctx);
      o.push(ln(xR, ay + right.box.w, xR, yBot));
    } else o.push(ln(xR, yTop, xR, yBot));
    if (bot) {
      const bx = rowX + (W - bw) / 2;
      o.push(ln(xR, yBot, bx + bw, yBot));
      drawNode(bot, bx, yBot, 'H', -1, ctx);
      o.push(ln(bx, yBot, xL, yBot));
    } else o.push(ln(xR, yBot, xL, yBot));

    // מקור מתח: קו ארוך = +, קו קצר = −
    const yc = (yTop + yBot) / 2;
    o.push(ln(xL, yTop, xL, yc - 6), ln(xL, yc + 6, xL, yBot));
    o.push(`<line class="ckt-plate" x1="${xL - 22}" y1="${rd(yc - 6)}" x2="${xL + 22}" y2="${rd(yc - 6)}"/>`);
    o.push(`<line class="ckt-plate ckt-short" x1="${xL - 11}" y1="${rd(yc + 6)}" x2="${xL + 11}" y2="${rd(yc + 6)}"/>`);
    o.push(`<text x="${xL + 24}" y="${rd(yc - 12)}" font-size="16">+</text>`);
    o.push(`<text x="${xL + 16}" y="${rd(yc + 24)}" font-size="16">−</text>`);
    o.push(svgLabel(xL - 30, yc + 5, 'V_T', ann.VT == null ? null : ctx.fmt(ann.VT, 'V'), 'end'));

    if (mainAm) o.push(meterSvg(mx, yTop, 'A'), reading(mx, yTop - DR.MR - 7, ann.IT == null ? null : ctx.fmt(ann.IT, 'A')));
    else if (ann.IT !== undefined) {
      o.push(arrowH(mx + 8, yTop, 1));
      o.push(svgLabel(mx, yTop - 12, 'I_T', ann.IT == null ? null : ctx.fmt(ann.IT, 'A')));
    }
    let H = yBot + Math.max(bot ? bot.box.down : 0, 8) + M;
    if (ann.totalLabel) {
      const ly = H + 8;
      o.push(svgLabel((xL + xR) / 2, ly, ann.totalLabel, null));
      H = ly + 8 + M;
    }
    const Wt = xR + (right ? right.box.down : 0) + M;
    return { ctx, width: Wt, height: H, split: !!bot, vertical: !!right, mainMeter: mainAm };
  }

  // opts.mode: 'classic' | 'vertical' (לבדיקות). ברירת מחדל: הגרלה מתוך ה-seed,
  // במחולל נפרד, כך שהמעגל, הערכים והתשובה לא משתנים, ואותו תרגיל תמיד מצויר אותו דבר.
  function render(ex, opts) {
    if (opts && opts.meters != null) ex = Object.assign({}, ex, { meters: opts.meters });   // לבדיקות
    const root = ex.circuit.root, mode = opts && opts.mode;
    const rng = makeRng((ex.seed ^ 0x9E3779B9) >>> 0);
    const wantVert = mode ? mode === 'vertical' : rng.next() < DR.P_VERT;
    let lay = null;
    if (wantVert) {
      const all = verticalPlans(root).map(p => layout(ex, p));
      const fit = all.filter(l => l.width <= DR.MAX_W_VERT);
      if (fit.length) lay = rng.pick(fit);
      else if (mode === 'vertical') lay = all.reduce((m, l) => (l.width < m.width ? l : m));   // לבדיקות בלבד
    }
    if (!lay) lay = layout(ex, classicPlan(root, { ann: ex.ann, meters: !!ex.meters, fmt: (x, u) => Units.format(x, u, ex.prefixes, 4) }));
    const { width: Wt, height: H } = lay;
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" class="ckt" viewBox="0 0 ${rd(Wt)} ${rd(H)}" width="${rd(Wt)}" height="${rd(H)}" ` +
      `direction="ltr" font-family="Arial, Helvetica, sans-serif" font-size="14" role="img" aria-label="שרטוט המעגל">` +
      `<style>.ckt line,.ckt polyline{stroke:#1f2937;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}` +
      `.ckt .ckt-unk{stroke:#d9480f;stroke-width:2.6}.ckt text{fill:#1f2937}.ckt .ckt-q{fill:#d9480f;font-weight:bold}` +
      `.ckt .ckt-fill{fill:#1f2937;stroke:none}.ckt .ckt-plate{stroke-width:3}.ckt .ckt-short{stroke-width:5}` +
      `.ckt .ckt-meter{fill:#fff;stroke:#1f2937;stroke-width:2}</style>` +
      `<rect width="100%" height="100%" fill="#fff"/>` + lay.ctx.o.join('') + `</svg>`;
    return { svg, width: Wt, height: H, boxes: lay.ctx.boxes, split: lay.split, vertical: lay.vertical, mainMeter: lay.mainMeter };
  }

  global.Engine = {
    VERSION, MAX_LEVEL, MAX_ATTEMPTS, TOL, MAX_TRIES, VALUES, UNIT, TYPE_NAMES, KIND_DEFS,
    makeRng, randomSeed, Units, buildCircuit, solve, makeExercise, givensList,
    allowedTypes, allowedKinds, minLevel, levelChoices, Draw: { render, DR },
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<!-- ======================= ממשק ======================= -->
<script>
(function () {
  'use strict';
  const E = window.Engine;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // סמלים בכתיב X_sub ← HTML עם כתב תחתון, מבודד משמאל לימין
  const symHtml = s => s.replace(/\b([RIVP])_([0-9A-Za-z]+)/g, '<bdi dir="ltr">$1<sub>$2</sub></bdi>');

  const st = { settings: null, level: 1, ex: null, failed: 0, finished: false, prevKind: null };

  $('ver').textContent = E.VERSION;
  $('ver2').textContent = E.VERSION;

  // ---------- הגדרות ----------
  function readSettings() {
    return {
      types: ['S', 'P', 'M'].filter(t => $('t' + t).checked),
      level: +$('level').value,
      power: $('power').checked,
      prefixes: $('prefixes').checked,
      meters: $('meters').checked,
    };
  }
  function syncSettings() {
    const s = readSettings(), min = E.minLevel(s.types);
    [...$('level').options].forEach(o => (o.disabled = +o.value < min));
    if (+$('level').value < min) $('level').value = String(min);
    const lvl = +$('level').value;
    let note = '';
    if (!s.types.length) note = 'יש לבחור לפחות סוג מעגל אחד.';
    else if (min === 2) note = 'מעגל מעורב דורש לפחות 3 נגדים, ולכן הרמה המינימלית היא 2.';
    else if (s.types.includes('M') && lvl === 1) note = 'ברמה 1 לא נוצרים מעגלים מעורבים. הם יופיעו מרמה 2.';
    $('setNote').textContent = note;
    $('start').disabled = !s.types.length;
  }
  ['tS', 'tP', 'tM', 'level'].forEach(id => $(id).addEventListener('change', syncSettings));
  syncSettings();

  $('start').addEventListener('click', () => {
    st.settings = readSettings();
    st.level = st.settings.level;
    st.prevKind = null;
    $('setup').hidden = true;
    $('play').hidden = false;
    newExercise();
  });
  $('back').addEventListener('click', () => {
    $('play').hidden = true;
    $('setup').hidden = false;
    window.scrollTo(0, 0);
  });

  // ---------- תרגיל ----------
  function newExercise() {
    const s = st.settings;
    st.ex = E.makeExercise({ level: st.level, types: s.types, power: s.power, prefixes: s.prefixes, meters: s.meters, prevKind: st.prevKind });
    st.prevKind = st.ex.kind;
    st.failed = 0;
    st.finished = false;
    renderExercise();
  }
  function renderExercise() {
    const ex = st.ex, s = st.settings;
    $('lvl').textContent = `רמה ${ex.level}`;
    $('ctype').textContent = 'מעגל ' + E.TYPE_NAMES[ex.ctype];
    $('qtext').innerHTML = symHtml(esc(ex.text));
    const r = E.Draw.render(ex);
    $('circuit').innerHTML = r.svg;
    const svg = $('circuit').querySelector('svg');
    svg.style.maxWidth = Math.round(r.width * 1.15) + 'px';
    // בטלפון: לא מקטינים מתחת ל-78% (גופן של כ-11px); מעגל רחב יותר נגלל הצידה
    svg.style.minWidth = Math.round(r.width * 0.78) + 'px';

    const g = E.givensList(ex).map(x => `<span class="chip" dir="ltr">${symHtml(x.sym)} = ${esc(x.text)}</span>`);
    $('givens').innerHTML = '<span class="muted">נתונים:</span> ' + g.join(' ');
    $('unknown').innerHTML = `<span class="muted">נעלם:</span> <span class="chip unk" dir="ltr">${symHtml(ex.sym)} = ?</span>`;

    $('ansSym').innerHTML = symHtml(ex.sym);
    $('unit').textContent = ex.unit;
    $('prefix').hidden = !s.prefixes;
    $('prefix').value = '1';
    $('ans').value = '';
    $('ans').disabled = false;
    $('checkBtn').disabled = false;
    $('prefix').disabled = false;
    setFeedback('', '');
    $('solution').hidden = true;
    $('showSol').hidden = true;
    $('showSol').textContent = 'הצג פתרון מלא';
    $('steps').innerHTML = ex.steps.map(stepHtml).join('');
    $('next').hidden = false;
    $('choices').hidden = true;
    $('seed').textContent = '#' + ex.seed;
    updateTries();
  }
  function stepHtml(step) {
    const f = x => E.Units.format(x, step.unit, st.ex.prefixes, 4);
    const parts = [step.lhs, step.formula, step.subst].filter(Boolean).map(p => symHtml(esc(p)));
    return `<li><div class="sn">${esc(step.note)}</div><div class="eq" dir="ltr">${parts.join(' = ')} = ${esc(f(step.value))}</div></li>`;
  }
  function updateTries() {
    $('tries').textContent = st.finished ? '' : `ניסיון ${st.failed + 1} מתוך ${E.MAX_ATTEMPTS}`;
  }
  function setFeedback(cls, html) {
    $('feedback').className = 'fb ' + cls;
    $('feedback').innerHTML = html;
  }
  function answerText() {
    return `<bdi dir="ltr">${symHtml(st.ex.sym)} = ${esc(E.Units.formatAnswer(st.ex.answer, st.ex.unit, st.ex.prefixes))}</bdi>`;
  }
  // סוף תרגיל: במקום "תרגיל חדש" מוצגים כפתורי בחירת רמה
  function finish(correct, attempt) {
    st.finished = true;
    $('ans').disabled = true;
    $('prefix').disabled = true;
    $('checkBtn').disabled = true;
    const opts = E.levelChoices(st.level, correct, attempt, E.minLevel(st.settings.types));
    const label = n => (opts.length === 1 ? 'לתרגיל הבא'
      : n > st.level ? `לעלות לרמה ${n}` : n < st.level ? `לרדת לרמה ${n}` : `להישאר ברמה ${n}`);
    $('choices').innerHTML = opts.map(o =>
      `<button type="button" data-level="${o.level}"${o.primary ? ' class="primary"' : ''}>${label(o.level)}</button>`).join('');
    $('choices').hidden = false;
    $('next').hidden = true;
    updateTries();
  }
  $('choices').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-level]');
    if (!b) return;
    st.level = +b.dataset.level;
    newExercise();
  });

  $('ansForm').addEventListener('submit', ev => {
    ev.preventDefault();
    if (st.finished) return;
    const ex = st.ex;
    const num = E.Units.parseNumber($('ans').value);
    if (isNaN(num)) {
      setFeedback('warn', 'נא להקליד מספר בלבד (אפשר נקודה או פסיק עשרוני). הניסיון לא נספר.');
      return;
    }
    const val = num * (st.settings.prefixes ? +$('prefix').value : 1);
    const attempt = st.failed + 1;
    if (E.Units.check(val, ex.answer)) {
      let msg = `נכון! ${answerText()}. `;
      if (st.level >= E.MAX_LEVEL) msg += 'זו הרמה הגבוהה ביותר.';
      else if (attempt >= E.MAX_ATTEMPTS) msg += 'הצלחתם בניסיון השלישי. אפשר לעלות רמה, או להישאר ולתרגל עוד.';
      else msg += 'אפשר לעלות רמה או להישאר באותה רמה.';
      setFeedback('ok', msg);
      $('showSol').hidden = false;
      finish(true, attempt);
    } else {
      st.failed++;
      if (st.failed < E.MAX_ATTEMPTS) {
        const left = E.MAX_ATTEMPTS - st.failed;
        let msg = left === 1 ? 'לא נכון. נשאר ניסיון אחד.' : `לא נכון. נשארו ${left} ניסיונות.`;
        if (E.Units.prefixHint(val, ex.answer)) msg += ' שימו לב ליחידות ולתחיליות: התשובה רחוקה פי 1000 או יותר.';
        setFeedback('bad', msg);
        updateTries();
        $('ans').select();
      } else {
        setFeedback('bad', `לא נכון. התשובה הנכונה: ${answerText()}. הנה הפתרון המלא:`);
        $('solution').hidden = false;
        finish(false, attempt);
      }
    }
  });
  $('showSol').addEventListener('click', () => {
    $('solution').hidden = !$('solution').hidden;
    $('showSol').textContent = $('solution').hidden ? 'הצג פתרון מלא' : 'הסתר פתרון';
  });
  $('next').addEventListener('click', newExercise);
})();
</script>
</body>
